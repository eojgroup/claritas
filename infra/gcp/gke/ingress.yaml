apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claritas-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: claritas.yourdomain.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: claritas-service
            port:
              number: 80