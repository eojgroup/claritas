apiVersion: apps/v1
kind: Deployment
metadata:
  name: claritas-app
  namespace: claritas
  labels:
    app: claritas-app
spec:
  replicas: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: claritas-app
  template:
    metadata:
      labels:
        app: claritas-app
      annotations:
        prometheus.io/scrape: "false"
    spec:
      containers:
        - name: claritas-app
          image: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-app:PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      terminationGracePeriodSeconds: 30