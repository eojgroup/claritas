apiVersion: batch/v1
kind: Job
metadata:
  name: news-backfill
  namespace: claritas
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: curl
          image: curlimages/curl:8.10.1
          env:
            - name: BASE
              value: http://claritas-api.claritas.svc.cluster.local:8080
            - name: COUNTRIES
              value: "us,gb,de,fr,es,it,nl,be,se,no,fi,pl,pt,ie,dk,ch,at,cz,ua,tr,ae,sa,eg,za,ng,ke,in,sg,my,id,ph,th,kr,jp,cn,au,nz,br,ar,cl,mx,ca"
          args:
            - /bin/sh
            - -ceu
            - |
              echo "Backfilling per-country top-headlines ..."
              IFS=','; for c in $COUNTRIES; do
                echo "== $c general =="
                curl --fail --show-error --silent \
                  -H 'content-type: application/json' \
                  -d "{\"country\":\"$c\",\"category\":\"general\",\"pageSize\":100,\"maxPages\":1}" \
                  "$BASE/api/ingest/newsapi/top-headlines" || true
                echo
              done
              echo "Done."

