---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-sql-proxy
  namespace: claritas
# If you use Workload Identity and have a GCP SA with roles/cloudsql.client,
# uncomment and set the annotation below:
#  annotations:
#    iam.gke.io/gcp-service-account: terraform-github-oidc@claritas-457808.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-sql-proxy
  namespace: claritas
spec:
  replicas: 1
  selector:
    matchLabels: { app: cloud-sql-proxy }
  template:
    metadata:
      labels: { app: cloud-sql-proxy }
    spec:
      serviceAccountName: cloud-sql-proxy
      containers:
        - name: proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          args:
            - "--structured-logs"
            - "--address=0.0.0.0"
            - "--port=5432"
            # Reads the ICN from the ConfigMap set above / via pipeline
            - "$(INSTANCE_CONNECTION_NAME)"
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: claritas-config
                  key: INSTANCE_CONNECTION_NAME
          ports:
            - name: psql
              containerPort: 5432
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-sql-proxy
  namespace: claritas
spec:
  type: ClusterIP
  selector: { app: cloud-sql-proxy }
  ports:
    - name: psql
      port: 5432
      targetPort: 5432