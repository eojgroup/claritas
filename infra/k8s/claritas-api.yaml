      containers:
        - name: claritas-api
          # ...
          env:
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: claritas-config, key: DB_NAME } }
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: claritas-config, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_PASSWORD } }
            - name: NEWSAPI_API_KEY
              valueFrom: { secretKeyRef: { name: claritas-newsapi, key: NEWSAPI_API_KEY, optional: true } }
            - name: THENEWSAPI_API_TOKEN
              valueFrom: { secretKeyRef: { name: claritas-thenewsapi, key: THENEWSAPI_API_TOKEN, optional: true } }
            - name: OPENWEATHER_API_KEY
              valueFrom: { secretKeyRef: { name: claritas-openweather, key: OPENWEATHER_API_KEY, optional: true } }
            - name: FINNHUB_API_KEY
              valueFrom: { secretKeyRef: { name: claritas-finnhub, key: FINNHUB_API_KEY, optional: true } }
            - name: BRIEFING_LLM_PROVIDER
              valueFrom: { configMapKeyRef: { name: claritas-config, key: BRIEFING_LLM_PROVIDER, optional: true } }
            - name: OPENCODE_SERVER_URL
              valueFrom: { configMapKeyRef: { name: claritas-config, key: OPENCODE_SERVER_URL, optional: true } }
            - name: OPENCODE_MODEL
              valueFrom: { configMapKeyRef: { name: claritas-config, key: OPENCODE_MODEL, optional: true } }
            - name: OPENCODE_PROVIDER_ID
              valueFrom: { configMapKeyRef: { name: claritas-config, key: OPENCODE_PROVIDER_ID, optional: true } }
            - name: OPENCODE_MODEL_ID
              valueFrom: { configMapKeyRef: { name: claritas-config, key: OPENCODE_MODEL_ID, optional: true } }
            - name: OPENCODE_DISABLE_TOOLS
              valueFrom: { configMapKeyRef: { name: claritas-config, key: OPENCODE_DISABLE_TOOLS, optional: true } }
            - name: OPENCODE_SERVER_USERNAME
              valueFrom: { secretKeyRef: { name: claritas-opencode, key: OPENCODE_SERVER_USERNAME, optional: true } }
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom: { secretKeyRef: { name: claritas-opencode, key: OPENCODE_SERVER_PASSWORD, optional: true } }
            - name: OPENROUTER_API_KEY
              valueFrom: { secretKeyRef: { name: claritas-opencode, key: OPENROUTER_API_KEY, optional: true } }
            - name: AUTH_PROVIDERS
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_PROVIDERS } }
            - name: AUTH_ISSUER_URL
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_ISSUER_URL } }
            - name: AUTH_KEYCLOAK_CLIENT_ID
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_KEYCLOAK_CLIENT_ID } }
            - name: AUTH_KEYCLOAK_SCOPE
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_KEYCLOAK_SCOPE } }
            - name: AUTH_KEYCLOAK_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: claritas-auth, key: AUTH_KEYCLOAK_CLIENT_SECRET, optional: true } }
            - name: INGEST_API_TOKEN
              valueFrom: { secretKeyRef: { name: claritas-auth, key: INGEST_API_TOKEN, optional: true } }
          ports:
            - containerPort: 8080

        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.4
          args:
            - "--structured-logs"
            - "--port=5432"
            - "$(INSTANCE_CONNECTION_NAME)"
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: claritas-config
                  key: INSTANCE_CONNECTION_NAME
          securityContext:
            runAsNonRoot: true
