      containers:
        - name: claritas-api
          # ...
          env:
            - name: DB_HOST
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_PORT } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_NAME } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_PASSWORD } }
          ports:
            - containerPort: 8080

        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.4
          args:
            - "--structured-logs"
            - "--port=5432"
            - "$(INSTANCE_CONNECTION_NAME)"
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: claritas-config
                  key: INSTANCE_CONNECTION_NAME
          securityContext:
            runAsNonRoot: true