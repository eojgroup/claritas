apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claritas
  namespace: claritas
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.allow-http: "true"
    # Keep app/auth certificates independent so auth DNS issues do not block app TLS.
    networking.gke.io/managed-certificates: "claritas-app-cert,claritas-auth-cert"
spec:
  rules:
    - host: app.claritas.info
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: claritas-web
                port: { number: 80 }
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: claritas-api
                port: { number: 8080 }
    - host: auth.claritas.info
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port: { number: 8080 }
