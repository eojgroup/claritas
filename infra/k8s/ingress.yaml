apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claritas
  namespace: claritas
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.allow-http: "true"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: claritas-web
                port: { number: 80 }
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: claritas-api
                port: { number: 8080 }