apiVersion: batch/v1
kind: Job
metadata:
  name: flyway-migrate
  namespace: claritas
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: flyway-sa
      initContainers:
        - name: cloud-sql-proxy-prepare
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          command: ["/bin/sh", "-lc"]
          args:
            - |
              cp /cloud-sql-proxy /workspace/cloud-sql-proxy && \
              chmod +x /workspace/cloud-sql-proxy
          volumeMounts:
            - name: proxy-bin
              mountPath: /workspace
      containers:
        - name: flyway
          image: flyway/flyway:10.17-alpine
          command: ["/bin/sh", "-lc"]
          args:
            - |
              # Start Cloud SQL Proxy in background
              /workspace/cloud-sql-proxy --structured-logs --private-ip --port=5432 "$(INSTANCE_CONNECTION_NAME)" &
              PROXY_PID=$!
              # Run Flyway migrations (retry until DB is reachable)
              /flyway/flyway -connectRetries=60 repair && \
              /flyway/flyway -connectRetries=60 migrate
              STATUS=$?
              # Stop proxy and exit with Flyway status
              kill "$PROXY_PID" || true
              exit "$STATUS"
          env:
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_NAME } }
            - name: FLYWAY_URL
              value: "jdbc:postgresql://127.0.0.1:5432/$(DB_NAME)"
            - name: FLYWAY_USER
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_USER } }
            - name: FLYWAY_PASSWORD
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_PASSWORD } }
            - name: FLYWAY_ENCODING
              value: "UTF-8"
            - name: FLYWAY_LOCATIONS
              value: "filesystem:/flyway/sql"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx256m -XX:MaxRAMPercentage=75"
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: claritas-config
                  key: INSTANCE_CONNECTION_NAME
          volumeMounts:
            - name: flyway-sql
              mountPath: /flyway/sql
            - name: proxy-bin
              mountPath: /workspace
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
      volumes:
        - name: flyway-sql
          configMap:
            name: flyway-scripts
            optional: false
        - name: proxy-bin
          emptyDir: {}
