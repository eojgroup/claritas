apiVersion: batch/v1
kind: Job
metadata:
  name: flyway-migrate
spec:
  backoffLimit: 2
  template:
    spec:
      shareProcessNamespace: true
      restartPolicy: Never
      serviceAccountName: flyway-sa
      containers:
        - name: flyway
          image: flyway/flyway:10.17-alpine
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -e
              # Compose JDBC URL from DB_NAME provided via ConfigMap
              export FLYWAY_URL="jdbc:postgresql://127.0.0.1:5432/${DB_NAME}"
              # Run Flyway migrations (retry until DB is reachable)
              /flyway/flyway -connectRetries=60 repair && \
              /flyway/flyway -connectRetries=60 migrate
              STATUS=$?
              # Signal the sidecar proxy to exit so the Job can complete
              if command -v killall >/dev/null 2>&1; then
                killall cloud-sql-proxy >/dev/null 2>&1 || true
              else
                PIDS=$(ps -eo pid,args | awk '/cloud-sql-proxy/{print $1}')
                [ -n "$PIDS" ] && kill $PIDS || true
              fi
              exit "$STATUS"
          env:
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: claritas-config, key: DB_NAME } }
            - name: FLYWAY_USER
              valueFrom: { configMapKeyRef: { name: claritas-config, key: DB_USER } }
            - name: FLYWAY_PASSWORD
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_PASSWORD } }
            - name: FLYWAY_ENCODING
              value: "UTF-8"
            - name: FLYWAY_LOCATIONS
              value: "filesystem:/flyway/sql"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx256m -XX:MaxRAMPercentage=75"
          volumeMounts:
            - name: flyway-sql
              mountPath: /flyway/sql
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          args:
            - "--structured-logs"
            - "--private-ip"
            - "--port=5432"
            - "$(INSTANCE_CONNECTION_NAME)"
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: claritas-config
                  key: INSTANCE_CONNECTION_NAME
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
      volumes:
        - name: flyway-sql
          configMap:
            name: flyway-scripts
            optional: false
