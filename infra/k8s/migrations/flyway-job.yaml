apiVersion: batch/v1
kind: Job
metadata:
  name: flyway-migrate
  namespace: claritas
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: flyway-sa
      containers:
        - name: flyway
          image: flyway/flyway:10.17-alpine
          command: ["/bin/sh", "-lc"]
          args:
            - |
              /flyway/flyway -connectRetries=60 repair && \
              /flyway/flyway -connectRetries=60 migrate
          env:
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_NAME } }
            - name: FLYWAY_URL
              value: "jdbc:postgresql://127.0.0.1:5432/$(DB_NAME)"
            - name: FLYWAY_USER
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_USER } }
            - name: FLYWAY_PASSWORD
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_PASSWORD } }
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx256m -XX:MaxRAMPercentage=75"
          volumeMounts:
            - name: flyway-sql
              mountPath: /flyway/sql
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          args:
            - "--structured-logs"
            - "--private-ip"                               # <— IMPORTANT
            - "--port=5432"
            - "$(INSTANCE_CONNECTION_NAME)"
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: claritas-config
                  key: INSTANCE_CONNECTION_NAME
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
      volumes:
        - name: flyway-sql
          configMap:
            name: flyway-scripts
            optional: true
