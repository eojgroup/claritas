apiVersion: batch/v1
kind: Job
metadata:
  name: flyway-migrate
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: flyway-sa
      initContainers:
        # A restartable init container is a Kubernetes-native sidecar. Unlike a
        # regular second container, it does not keep a completed Job alive and
        # Kubernetes terminates it after the Flyway container exits.
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          restartPolicy: Always
          command:
            - /cloud-sql-proxy
          args:
            - "--structured-logs"
            - "--private-ip"
            - "--port=5432"
            - "--exit-zero-on-sigterm"
            - "$(INSTANCE_CONNECTION_NAME)"
          # Restartable init containers do not otherwise block the application
          # container until their listener is ready. Prevent Flyway racing the
          # proxy during short-lived Jobs.
          startupProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 45
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: claritas-config
                  key: INSTANCE_CONNECTION_NAME
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
      containers:
        - name: flyway
          image: flyway/flyway:10.17-alpine
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -eu
              # Compose JDBC URL from DB_NAME provided via ConfigMap
              export FLYWAY_URL="jdbc:postgresql://127.0.0.1:5432/${DB_NAME}"
              # The proxy startup probe handles listener readiness; these
              # retries cover brief database-side connection interruptions.
              export FLYWAY_CONNECT_RETRIES=20
              export FLYWAY_CONNECT_RETRIES_INTERVAL=3
              echo "Flyway proxy is ready; applying migrations."
              /flyway/flyway migrate
              /flyway/flyway validate
          env:
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: claritas-config, key: DB_NAME } }
            - name: FLYWAY_USER
              valueFrom: { configMapKeyRef: { name: claritas-config, key: DB_USER } }
            - name: FLYWAY_PASSWORD
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_PASSWORD } }
            - name: FLYWAY_ENCODING
              value: "UTF-8"
            - name: FLYWAY_LOCATIONS
              value: "filesystem:/flyway/sql"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms32m -Xmx192m -XX:MaxRAMPercentage=75"
          volumeMounts:
            - name: flyway-sql
              mountPath: /flyway/sql
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits:   { cpu: "300m", memory: "320Mi" }
          terminationMessagePolicy: FallbackToLogsOnError
      volumes:
        - name: flyway-sql
          configMap:
            name: flyway-scripts
            optional: false
