apiVersion: batch/v1
kind: Job
metadata:
  name: flyway-migrate
spec:
  backoffLimit: 0
  template:
    spec:
      shareProcessNamespace: true
      restartPolicy: Never
      serviceAccountName: flyway-sa
      containers:
        - name: flyway
          image: flyway/flyway:10.17-alpine
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -e
              cleanup_proxy() {
                if command -v killall >/dev/null 2>&1; then
                  killall cloud-sql-proxy >/dev/null 2>&1 || true
                else
                  PIDS=$(ps -eo pid,args | awk '/cloud-sql-proxy/{print $1}')
                  [ -n "$PIDS" ] && kill $PIDS || true
                fi
              }
              trap cleanup_proxy EXIT
              # Compose JDBC URL from DB_NAME provided via ConfigMap
              export FLYWAY_URL="jdbc:postgresql://127.0.0.1:5432/${DB_NAME}"
              # Fail fast on bad credentials/config. Long retry loops hide real errors.
              export FLYWAY_CONNECT_RETRIES=8
              export FLYWAY_CONNECT_RETRIES_INTERVAL=3
              # Apply then validate:
              # - migrate handles expected pending scripts
              # - validate still catches drift/checksum issues afterward
              /flyway/flyway info
              /flyway/flyway migrate
              /flyway/flyway validate
          env:
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: claritas-config, key: DB_NAME } }
            - name: FLYWAY_USER
              valueFrom: { configMapKeyRef: { name: claritas-config, key: DB_USER } }
            - name: FLYWAY_PASSWORD
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_PASSWORD } }
            - name: FLYWAY_ENCODING
              value: "UTF-8"
            - name: FLYWAY_LOCATIONS
              value: "filesystem:/flyway/sql"
            - name: JAVA_TOOL_OPTIONS
              # Keep this short-lived migration Job schedulable on the small
              # production node pool. Flyway only loads the migration set once.
              value: "-Xms32m -Xmx128m -XX:MaxRAMPercentage=75"
          volumeMounts:
            - name: flyway-sql
              mountPath: /flyway/sql
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "192Mi" }
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          command:
            - /cloud-sql-proxy
          args:
            - "--structured-logs"
            - "--private-ip"
            - "--port=5432"
            - "--exit-zero-on-sigterm"
            - "$(INSTANCE_CONNECTION_NAME)"
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: claritas-config
                  key: INSTANCE_CONNECTION_NAME
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
      volumes:
        - name: flyway-sql
          configMap:
            name: flyway-scripts
            optional: false
