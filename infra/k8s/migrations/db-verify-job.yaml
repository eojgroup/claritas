apiVersion: batch/v1
kind: Job
metadata:
  name: db-verify
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: flyway-sa
      initContainers:
        # Keep the proxy available for the verification command without making
        # it part of the Job's completion condition.
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          restartPolicy: Always
          command:
            - /cloud-sql-proxy
          args:
            - "--structured-logs"
            - "--private-ip"
            - "--port=5432"
            - "--exit-zero-on-sigterm"
            - "$(INSTANCE_CONNECTION_NAME)"
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: claritas-config
                  key: INSTANCE_CONNECTION_NAME
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
      containers:
        - name: db-verify
          image: postgres:16-alpine
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -euo pipefail
              export PGPASSWORD="${DB_PASSWORD}"

              # Wait for cloud-sql-proxy sidecar to be ready on localhost.
              for i in $(seq 1 30); do
                if pg_isready -h 127.0.0.1 -p 5432 -U "${DB_USER}" -d "${DB_NAME}" >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              if ! pg_isready -h 127.0.0.1 -p 5432 -U "${DB_USER}" -d "${DB_NAME}" >/dev/null 2>&1; then
                echo "ERROR: cloud-sql-proxy/database not ready after wait window" >&2
                exit 1
              fi

              psql "host=127.0.0.1 port=5432 dbname=${DB_NAME} user=${DB_USER} sslmode=disable" -v ON_ERROR_STOP=1 <<'SQL'
              \set ON_ERROR_STOP on
              -- Ensure core tables exist
              SELECT count(*) AS missing_tables
              FROM (VALUES
                ('flyway_schema_history'),
                ('source'),
                ('source_feed'),
                ('ingestion_run'),
                ('country'),
                ('item'),
                ('weather_snapshot'),
                ('market_snapshot'),
                ('app_user'),
                ('auth_identity'),
                ('auth_session'),
                ('auth_role'),
                ('auth_user_role'),
                ('auth_state')
              ) AS t(name)
              WHERE to_regclass('public.' || t.name) IS NULL;
              \gset
              \if :missing_tables != 0
                \echo 'Missing required tables:'
                SELECT array_agg(t.name)
                FROM (VALUES
                  ('flyway_schema_history'),
                  ('source'),
                  ('source_feed'),
                  ('ingestion_run'),
                  ('country'),
                  ('item'),
                  ('weather_snapshot'),
                  ('market_snapshot'),
                  ('app_user'),
                  ('auth_identity'),
                  ('auth_session'),
                  ('auth_role'),
                  ('auth_user_role'),
                  ('auth_state')
                ) AS t(name)
                WHERE to_regclass('public.' || t.name) IS NULL;
                \quit 1
              \endif

              -- Flyway migrate/validate has already checked the repository's
              -- current scripts. Independently reject any failed history row
              -- without duplicating a version list that becomes stale.
              SELECT count(*) AS failed_migrations
              FROM flyway_schema_history
              WHERE success IS DISTINCT FROM true;
              \gset
              \if :failed_migrations != 0
                \echo 'Unsuccessful Flyway history entries:'
                SELECT installed_rank, version, description, success
                FROM flyway_schema_history
                WHERE success IS DISTINCT FROM true
                ORDER BY installed_rank;
                \quit 1
              \endif
              SQL

          env:
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: claritas-config, key: DB_NAME } }
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: claritas-config, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_PASSWORD } }
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
