apiVersion: batch/v1
kind: Job
metadata:
  name: db-verify
spec:
  backoffLimit: 1
  template:
    spec:
      shareProcessNamespace: true
      restartPolicy: Never
      serviceAccountName: flyway-sa
      containers:
        - name: db-verify
          image: postgres:16-alpine
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -euo pipefail
              export PGPASSWORD="${DB_PASSWORD}"

              # Wait for cloud-sql-proxy sidecar to be ready on localhost.
              for i in $(seq 1 30); do
                if pg_isready -h 127.0.0.1 -p 5432 -U "${DB_USER}" -d "${DB_NAME}" >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              if ! pg_isready -h 127.0.0.1 -p 5432 -U "${DB_USER}" -d "${DB_NAME}" >/dev/null 2>&1; then
                echo "ERROR: cloud-sql-proxy/database not ready after wait window" >&2
                exit 1
              fi

              psql "host=127.0.0.1 port=5432 dbname=${DB_NAME} user=${DB_USER} sslmode=disable" -v ON_ERROR_STOP=1 <<'SQL'
              \set ON_ERROR_STOP on
              -- Ensure core tables exist
              SELECT count(*) AS missing_tables
              FROM (VALUES
                ('flyway_schema_history'),
                ('source'),
                ('source_feed'),
                ('ingestion_run'),
                ('country'),
                ('item'),
                ('weather_snapshot'),
                ('market_snapshot'),
                ('app_user'),
                ('auth_identity'),
                ('auth_session'),
                ('auth_role'),
                ('auth_user_role'),
                ('auth_state')
              ) AS t(name)
              WHERE to_regclass('public.' || t.name) IS NULL;
              \gset
              \if :missing_tables != 0
                \echo 'Missing required tables:'
                SELECT array_agg(t.name)
                FROM (VALUES
                  ('flyway_schema_history'),
                  ('source'),
                  ('source_feed'),
                  ('ingestion_run'),
                  ('country'),
                  ('item'),
                  ('weather_snapshot'),
                  ('market_snapshot'),
                  ('app_user'),
                  ('auth_identity'),
                  ('auth_session'),
                  ('auth_role'),
                  ('auth_user_role'),
                  ('auth_state')
                ) AS t(name)
                WHERE to_regclass('public.' || t.name) IS NULL;
                \quit 1
              \endif

              -- Ensure all expected migrations are marked successful
              SELECT count(*) AS missing_versions
              FROM (VALUES ('1'), ('2'), ('3'), ('4'), ('5'), ('6'), ('7'), ('8'), ('9')) AS v(version)
              WHERE NOT EXISTS (
                SELECT 1
                FROM flyway_schema_history f
                WHERE f.version = v.version
                  AND f.success = true
              );
              \gset
              \if :missing_versions != 0
                \echo 'Missing successful Flyway versions:'
                SELECT array_agg(v.version)
                FROM (VALUES ('1'), ('2'), ('3'), ('4'), ('5'), ('6'), ('7'), ('8'), ('9')) AS v(version)
                WHERE NOT EXISTS (
                  SELECT 1
                  FROM flyway_schema_history f
                  WHERE f.version = v.version
                    AND f.success = true
                );
                \quit 1
              \endif
              SQL

              # Stop sidecar so Job can complete.
              if command -v killall >/dev/null 2>&1; then
                killall cloud-sql-proxy >/dev/null 2>&1 || true
              else
                PIDS=$(ps -eo pid,args | awk '/cloud-sql-proxy/{print $1}')
                [ -n "$PIDS" ] && kill $PIDS || true
              fi
          env:
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: claritas-config, key: DB_NAME } }
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: claritas-config, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_PASSWORD } }
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          command:
            - /cloud-sql-proxy
          args:
            - "--structured-logs"
            - "--private-ip"
            - "--port=5432"
            - "--exit-zero-on-sigterm"
            - "$(INSTANCE_CONNECTION_NAME)"
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: claritas-config
                  key: INSTANCE_CONNECTION_NAME
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
