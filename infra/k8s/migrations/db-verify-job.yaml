apiVersion: batch/v1
kind: Job
metadata:
  name: db-verify
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: flyway-sa
      initContainers:
        # Keep the proxy available for the verification command without making
        # it part of the Job's completion condition.
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          restartPolicy: Always
          command:
            - /cloud-sql-proxy
          args:
            - "--structured-logs"
            - "--private-ip"
            - "--port=5432"
            - "--exit-zero-on-sigterm"
            - "$(INSTANCE_CONNECTION_NAME)"
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: claritas-config
                  key: INSTANCE_CONNECTION_NAME
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
      containers:
        - name: db-verify
          image: postgres:16-alpine
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -euo pipefail
              export PGPASSWORD="${DB_PASSWORD}"

              # Wait for cloud-sql-proxy sidecar to be ready on localhost.
              for i in $(seq 1 30); do
                if pg_isready -h 127.0.0.1 -p 5432 -U "${DB_USER}" -d "${DB_NAME}" >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              if ! pg_isready -h 127.0.0.1 -p 5432 -U "${DB_USER}" -d "${DB_NAME}" >/dev/null 2>&1; then
                echo "ERROR: cloud-sql-proxy/database not ready after wait window" >&2
                exit 1
              fi

              psql "host=127.0.0.1 port=5432 dbname=${DB_NAME} user=${DB_USER} sslmode=disable" -v ON_ERROR_STOP=1 <<'SQL'
              \set ON_ERROR_STOP on
              -- Raise server-side exceptions so verification cannot silently
              -- pass because of psql meta-command expression parsing.
              DO $verify_tables$
              DECLARE
                missing_tables text[];
              BEGIN
                SELECT array_agg(t.name ORDER BY t.name)
                INTO missing_tables
                FROM (VALUES
                  ('flyway_schema_history'),
                  ('source'),
                  ('source_feed'),
                  ('ingestion_run'),
                  ('country'),
                  ('item'),
                  ('item_translation'),
                  ('weather_snapshot'),
                  ('market_snapshot'),
                  ('app_user'),
                  ('auth_identity'),
                  ('auth_session'),
                  ('auth_role'),
                  ('auth_user_role'),
                  ('auth_state'),
                  ('intelligence_location'),
                  ('physical_asset'),
                  ('intelligence_event'),
                  ('intelligence_event_evidence'),
                  ('event_outbox'),
                  ('consumed_domain_event'),
                  ('earth_scene'),
                  ('earth_observation'),
                  ('earth_observation_asset'),
                  ('earth_processing_job'),
                  ('earth_provider_usage'),
                  ('earth_fire_detection'),
                  ('earthquake_observation'),
                  ('transport_country_activity_day'),
                  ('transport_corridor_activity_day'),
                  ('alert_candidate'),
                  ('alert_candidate_recipient'),
                  ('alert_email_delivery'),
                  ('news_translation_usage'),
                  ('user_intelligence_watchlist')
                ) AS t(name)
                WHERE to_regclass('public.' || t.name) IS NULL;

                IF COALESCE(cardinality(missing_tables), 0) > 0 THEN
                  RAISE EXCEPTION 'Missing required tables: %', missing_tables;
                END IF;
                RAISE NOTICE 'All required tables are present.';
              END
              $verify_tables$;

              DO $verify_extensions$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'postgis') THEN
                  RAISE EXCEPTION 'PostGIS extension is not installed.';
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'pgcrypto') THEN
                  RAISE EXCEPTION 'pgcrypto extension is not installed.';
                END IF;
                RAISE NOTICE 'PostGIS and pgcrypto extensions are present.';
              END
              $verify_extensions$;

              DO $verify_functions$
              BEGIN
                IF to_regprocedure(
                  'materialize_alert_email_deliveries(uuid,bigint,integer,integer,integer,integer)'
                ) IS NULL THEN
                  RAISE EXCEPTION 'Required important-event email materialization function is missing.';
                END IF;
                RAISE NOTICE 'Required important-event email functions are present.';
              END
              $verify_functions$;

              -- Flyway migrate/validate has already checked the repository's
              -- current scripts. Independently reject any failed history row
              -- without duplicating a version list that becomes stale.
              DO $verify_history$
              DECLARE
                failed_migrations integer;
              BEGIN
                SELECT count(*)
                INTO failed_migrations
                FROM flyway_schema_history
                WHERE success IS DISTINCT FROM true;

                IF failed_migrations > 0 THEN
                  RAISE EXCEPTION 'Flyway history contains % unsuccessful migration(s).', failed_migrations;
                END IF;
                RAISE NOTICE 'Flyway history contains no unsuccessful migrations.';
              END
              $verify_history$;
              SQL

          env:
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: claritas-config, key: DB_NAME } }
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: claritas-config, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_PASSWORD } }
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
