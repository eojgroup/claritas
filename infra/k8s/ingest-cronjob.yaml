apiVersion: batch/v1
kind: CronJob
metadata:
  name: claritas-ingest-intelligence
  namespace: claritas
spec:
  # Daily at 03:00 UTC. Change this cron string to adjust recurrence.
  schedule: "0 3 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: claritas-ingest-intelligence
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.10.1
              imagePullPolicy: IfNotPresent
              env:
                - name: INGEST_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: claritas-auth
                      key: INGEST_API_TOKEN
                      optional: true
              args:
                - /bin/sh
                - -ceu
                - |
                  echo "Starting scheduled intelligence ingests..."
                  BASE_URL="http://claritas-api.claritas.svc.cluster.local:8080"
                  echo "> /api/ingest/gdelt (DOC + Event + GKG)"
                  curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 300 \
                    -H 'content-type: application/json' \
                    -H "x-ingest-token: ${INGEST_API_TOKEN:-}" \
                    -d '{"timespan":"24h","maxRecords":100}' \
                    "$BASE_URL/api/ingest/gdelt"
                  echo
                  echo "> /api/ingest/institutional-rss (official institutional feeds)"
                  curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 300 \
                    -H 'content-type: application/json' \
                    -H "x-ingest-token: ${INGEST_API_TOKEN:-}" \
                    -d '{}' \
                    "$BASE_URL/api/ingest/institutional-rss"
                  echo
                  echo "> /api/ingest/sec-edgar (filings + company facts)"
                  curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 300 \
                    -H 'content-type: application/json' \
                    -H "x-ingest-token: ${INGEST_API_TOKEN:-}" \
                    -d '{}' \
                    "$BASE_URL/api/ingest/sec-edgar"
                  echo
                  echo "> /api/ingest/ecb (FX + policy series)"
                  curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 300 \
                    -H 'content-type: application/json' \
                    -H "x-ingest-token: ${INGEST_API_TOKEN:-}" \
                    -d '{}' \
                    "$BASE_URL/api/ingest/ecb"
                  echo
                  echo "> /api/ingest/oecd (country share-price indices)"
                  curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 180 \
                    -H 'content-type: application/json' \
                    -H "x-ingest-token: ${INGEST_API_TOKEN:-}" \
                    -d '{}' \
                    "$BASE_URL/api/ingest/oecd"
                  echo
                  echo "> /api/ingest/nws/alerts (official US alerts)"
                  curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 180 \
                    -H 'content-type: application/json' \
                    -H "x-ingest-token: ${INGEST_API_TOKEN:-}" \
                    -d '{}' \
                    "$BASE_URL/api/ingest/nws/alerts"
                  echo
                  echo "> /api/ingest/openweather/country-current (global sample set)"
                  curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 180 \
                    -H 'content-type: application/json' \
                    -H "x-ingest-token: ${INGEST_API_TOKEN:-}" \
                    -d '{}' \
                    "$BASE_URL/api/ingest/openweather/country-current"
                  echo
                  echo "Ingest completed."
