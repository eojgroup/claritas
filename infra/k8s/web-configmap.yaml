apiVersion: v1
kind: ConfigMap
metadata:
  name: claritas-web-content
  namespace: claritas
data:
  index.html: |
    <!doctype html>
    <html>
      <head>
        <meta charset="utf-8" />
        <title>Claritas</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
          body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; 
                 margin: 0; display: grid; place-items: center; height: 100vh; background: #0f1221; color: #e8ecff; }
          .card { padding: 2.5rem 3rem; border-radius: 16px; background: #171a2b; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
          h1 { margin: 0 0 .5rem; font-size: 2rem; }
          p { margin: 0; opacity: .85; }
        </style>
      </head>
      <body>
        <div class="card">
          <h1>Claritas Web</h1>
          <p>Unified data platform — lightweight landing page.</p>
        </div>
      </body>
    </html>
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # Health checks
      location = /healthz { return 200; }
      location = /readyz  { return 200; }
    }