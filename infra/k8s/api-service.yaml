apiVersion: v1
kind: Service
metadata:
  name: claritas-api
  namespace: claritas
  labels: { app: claritas-api }
  annotations:
    cloud.google.com/backend-config: '{"default":"api-backendconfig"}'
spec:
  selector: { app: claritas-api }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
