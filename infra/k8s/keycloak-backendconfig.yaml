apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: keycloak-backendconfig
  namespace: claritas
spec:
  customResponseHeaders:
    headers:
      - "Strict-Transport-Security: max-age=31536000"
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /realms/claritas
    port: 8080
