apiVersion: apps/v1
kind: Deployment
metadata:
  name: claritas-api
  namespace: claritas
spec:
  # Cost baseline: one API replica on the single private static-egress node.
  # Scale replicas and api_egress_node_locations together when HA is required.
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: claritas-api }
  template:
    metadata:
      labels: { app: claritas-api }
    spec:
      serviceAccountName: api-sa
      nodeSelector:
        claritas-egress: static
      tolerations:
        - key: dedicated
          operator: Equal
          value: claritas-api
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: claritas-api
      containers:
        - name: claritas-api
          image: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-api:latest
          env:
            - name: OPENWEATHER_API_KEY
              valueFrom: { secretKeyRef: { name: claritas-openweather, key: OPENWEATHER_API_KEY, optional: true } }
            - name: COPERNICUS_CLIENT_ID
              valueFrom: { secretKeyRef: { name: claritas-earth-observation, key: COPERNICUS_CLIENT_ID, optional: true } }
            - name: COPERNICUS_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: claritas-earth-observation, key: COPERNICUS_CLIENT_SECRET, optional: true } }
            - name: NASA_FIRMS_MAP_KEY
              valueFrom: { secretKeyRef: { name: claritas-earth-observation, key: NASA_FIRMS_MAP_KEY, optional: true } }
            - name: EVENT_BACKBONE_ENABLED
              valueFrom: { configMapKeyRef: { name: claritas-config, key: EVENT_BACKBONE_ENABLED, optional: true } }
            - name: EVENT_BUS_MODE
              valueFrom: { configMapKeyRef: { name: claritas-config, key: EVENT_BUS_MODE, optional: true } }
            - name: EVENT_PUBSUB_TOPIC
              valueFrom: { configMapKeyRef: { name: claritas-config, key: EVENT_PUBSUB_TOPIC, optional: true } }
            - name: EVENT_PUBSUB_SUBSCRIPTION
              valueFrom: { configMapKeyRef: { name: claritas-config, key: EVENT_PUBSUB_SUBSCRIPTION, optional: true } }
            - name: EVENT_OUTBOX_POLL_SECONDS
              valueFrom: { configMapKeyRef: { name: claritas-config, key: EVENT_OUTBOX_POLL_SECONDS, optional: true } }
            - name: EVENT_OUTBOX_BATCH_SIZE
              valueFrom: { configMapKeyRef: { name: claritas-config, key: EVENT_OUTBOX_BATCH_SIZE, optional: true } }
            - name: EVENT_OUTBOX_MAX_ATTEMPTS
              valueFrom: { configMapKeyRef: { name: claritas-config, key: EVENT_OUTBOX_MAX_ATTEMPTS, optional: true } }
            - name: EVENT_CONSUMER_MAX_MESSAGES
              valueFrom: { configMapKeyRef: { name: claritas-config, key: EVENT_CONSUMER_MAX_MESSAGES, optional: true } }
            - name: EVENT_CORRELATION_ENABLED
              valueFrom: { configMapKeyRef: { name: claritas-config, key: EVENT_CORRELATION_ENABLED, optional: true } }
            - name: EVENT_ALERTS_ENABLED
