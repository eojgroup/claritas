apiVersion: apps/v1
kind: Deployment
metadata:
  name: claritas-api
  namespace: claritas
spec:
  replicas: 2
  selector:
    matchLabels: { app: claritas-api }
  template:
    metadata:
      labels: { app: claritas-api }
    spec:
      serviceAccountName: api-sa
      containers:
        - name: claritas-api
          image: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-api:latest
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom: { configMapKeyRef: { name: claritas-config, key: INSTANCE_CONNECTION_NAME } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_NAME } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_PASSWORD } }
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_PORT
              value: "5432"
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          args:
            - "--structured-logs"
            - "--private-ip"                               # <— IMPORTANT
            - "--port=5432"
            - "$(INSTANCE_CONNECTION_NAME)"
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: claritas-config
                  key: INSTANCE_CONNECTION_NAME
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
