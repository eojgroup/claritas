apiVersion: apps/v1
kind: Deployment
metadata:
  name: claritas-api
  namespace: claritas
spec:
  replicas: 2
  selector:
    matchLabels: { app: claritas-api }
  template:
    metadata:
      labels: { app: claritas-api }
    spec:
      serviceAccountName: api-sa
      containers:
        - name: claritas-api
          image: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-api:latest
          env:
            - name: NEWSAPI_API_KEY
              valueFrom: { secretKeyRef: { name: claritas-newsapi, key: NEWSAPI_API_KEY } }
            - name: OPENWEATHER_API_KEY
              valueFrom: { secretKeyRef: { name: claritas-openweather, key: OPENWEATHER_API_KEY } }
            - name: INSTANCE_CONNECTION_NAME
              valueFrom: { configMapKeyRef: { name: claritas-config, key: INSTANCE_CONNECTION_NAME } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_NAME } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_PASSWORD } }
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_PORT
              value: "5432"
            - name: AUTH_BASE_URL
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_BASE_URL } }
            - name: AUTH_SUCCESS_REDIRECT_URL
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_SUCCESS_REDIRECT_URL } }
            - name: AUTH_FAILURE_REDIRECT_URL
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_FAILURE_REDIRECT_URL } }
            - name: AUTH_ALLOWED_REDIRECTS
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_ALLOWED_REDIRECTS } }
            - name: AUTH_COOKIE_SECURE
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_COOKIE_SECURE } }
            - name: AUTH_SESSION_TTL_DAYS
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_SESSION_TTL_DAYS } }
            - name: AUTH_STATE_TTL_MINUTES
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_STATE_TTL_MINUTES } }
            - name: AUTH_GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: claritas-auth, key: AUTH_GOOGLE_CLIENT_ID } }
            - name: AUTH_GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: claritas-auth, key: AUTH_GOOGLE_CLIENT_SECRET } }
            - name: AUTH_MICROSOFT_CLIENT_ID
              valueFrom: { secretKeyRef: { name: claritas-auth, key: AUTH_MICROSOFT_CLIENT_ID } }
            - name: AUTH_MICROSOFT_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: claritas-auth, key: AUTH_MICROSOFT_CLIENT_SECRET } }
            - name: AUTH_MICROSOFT_TENANT_ID
              valueFrom: { secretKeyRef: { name: claritas-auth, key: AUTH_MICROSOFT_TENANT_ID } }
            - name: AUTH_APPLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: claritas-auth, key: AUTH_APPLE_CLIENT_ID } }
            - name: AUTH_APPLE_TEAM_ID
              valueFrom: { secretKeyRef: { name: claritas-auth, key: AUTH_APPLE_TEAM_ID } }
            - name: AUTH_APPLE_KEY_ID
              valueFrom: { secretKeyRef: { name: claritas-auth, key: AUTH_APPLE_KEY_ID } }
            - name: AUTH_APPLE_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: claritas-auth, key: AUTH_APPLE_PRIVATE_KEY } }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          args:
            - "--structured-logs"
            - "--private-ip"                               # <— IMPORTANT
            - "--port=5432"
            - "$(INSTANCE_CONNECTION_NAME)"
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: claritas-config
                  key: INSTANCE_CONNECTION_NAME
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
