apiVersion: apps/v1
kind: Deployment
metadata:
  name: claritas-api
  namespace: claritas
spec:
  replicas: 2
  selector:
    matchLabels: { app: claritas-api }
  template:
    metadata:
      labels: { app: claritas-api }
    spec:
      serviceAccountName: api-sa
      nodeSelector:
        claritas-egress: static
      tolerations:
        - key: dedicated
          operator: Equal
          value: claritas-api
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: claritas-api
      containers:
        - name: claritas-api
          image: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-api:latest
          env:
            - name: NEWSAPI_API_KEY
              valueFrom: { secretKeyRef: { name: claritas-newsapi, key: NEWSAPI_API_KEY, optional: true } }
            - name: THENEWSAPI_API_TOKEN
              valueFrom: { secretKeyRef: { name: claritas-thenewsapi, key: THENEWSAPI_API_TOKEN, optional: true } }
            - name: OPENWEATHER_API_KEY
              valueFrom: { secretKeyRef: { name: claritas-openweather, key: OPENWEATHER_API_KEY, optional: true } }
            - name: FINNHUB_API_KEY
              valueFrom: { secretKeyRef: { name: claritas-finnhub, key: FINNHUB_API_KEY, optional: true } }
            - name: PODCASTINDEX_API_KEY
              valueFrom: { secretKeyRef: { name: claritas-podcastindex, key: PODCASTINDEX_API_KEY, optional: true } }
            - name: PODCASTINDEX_API_SECRET
              valueFrom: { secretKeyRef: { name: claritas-podcastindex, key: PODCASTINDEX_API_SECRET, optional: true } }
            - name: AISSTREAM_API_KEY
              valueFrom: { secretKeyRef: { name: claritas-aisstream, key: AISSTREAM_API_KEY, optional: true } }
            - name: AISSTREAM_SAMPLE_SECONDS
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AISSTREAM_SAMPLE_SECONDS, optional: true } }
            - name: ADSB_LOL_POLL_ENABLED
              valueFrom: { configMapKeyRef: { name: claritas-config, key: ADSB_LOL_POLL_ENABLED, optional: true } }
            - name: ADSB_LOL_POLL_SECONDS
              valueFrom: { configMapKeyRef: { name: claritas-config, key: ADSB_LOL_POLL_SECONDS, optional: true } }
            - name: ADSB_LOL_MAX_ROUTE_LOOKUPS
              valueFrom: { configMapKeyRef: { name: claritas-config, key: ADSB_LOL_MAX_ROUTE_LOOKUPS, optional: true } }
            - name: ADSB_LOL_USER_AGENT
              valueFrom: { configMapKeyRef: { name: claritas-config, key: ADSB_LOL_USER_AGENT, optional: true } }
            - name: PODCAST_DISCOVERY_TERMS
              valueFrom: { configMapKeyRef: { name: claritas-config, key: PODCAST_DISCOVERY_TERMS, optional: true } }
            - name: PODCAST_FEED_IDS
              valueFrom: { configMapKeyRef: { name: claritas-config, key: PODCAST_FEED_IDS, optional: true } }
            - name: PODCAST_MAX_FEEDS
              valueFrom: { configMapKeyRef: { name: claritas-config, key: PODCAST_MAX_FEEDS, optional: true } }
            - name: PODCAST_MAX_EPISODES_PER_FEED
              valueFrom: { configMapKeyRef: { name: claritas-config, key: PODCAST_MAX_EPISODES_PER_FEED, optional: true } }
            - name: PODCAST_INTELLIGENCE_EXTRACTION_ENABLED
              valueFrom: { configMapKeyRef: { name: claritas-config, key: PODCAST_INTELLIGENCE_EXTRACTION_ENABLED, optional: true } }
            - name: PODCASTINDEX_USER_AGENT
              valueFrom: { configMapKeyRef: { name: claritas-config, key: PODCASTINDEX_USER_AGENT, optional: true } }
            - name: WIKIDATA_USER_AGENT
              valueFrom: { configMapKeyRef: { name: claritas-config, key: WIKIDATA_USER_AGENT, optional: true } }
            - name: BRIEFING_LLM_PROVIDER
              valueFrom: { configMapKeyRef: { name: claritas-config, key: BRIEFING_LLM_PROVIDER, optional: true } }
            - name: OPENCODE_SERVER_URL
              valueFrom: { configMapKeyRef: { name: claritas-config, key: OPENCODE_SERVER_URL, optional: true } }
            - name: OPENCODE_MODEL
              valueFrom: { configMapKeyRef: { name: claritas-config, key: OPENCODE_MODEL, optional: true } }
            - name: OPENCODE_PROVIDER_ID
              valueFrom: { configMapKeyRef: { name: claritas-config, key: OPENCODE_PROVIDER_ID, optional: true } }
            - name: OPENCODE_MODEL_ID
              valueFrom: { configMapKeyRef: { name: claritas-config, key: OPENCODE_MODEL_ID, optional: true } }
            - name: OPENCODE_DISABLE_TOOLS
              valueFrom: { configMapKeyRef: { name: claritas-config, key: OPENCODE_DISABLE_TOOLS, optional: true } }
            - name: OPENCODE_SERVER_USERNAME
              valueFrom: { secretKeyRef: { name: claritas-opencode, key: OPENCODE_SERVER_USERNAME, optional: true } }
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom: { secretKeyRef: { name: claritas-opencode, key: OPENCODE_SERVER_PASSWORD, optional: true } }
            - name: OPENROUTER_API_KEY
              valueFrom: { secretKeyRef: { name: claritas-opencode, key: OPENROUTER_API_KEY, optional: true } }
            - name: SMTP_HOST
              valueFrom: { configMapKeyRef: { name: claritas-smtp, key: SMTP_HOST, optional: true } }
            - name: SMTP_PORT
              valueFrom: { configMapKeyRef: { name: claritas-smtp, key: SMTP_PORT, optional: true } }
            - name: SMTP_SECURE
              valueFrom: { configMapKeyRef: { name: claritas-smtp, key: SMTP_SECURE, optional: true } }
            - name: SMTP_FROM
              valueFrom: { configMapKeyRef: { name: claritas-smtp, key: SMTP_FROM, optional: true } }
            - name: SMTP_FROM_NAME
              valueFrom: { configMapKeyRef: { name: claritas-smtp, key: SMTP_FROM_NAME, optional: true } }
            - name: SMTP_REPLY_TO
              valueFrom: { configMapKeyRef: { name: claritas-smtp, key: SMTP_REPLY_TO, optional: true } }
            - name: EMAIL_PUBLIC_BASE_URL
              valueFrom: { configMapKeyRef: { name: claritas-smtp, key: EMAIL_PUBLIC_BASE_URL, optional: true } }
            - name: PERSONAL_BRIEFING_WORKER_ENABLED
              valueFrom: { configMapKeyRef: { name: claritas-smtp, key: PERSONAL_BRIEFING_WORKER_ENABLED, optional: true } }
            - name: SMTP_USER
              valueFrom: { secretKeyRef: { name: claritas-smtp, key: SMTP_USER, optional: true } }
            - name: SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: claritas-smtp, key: SMTP_PASSWORD, optional: true } }
            - name: INSTANCE_CONNECTION_NAME
              valueFrom: { configMapKeyRef: { name: claritas-config, key: INSTANCE_CONNECTION_NAME } }
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: claritas-config, key: DB_NAME } }
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: claritas-config, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: claritas-db, key: DB_PASSWORD } }
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_PORT
              value: "5432"
            - name: AUTH_BASE_URL
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_BASE_URL } }
            - name: AUTH_PROVIDERS
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_PROVIDERS } }
            - name: AUTH_ISSUER_URL
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_ISSUER_URL } }
            - name: AUTH_KEYCLOAK_CLIENT_ID
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_KEYCLOAK_CLIENT_ID } }
            - name: AUTH_KEYCLOAK_SCOPE
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_KEYCLOAK_SCOPE } }
            - name: AUTH_KEYCLOAK_IDP_HINT_GOOGLE
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_KEYCLOAK_IDP_HINT_GOOGLE } }
            - name: AUTH_KEYCLOAK_IDP_HINT_MICROSOFT
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_KEYCLOAK_IDP_HINT_MICROSOFT } }
            - name: AUTH_KEYCLOAK_IDP_HINT_APPLE
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_KEYCLOAK_IDP_HINT_APPLE } }
            - name: AUTH_SUCCESS_REDIRECT_URL
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_SUCCESS_REDIRECT_URL } }
            - name: AUTH_FAILURE_REDIRECT_URL
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_FAILURE_REDIRECT_URL } }
            - name: AUTH_ALLOWED_REDIRECTS
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_ALLOWED_REDIRECTS } }
            - name: AUTH_ALLOWED_REDIRECT_SCHEMES
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_ALLOWED_REDIRECT_SCHEMES } }
            - name: AUTH_KEYCLOAK_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: claritas-auth, key: AUTH_KEYCLOAK_CLIENT_SECRET, optional: true } }
            - name: INGEST_API_TOKEN
              valueFrom: { secretKeyRef: { name: claritas-auth, key: INGEST_API_TOKEN, optional: true } }
            - name: AUTH_COOKIE_SECURE
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_COOKIE_SECURE } }
            - name: AUTH_SESSION_TTL_DAYS
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_SESSION_TTL_DAYS } }
            - name: AUTH_STATE_TTL_MINUTES
              valueFrom: { configMapKeyRef: { name: claritas-config, key: AUTH_STATE_TTL_MINUTES } }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          args:
            - "--structured-logs"
            - "--private-ip"                               # <— IMPORTANT
            - "--port=5432"
            - "$(INSTANCE_CONNECTION_NAME)"
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: claritas-config
                  key: INSTANCE_CONNECTION_NAME
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
