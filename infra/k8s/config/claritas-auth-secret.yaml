apiVersion: v1
kind: Secret
metadata:
  name: claritas-auth
  namespace: claritas
type: Opaque
stringData:
  AUTH_KEYCLOAK_CLIENT_SECRET: "<keycloak-client-secret>"
  INGEST_API_TOKEN: "<shared-ingest-token>"
  KEYCLOAK_DB_PASSWORD: "<keycloak-db-password>"
  KEYCLOAK_ADMIN: "<keycloak-admin-user>"
  KEYCLOAK_ADMIN_PASSWORD: "<keycloak-admin-password>"
  KC_IDP_GOOGLE_CLIENT_ID: "<google-client-id>"
  KC_IDP_GOOGLE_CLIENT_SECRET: "<google-client-secret>"
  KC_IDP_MICROSOFT_CLIENT_ID: "<microsoft-client-id>"
  KC_IDP_MICROSOFT_CLIENT_SECRET: "<microsoft-client-secret>"
  KC_IDP_MICROSOFT_TENANT: "common"
  KC_IDP_APPLE_CLIENT_ID: "<apple-services-id>"
  KC_IDP_APPLE_TEAM_ID: "<apple-team-id>"
  KC_IDP_APPLE_KEY_ID: "<apple-key-id>"
  KC_IDP_APPLE_PRIVATE_KEY: "<apple-private-key-pem>"
