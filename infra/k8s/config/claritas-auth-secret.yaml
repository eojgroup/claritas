apiVersion: v1
kind: Secret
metadata:
  name: claritas-auth
  namespace: claritas
type: Opaque
stringData:
  AUTH_GOOGLE_CLIENT_ID: "<google-client-id>"
  AUTH_GOOGLE_CLIENT_SECRET: "<google-client-secret>"
  AUTH_MICROSOFT_CLIENT_ID: "<microsoft-client-id>"
  AUTH_MICROSOFT_CLIENT_SECRET: "<microsoft-client-secret>"
  AUTH_MICROSOFT_TENANT_ID: "common"
  AUTH_APPLE_CLIENT_ID: "<apple-services-id>"
  AUTH_APPLE_TEAM_ID: "<apple-team-id>"
  AUTH_APPLE_KEY_ID: "<apple-key-id>"
  AUTH_APPLE_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    <apple-private-key-p8>
    -----END PRIVATE KEY-----
