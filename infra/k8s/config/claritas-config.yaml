apiVersion: v1
kind: ConfigMap
metadata:
  name: claritas-config
  namespace: claritas
data:
  # These can be overwritten by the pipeline step that upserts the ConfigMap.
  INSTANCE_CONNECTION_NAME: "claritas-457808:europe-west2:claritas-sql"
  DB_NAME: "claritas"
  DB_USER: "claritas_app"
  AUTH_BASE_URL: "https://app.claritas.info"
  AUTH_SUCCESS_REDIRECT_URL: "https://app.claritas.info/"
  AUTH_FAILURE_REDIRECT_URL: "https://app.claritas.info/"
  AUTH_ALLOWED_REDIRECTS: "https://app.claritas.info,claritas://"
  AUTH_ALLOWED_REDIRECT_SCHEMES: "claritas"
  AUTH_PROVIDERS: "google,microsoft,apple"
  AUTH_ISSUER_URL: "https://auth.claritas.info/realms/claritas"
  AUTH_KEYCLOAK_CLIENT_ID: "claritas-api"
  AUTH_KEYCLOAK_SCOPE: "openid profile email"
  AUTH_KEYCLOAK_IDP_HINT_GOOGLE: "google"
  AUTH_KEYCLOAK_IDP_HINT_MICROSOFT: "microsoft"
  AUTH_KEYCLOAK_IDP_HINT_APPLE: "apple"
  AUTH_COOKIE_SECURE: "true"
  AUTH_SESSION_TTL_DAYS: "30"
  AUTH_STATE_TTL_MINUTES: "10"
  # Daily briefings are text-only. Disabling OpenCode tools allows routing to
  # free/non-tool-capable models and prevents unnecessary container access.
  OPENCODE_DISABLE_TOOLS: "true"
  # Non-English headlines are translated during news ingestion. Summaries stay
  # opt-in and are generated only when a user opens a story.
  NEWS_TRANSLATION_ENABLED: "true"
  NEWS_TRANSLATION_TARGET_LANGUAGES: "en"
  NEWS_TRANSLATION_BATCH_SIZE: "48"
  NEWS_TRANSLATION_SUMMARY_MAX_WORDS: "55"
  # Used when repository variables do not provide explicit PodcastIndex targets.
  PODCAST_DISCOVERY_TERMS: "geopolitics,security,technology,markets"
  # Keyless open-data provider controls and identifying user agents.
  GDELT_USER_AGENT: "Claritas/1.0 (+https://app.claritas.info; engineering@claritas.info)"
  GDELT_MAX_RAW_ROWS: "500"
  SEC_EDGAR_USER_AGENT: "Claritas engineering@claritas.info"
  NWS_USER_AGENT: "Claritas engineering@claritas.info"
  SEC_EDGAR_SYMBOLS: "AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,JPM"
  # One slot is reserved by the transport leader. Four remaining slots keep
  # API reads and short background leases from starving one another.
  DB_CONNECTION_TIMEOUT_MS: "5000"
  DB_POOL_MAX: "5"
  DB_POOL_IDLE_TIMEOUT_MS: "30000"
  DB_POOL_MAX_LIFETIME_SECONDS: "1800"
  DB_POOL_MONITOR_INTERVAL_SECONDS: "30"
  DB_STATEMENT_TIMEOUT_MS: "15000"
  DB_SLOW_QUERY_MS: "750"
  CLARITAS_DB_APPLICATION_NAME: "claritas-api"
  # Global transport ingestion is sampled before persistence. adsb.lol is
  # keyless; AISstream remains disabled until AISSTREAM_API_KEY is supplied.
  AISSTREAM_ENABLED: "true"
  AISSTREAM_SAMPLE_SECONDS: "600"
  AISSTREAM_IDLE_TIMEOUT_SECONDS: "120"
  # Rotate small geographic subscriptions and persist bounded batches so a
  # full-world vessel burst cannot monopolize the API database pool.
  AISSTREAM_SUBSCRIPTION_BATCH_SIZE: "2"
  AISSTREAM_SUBSCRIPTION_ROTATION_SECONDS: "20"
  AISSTREAM_FLUSH_INTERVAL_SECONDS: "5"
  AISSTREAM_FLUSH_BATCH_SIZE: "250"
  AISSTREAM_FLUSH_BATCHES_PER_CYCLE: "2"
  ADSB_LOL_POLL_ENABLED: "true"
  ADSB_LOL_POLL_SECONDS: "600"
  ADSB_LOL_MAX_ROUTE_LOOKUPS: "750"
  ADSB_LOL_USER_AGENT: "Claritas/1.0 (+https://app.claritas.info; engineering@claritas.info)"
  TRANSPORT_TRACK_SAMPLE_SECONDS: "600"
  TRANSPORT_OVERVIEW_CACHE_SECONDS: "120"
  TRANSPORT_TRACK_RETENTION_DAYS: "3"
  TRANSPORT_AGGREGATE_RETENTION_DAYS: "60"
  TRANSPORT_SNAPSHOT_RETENTION_DAYS: "14"
  TRANSPORT_RETENTION_INTERVAL_MINUTES: "180"
  TRANSPORT_RETENTION_BATCH_SIZE: "5000"
  TRANSPORT_RETENTION_MAX_BATCHES: "10"
  KEYCLOAK_REALM: "claritas"
  KEYCLOAK_WEB_CLIENT_ID: "claritas-web"
  KEYCLOAK_MOBILE_CLIENT_ID: "claritas-mobile"
  KEYCLOAK_WEB_REDIRECT_URIS: "https://app.claritas.info/*,http://localhost:5173/*"
  KEYCLOAK_WEB_ORIGINS: "https://app.claritas.info,http://localhost:5173"
  KEYCLOAK_MOBILE_REDIRECT_URIS: "claritas://auth/*"
  KEYCLOAK_API_REDIRECT_URIS: "https://app.claritas.info/api/auth/google/callback,https://app.claritas.info/api/auth/microsoft/callback,https://app.claritas.info/api/auth/apple/callback,http://localhost:8080/api/auth/google/callback,http://localhost:8080/api/auth/microsoft/callback,http://localhost:8080/api/auth/apple/callback"
  KEYCLOAK_DB_NAME: "keycloak"
  KEYCLOAK_DB_USER: "keycloak_app"
