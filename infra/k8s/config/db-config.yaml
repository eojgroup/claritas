apiVersion: v1
kind: ConfigMap
metadata:
  name: claritas-config
  namespace: claritas
data:
  INSTANCE_CONNECTION_NAME: "claritas-457808:europe-west2:claritas-sql"  # from TF output
  DB_NAME: "claritas"
  DB_USER: "claritas_app"
  AUTH_BASE_URL: "https://api.example.com"
  AUTH_SUCCESS_REDIRECT_URL: "https://app.example.com/auth/success"
  AUTH_FAILURE_REDIRECT_URL: "https://app.example.com/auth/error"
  AUTH_ALLOWED_REDIRECTS: "https://app.example.com"
  AUTH_PROVIDERS: "google,microsoft,apple"
  AUTH_ISSUER_URL: "https://auth.example.com/realms/claritas"
  AUTH_KEYCLOAK_CLIENT_ID: "claritas-api"
  AUTH_KEYCLOAK_SCOPE: "openid profile email"
  AUTH_KEYCLOAK_IDP_HINT_GOOGLE: "google"
  AUTH_KEYCLOAK_IDP_HINT_MICROSOFT: "microsoft"
  AUTH_KEYCLOAK_IDP_HINT_APPLE: "apple"
  AUTH_COOKIE_SECURE: "true"
  AUTH_SESSION_TTL_DAYS: "30"
  AUTH_STATE_TTL_MINUTES: "10"
  KEYCLOAK_REALM: "claritas"
  KEYCLOAK_WEB_CLIENT_ID: "claritas-web"
  KEYCLOAK_MOBILE_CLIENT_ID: "claritas-mobile"
  KEYCLOAK_WEB_REDIRECT_URIS: "https://app.example.com/*,http://localhost:5173/*"
  KEYCLOAK_WEB_ORIGINS: "https://app.example.com,http://localhost:5173"
  KEYCLOAK_MOBILE_REDIRECT_URIS: "claritas://auth/*"
  KEYCLOAK_API_REDIRECT_URIS: "https://app.example.com/api/auth/*/callback,http://localhost:8080/api/auth/*/callback"
  KEYCLOAK_DB_NAME: "keycloak"
  KEYCLOAK_DB_USER: "keycloak_app"
