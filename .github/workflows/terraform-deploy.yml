name: Terraform Infrastructure Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: terraform-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Terraform + Cloud SQL + Migrations
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: claritas-457808
      REGION: europe-west2
      ZONE: europe-west2-b
      GKE_CLUSTER: claritas-cluster
      K8S_NAMESPACE: claritas
      NETWORK: default
      DOMAIN: app.claritas.info
      TF_VAR_finnhub_api_key: ${{ secrets.FINNHUB_API_KEY }}
      TF_VAR_postal_enabled: ${{ vars.POSTAL_ENABLED || 'false' }}
      TF_VAR_postal_domain: ${{ vars.POSTAL_DOMAIN || 'briefings.claritas.info' }}
      TF_VAR_postal_enable_public_ptr: ${{ vars.POSTAL_ENABLE_PUBLIC_PTR || 'false' }}
      TF_VAR_postal_email_delivery_enabled: ${{ vars.POSTAL_EMAIL_DELIVERY_ENABLED || 'false' }}
      TF_VAR_postal_sender_address: ${{ vars.POSTAL_SENDER_ADDRESS || 'daily@briefings.claritas.info' }}
      TF_VAR_postal_sender_name: ${{ vars.POSTAL_SENDER_NAME || 'Claritas' }}
      TF_VAR_postal_reply_to: ${{ vars.POSTAL_REPLY_TO || '' }}
      TF_VAR_postal_smtp_username: ${{ vars.POSTAL_SMTP_USERNAME || 'claritas' }}
      TF_VAR_postal_smtp_credential: ${{ secrets.POSTAL_SMTP_CREDENTIAL || '' }}
      TF_VAR_postal_admin_email: ${{ vars.POSTAL_ADMIN_EMAIL || 'admin@claritas.info' }}
      POSTAL_ENFORCE_PORT25_EGRESS: ${{ vars.POSTAL_ENFORCE_PORT25_EGRESS || 'true' }}

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false   # <- prevents ::debug:: noise on stdout

      - name: 🔐 Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

      - name: ☁️ Install gcloud SDK + GKE auth plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      ############################################
      # Core Terraform (networking, GKE, registry)
      ############################################
      - name: 🌍 Terraform Init (core)
        run: ./infra/scripts/terraform-init-retry.sh infra/gcp/terraform

      - name: ✅ Terraform formatting, validation, and module tests
        working-directory: infra/gcp/terraform
        run: |
          terraform fmt -check -recursive
          terraform validate

          # Repository variables configure the production plan/apply, but must not
          # override the explicit/default values exercised by isolated module tests.
          for variable in "${!TF_VAR_postal_@}"; do
            unset "$variable"
          done
          terraform test -test-directory=tests

      - name: 🛠️ Terraform Import (existing resources)
        working-directory: infra/gcp/terraform
        run: |
          terraform import google_storage_bucket.terraform_state claritas-tf-state || true
          terraform import google_artifact_registry_repository.claritas_app projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/repositories/claritas-app || true
          terraform import google_container_cluster.primary projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/clusters/${{ env.GKE_CLUSTER }} || true
          terraform import google_compute_global_address.sql_psa_range projects/${{ env.PROJECT_ID }}/global/addresses/claritas-sql-psa-range || true

          # Service Networking VPC connection (peering)
          terraform import google_service_networking_connection.vpc_connection "https://www.googleapis.com/compute/v1/projects/${{ env.PROJECT_ID }}/global/networks/${{ env.NETWORK }}:services/servicenetworking.googleapis.com" || true

          # Cloud SQL (PostgreSQL) resources
          terraform import google_sql_database_instance.pg projects/${{ env.PROJECT_ID }}/instances/claritas-sql || true
          terraform import google_sql_database.db projects/${{ env.PROJECT_ID }}/instances/claritas-sql/databases/claritas || true
          terraform import google_sql_user.app projects/${{ env.PROJECT_ID }}/instances/claritas-sql/users/claritas_app || true

          # GCP Service Account used for Workload Identity (already exists)
          terraform import google_service_account.claritas_sql_gsa "projects/${{ env.PROJECT_ID }}/serviceAccounts/claritas-sql-gsa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" || true

      - name: 🔍 Terraform Plan (core)
        working-directory: infra/gcp/terraform
        run: terraform plan -var-file="terraform.tfvars" -lock-timeout=5m

      - name: 🚀 Terraform Apply (core)
        working-directory: infra/gcp/terraform
        run: terraform apply -auto-approve -var-file="terraform.tfvars" -lock-timeout=5m

      ############################################
      # Cloud SQL Terraform outputs
      ############################################
      - name: 🌉 Capture Terraform outputs
        id: tf_out
        working-directory: infra/gcp/terraform
        run: |
          ICN=$(terraform output -raw instance_connection_name 2>/dev/null | tr -d '\n')
          DB_NAME=$(terraform output -raw db_name 2>/dev/null | tr -d '\n')
          DB_USER=$(terraform output -raw db_user 2>/dev/null | tr -d '\n')
          DB_PASS=$(terraform output -raw db_pass 2>/dev/null | tr -d '\n')

          echo "icn=${ICN}" >> "$GITHUB_OUTPUT"
          echo "db_name=${DB_NAME}" >> "$GITHUB_OUTPUT"
          echo "db_user=${DB_USER}" >> "$GITHUB_OUTPUT"
          echo "db_pass=${DB_PASS}" >> "$GITHUB_OUTPUT"

      - name: 🕵️ Mask DB secret
        run: |
          echo "::add-mask::${{ steps.tf_out.outputs.db_pass }}"

      ############################################
      # Kube access + namespace
      ############################################
      - name: 💻 Get GKE credentials
        run: |
          gcloud container clusters get-credentials "${{ env.GKE_CLUSTER }}" --region "${{ env.REGION }}" --project "${{ env.PROJECT_ID }}"

      - name: 🧰 Ensure namespace exists
        run: |
          kubectl get ns "${{ env.K8S_NAMESPACE }}" || kubectl create ns "${{ env.K8S_NAMESPACE }}"

      - name: 🪪 Apply KSA for Workload Identity
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" apply -f infra/k8s/config/serviceaccounts.yaml

      ############################################
      # ConfigMap + Secret (idempotent upsert)
      ############################################
      - name: 🧩 Upsert ConfigMap (claritas-config)
        run: |
          ns="${{ env.K8S_NAMESPACE }}"
          base="${{ env.DOMAIN }}"
          if [ -n "${base}" ] && [ "${base#http}" = "${base}" ]; then
            base="https://${base}"
          fi
          kubectl -n "$ns" apply -f infra/k8s/config/claritas-config.yaml
          kubectl -n "$ns" patch configmap claritas-config --type merge -p "{\"data\":{\"INSTANCE_CONNECTION_NAME\":\"${{ steps.tf_out.outputs.icn }}\",\"DB_NAME\":\"${{ steps.tf_out.outputs.db_name }}\",\"DB_USER\":\"${{ steps.tf_out.outputs.db_user }}\",\"AUTH_BASE_URL\":\"${base}\",\"AUTH_SUCCESS_REDIRECT_URL\":\"${base}/auth/success\",\"AUTH_FAILURE_REDIRECT_URL\":\"${base}/auth/error\",\"AUTH_ALLOWED_REDIRECTS\":\"${base},claritas://\",\"AUTH_ALLOWED_REDIRECT_SCHEMES\":\"claritas\"}}"

      - name: 🔐 Upsert Secret (claritas-db)
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" create secret generic claritas-db \
            --from-literal=DB_HOST=127.0.0.1 \
            --from-literal=DB_PORT=5432 \
            --from-literal=DB_NAME="${{ steps.tf_out.outputs.db_name }}" \
            --from-literal=DB_USER="${{ steps.tf_out.outputs.db_user }}" \
            --from-literal=DB_PASSWORD="${{ steps.tf_out.outputs.db_pass }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: 🔐 Upsert Secret (claritas-newsapi)
        env:
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
        run: |
          if [ -z "${NEWSAPI_API_KEY:-}" ]; then
            echo "::warning::NEWSAPI_API_KEY not set in GitHub Secrets; skipping secret upsert";
          else
            kubectl -n "${{ env.K8S_NAMESPACE }}" create secret generic claritas-newsapi \
              --from-literal=NEWSAPI_API_KEY="$NEWSAPI_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: 🔐 Upsert Secret (claritas-openweather)
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          if [ -z "${OPENWEATHER_API_KEY:-}" ]; then
            echo "::warning::OPENWEATHER_API_KEY not set in GitHub Secrets; skipping secret upsert";
          else
            kubectl -n "${{ env.K8S_NAMESPACE }}" create secret generic claritas-openweather \
              --from-literal=OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: 🔐 Upsert Secret (claritas-finnhub)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ -z "${FINNHUB_API_KEY:-}" ]; then
            echo "::warning::FINNHUB_API_KEY not set in GitHub Secrets; skipping secret upsert";
          else
            kubectl -n "${{ env.K8S_NAMESPACE }}" create secret generic claritas-finnhub \
              --from-literal=FINNHUB_API_KEY="$FINNHUB_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      ############################################
      # Run Flyway migrations (via K8s Job)
      ############################################
      - name: 🧩 Upsert Flyway scripts ConfigMap from repo
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" create configmap flyway-scripts \
            --from-file=infra/gcp/sql/ \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: 📜 Apply migration manifests
        run: |
          set -euo pipefail
          ns="${{ env.K8S_NAMESPACE }}"
          job="flyway-migrate-${GITHUB_RUN_ID}"

          # Ensure fresh Job
          kubectl -n "$ns" delete job "$job" --ignore-not-found=true || true

          # Apply explicitly into the target namespace, with a unique Job name to avoid cross-workflow races
          # Render the manifest with a run-scoped name
          sed -E "s/^\s*name: flyway-migrate$/  name: ${job}/" infra/k8s/migrations/flyway-job.yaml | kubectl -n "$ns" apply -f -

          # Verify that the Job object exists (fast-fail if not created)
          echo "Verifying job/$job exists in namespace $ns ..."
          for i in $(seq 1 10); do
            if kubectl -n "$ns" get job "$job" >/dev/null 2>&1; then
              kubectl -n "$ns" get job "$job" -o wide || true
              break
            fi
            sleep 2
          done
          if ! kubectl -n "$ns" get job "$job" >/dev/null 2>&1; then
            echo "::error::Failed to create job/$job. Recent events:" >&2
            kubectl -n "$ns" get events --sort-by=.lastTimestamp | tail -n 50 || true
            exit 1
          fi

      - name: 🕒 Wait for migrations (robust to job GC)
        run: |
          set -euo pipefail
          ns="${{ env.K8S_NAMESPACE }}"
          job="flyway-migrate-${GITHUB_RUN_ID}"

          echo "Waiting for Flyway job/$job completion..."
          if ! kubectl -n "$ns" wait --for=condition=complete "job/${job}" --timeout=420s; then
            echo "::error::Flyway job did not complete successfully" >&2
            kubectl -n "$ns" get job "$job" -o wide || true
            kubectl -n "$ns" describe job "$job" | sed -n '1,200p' || true
            kubectl -n "$ns" get pods -l job-name=$job -o wide || true
            kubectl -n "$ns" logs "job/$job" -c flyway --tail=200 || true
            kubectl -n "$ns" logs "job/$job" -c cloud-sql-proxy --tail=200 || true
            exit 1
          fi
          kubectl -n "$ns" logs "job/$job" -c flyway --tail=200 || true
          kubectl -n "$ns" delete job "$job" --wait=true || true

      - name: ✅ Verify DB schema and migration history
        run: |
          set -euo pipefail
          ns="${{ env.K8S_NAMESPACE }}"
          job="db-verify-${GITHUB_RUN_ID}"
          kubectl -n "$ns" delete job "$job" --ignore-not-found=true || true
          sed -E "s/^\s*name: db-verify$/  name: ${job}/" infra/k8s/migrations/db-verify-job.yaml | kubectl -n "$ns" apply -f -
          if ! kubectl -n "$ns" wait --for=condition=complete "job/${job}" --timeout=600s; then
            echo "::error::DB verification failed" >&2
            kubectl -n "$ns" describe "job/${job}" || true
            kubectl -n "$ns" logs "job/${job}" -c db-verify --tail=200 || true
            kubectl -n "$ns" logs "job/${job}" -c cloud-sql-proxy --tail=200 || true
            exit 1
          fi
          kubectl -n "$ns" logs "job/${job}" -c db-verify --tail=200 || true
          kubectl -n "$ns" delete "job/${job}" --wait=true || true

      ############################################
      # (Optional) Redeploy API if needed
      ############################################
      - name: 🔄 Show deployments
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" get deploy,svc,ingress

      ############################################
      # Postal post-apply readiness checks
      ############################################
      - name: 📮 Publish Postal setup details
        if: ${{ env.TF_VAR_postal_enabled == 'true' }}
        working-directory: infra/gcp/terraform
        run: |
          set -euo pipefail
          delegation=$(terraform output -json postal_dns_delegation)
          web_url=$(terraform output -raw postal_web_url)
          external_ip=$(terraform output -raw postal_external_ip)
          admin_password_command=$(terraform output -raw postal_admin_password_command)

          {
            echo "## Postal deployment"
            echo
            echo "- Web UI: \`${web_url}\`"
            echo "- Static IPv4: \`${external_ip}\`"
            echo "- Parent DNS delegation:"
            echo '```json'
            echo "$delegation" | jq .
            echo '```'
            echo "- Retrieve the bootstrapped administrator password:"
            echo '```bash'
            echo "$admin_password_command"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🩺 Verify Postal services
        if: ${{ env.TF_VAR_postal_enabled == 'true' }}
        run: |
          set -euo pipefail
          healthy=false
          for attempt in $(seq 1 40); do
            if gcloud compute ssh claritas-postal \
              --project "${{ env.PROJECT_ID }}" \
              --zone "${{ env.ZONE }}" \
              --tunnel-through-iap \
              --quiet \
              --command "sudo /usr/local/bin/postal-healthcheck"; then
              healthy=true
              break
            fi
            echo "Postal is still bootstrapping (attempt ${attempt}/40)."
            sleep 15
          done

          if [ "$healthy" != "true" ]; then
            echo "::error::Postal did not become healthy within 10 minutes."
            gcloud compute ssh claritas-postal \
              --project "${{ env.PROJECT_ID }}" \
              --zone "${{ env.ZONE }}" \
              --tunnel-through-iap \
              --quiet \
              --command "sudo tail -n 250 /var/log/claritas-postal-bootstrap.log; cd /opt/postal && sudo docker compose ps && sudo docker compose logs --tail=150" || true
            exit 1
          fi

      - name: ✉️ Verify external SMTP egress
        if: ${{ env.TF_VAR_postal_enabled == 'true' }}
        run: |
          set -euo pipefail
          if gcloud compute ssh claritas-postal \
            --project "${{ env.PROJECT_ID }}" \
            --zone "${{ env.ZONE }}" \
            --tunnel-through-iap \
            --quiet \
            --command "sudo /usr/local/bin/postal-port25-check"; then
            echo "- External TCP/25 egress: available" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- External TCP/25 egress: **blocked** — direct internet delivery cannot be enabled." >> "$GITHUB_STEP_SUMMARY"
            if [ "${POSTAL_ENFORCE_PORT25_EGRESS}" = "true" ]; then
              echo "::error::Google Cloud external TCP/25 egress is blocked. Postal cannot deliver directly to destination MX servers."
              exit 1
            fi
            echo "::warning::Postal is healthy, but external TCP/25 egress is blocked."
          fi

      - name: 🔄 Activate Postal configuration in API
        if: ${{ env.TF_VAR_postal_enabled == 'true' && env.TF_VAR_postal_email_delivery_enabled == 'true' }}
        run: |
          set -euo pipefail
          kubectl -n "${{ env.K8S_NAMESPACE }}" rollout restart deployment/claritas-api
          kubectl -n "${{ env.K8S_NAMESPACE }}" rollout status deployment/claritas-api --timeout=300s
