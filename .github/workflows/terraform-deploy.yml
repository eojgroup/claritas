name: Terraform Infrastructure Deployment

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Terraform + Cloud SQL + Migrations
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: claritas-457808
      REGION: europe-west2
      GKE_CLUSTER: claritas-cluster
      K8S_NAMESPACE: claritas
      NETWORK: default
      DOMAIN: app.claritas.info

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v3

      - name: 🧰 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false   # <- prevents ::debug:: noise on stdout

      - name: 🔐 Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

      - name: ☁️ Install gcloud SDK + GKE auth plugin
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      ############################################
      # Core Terraform (networking, GKE, registry)
      ############################################
      - name: 🌍 Terraform Init (core)
        working-directory: infra/gcp/terraform
        run: terraform init

      - name: 🛠️ Terraform Import (existing resources)
        working-directory: infra/gcp/terraform
        run: |
          terraform import google_storage_bucket.terraform_state claritas-tf-state || true
          terraform import google_artifact_registry_repository.claritas_app projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/repositories/claritas-app || true
          terraform import google_container_cluster.primary projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/clusters/${{ env.GKE_CLUSTER }} || true
          terraform import google_compute_global_address.sql_psa_range projects/${{ env.PROJECT_ID }}/global/addresses/claritas-sql-psa-range || true

          # Service Networking VPC connection (peering)
          terraform import google_service_networking_connection.vpc_connection "https://www.googleapis.com/compute/v1/projects/${{ env.PROJECT_ID }}/global/networks/${{ env.NETWORK }}:services/servicenetworking.googleapis.com" || true

          # Cloud SQL (PostgreSQL) resources
          terraform import google_sql_database_instance.pg projects/${{ env.PROJECT_ID }}/instances/claritas-sql || true
          terraform import google_sql_database.db projects/${{ env.PROJECT_ID }}/instances/claritas-sql/databases/claritas || true
          terraform import google_sql_user.app projects/${{ env.PROJECT_ID }}/instances/claritas-sql/users/claritas_app || true

          # GCP Service Account used for Workload Identity (already exists)
          terraform import google_service_account.claritas_sql_gsa "projects/${{ env.PROJECT_ID }}/serviceAccounts/claritas-sql-gsa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" || true

      - name: 🔍 Terraform Plan (core)
        working-directory: infra/gcp/terraform
        run: terraform plan -var-file="terraform.tfvars" -lock=false || true

      - name: 🚀 Terraform Apply (core)
        working-directory: infra/gcp/terraform
        run: terraform apply -auto-approve -var-file="terraform.tfvars" -lock=false

      ############################################
      # Cloud SQL Terraform outputs
      ############################################
      - name: 🌉 Capture Terraform outputs
        id: tf_out
        working-directory: infra/gcp/terraform
        run: |
          ICN=$(terraform output -raw instance_connection_name 2>/dev/null | tr -d '\n')
          DB_NAME=$(terraform output -raw db_name 2>/dev/null | tr -d '\n')
          DB_USER=$(terraform output -raw db_user 2>/dev/null | tr -d '\n')
          DB_PASS=$(terraform output -raw db_pass 2>/dev/null | tr -d '\n')

          echo "icn=${ICN}" >> "$GITHUB_OUTPUT"
          echo "db_name=${DB_NAME}" >> "$GITHUB_OUTPUT"
          echo "db_user=${DB_USER}" >> "$GITHUB_OUTPUT"
          echo "db_pass=${DB_PASS}" >> "$GITHUB_OUTPUT"

      - name: 🕵️ Mask DB secret
        run: |
          echo "::add-mask::${{ steps.tf_out.outputs.db_pass }}"

      ############################################
      # Kube access + namespace
      ############################################
      - name: 💻 Get GKE credentials
        run: |
          gcloud container clusters get-credentials "${{ env.GKE_CLUSTER }}" --region "${{ env.REGION }}" --project "${{ env.PROJECT_ID }}"

      - name: 🧰 Ensure namespace exists
        run: |
          kubectl get ns "${{ env.K8S_NAMESPACE }}" || kubectl create ns "${{ env.K8S_NAMESPACE }}"

      - name: 🪪 Apply KSA for Workload Identity
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" apply -f infra/k8s/config/serviceaccounts.yaml

      ############################################
      # ConfigMap + Secret (idempotent upsert)
      ############################################
      - name: 🧩 Upsert ConfigMap (claritas-config)
        run: |
          ns="${{ env.K8S_NAMESPACE }}"
          base="${{ env.DOMAIN }}"
          if [ -n "${base}" ] && [ "${base#http}" = "${base}" ]; then
            base="https://${base}"
          fi
          kubectl -n "$ns" apply -f infra/k8s/config/claritas-config.yaml
          kubectl -n "$ns" patch configmap claritas-config --type merge -p "{\"data\":{\"INSTANCE_CONNECTION_NAME\":\"${{ steps.tf_out.outputs.icn }}\",\"DB_NAME\":\"${{ steps.tf_out.outputs.db_name }}\",\"DB_USER\":\"${{ steps.tf_out.outputs.db_user }}\",\"AUTH_BASE_URL\":\"${base}\",\"AUTH_SUCCESS_REDIRECT_URL\":\"${base}/auth/success\",\"AUTH_FAILURE_REDIRECT_URL\":\"${base}/auth/error\",\"AUTH_ALLOWED_REDIRECTS\":\"${base}\"}}"

      - name: 🔐 Upsert Secret (claritas-db)
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" create secret generic claritas-db \
            --from-literal=DB_HOST=127.0.0.1 \
            --from-literal=DB_PORT=5432 \
            --from-literal=DB_NAME="${{ steps.tf_out.outputs.db_name }}" \
            --from-literal=DB_USER="${{ steps.tf_out.outputs.db_user }}" \
            --from-literal=DB_PASSWORD="${{ steps.tf_out.outputs.db_pass }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: 🔐 Upsert Secret (claritas-newsapi)
        env:
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
        run: |
          if [ -z "${NEWSAPI_API_KEY:-}" ]; then
            echo "::warning::NEWSAPI_API_KEY not set in GitHub Secrets; skipping secret upsert";
          else
            kubectl -n "${{ env.K8S_NAMESPACE }}" create secret generic claritas-newsapi \
              --from-literal=NEWSAPI_API_KEY="$NEWSAPI_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: 🔐 Upsert Secret (claritas-openweather)
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          if [ -z "${OPENWEATHER_API_KEY:-}" ]; then
            echo "::warning::OPENWEATHER_API_KEY not set in GitHub Secrets; skipping secret upsert";
          else
            kubectl -n "${{ env.K8S_NAMESPACE }}" create secret generic claritas-openweather \
              --from-literal=OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      ############################################
      # Run Flyway migrations (via K8s Job)
      ############################################
      - name: 🧩 Upsert Flyway scripts ConfigMap from repo
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" create configmap flyway-scripts \
            --from-file=infra/gcp/sql/ \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: 📜 Apply migration manifests
        run: |
          set -euo pipefail
          ns="${{ env.K8S_NAMESPACE }}"
          job="flyway-migrate-${GITHUB_RUN_ID}"

          # Ensure fresh Job
          kubectl -n "$ns" delete job "$job" --ignore-not-found=true || true

          # Apply explicitly into the target namespace, with a unique Job name to avoid cross-workflow races
          # Render the manifest with a run-scoped name
          sed -E "s/^\s*name: flyway-migrate$/  name: ${job}/" infra/k8s/migrations/flyway-job.yaml | kubectl -n "$ns" apply -f -

          # Verify that the Job object exists (fast-fail if not created)
          echo "Verifying job/$job exists in namespace $ns ..."
          for i in $(seq 1 10); do
            if kubectl -n "$ns" get job "$job" >/dev/null 2>&1; then
              kubectl -n "$ns" get job "$job" -o wide || true
              break
            fi
            sleep 2
          done
          if ! kubectl -n "$ns" get job "$job" >/dev/null 2>&1; then
            echo "::error::Failed to create job/$job. Recent events:" >&2
            kubectl -n "$ns" get events --sort-by=.lastTimestamp | tail -n 50 || true
            exit 1
          fi

      - name: 🕒 Wait for migrations (robust to job GC)
        run: |
          set -euo pipefail
          ns="${{ env.K8S_NAMESPACE }}"
          job="flyway-migrate-${GITHUB_RUN_ID}"

          # Wait for the Job object to appear (up to 60s)
          echo "Waiting for job/$job to be created..."
          for i in $(seq 1 60); do
            if kubectl -n "$ns" get job "$job" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! kubectl -n "$ns" get job "$job" >/dev/null 2>&1; then
            echo "::error::Job $job was not created. Dumping recent events..." >&2
            kubectl -n "$ns" get jobs -o wide || true
            kubectl -n "$ns" get events --sort-by=.lastTimestamp | tail -n 50 || true
            exit 1
          fi

          echo "Waiting for a pod of job/$job to start..."
          for i in $(seq 1 60); do
            # Re-check that the job still exists
            if ! kubectl -n "$ns" get job "$job" >/dev/null 2>&1; then
              # If the job isn't found yet, keep waiting for the first pod
              true
            fi
            POD=$(kubectl -n "$ns" get pods -l job-name=$job --sort-by=.metadata.creationTimestamp -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null | tail -n 1 || true)
            if [ -n "${POD:-}" ]; then break; fi
            sleep 5
          done
          if [ -z "${POD:-}" ]; then
            echo "::error::No pod created for job/$job within timeout" >&2
            kubectl -n "$ns" get job "$job" -o wide || true
            exit 1
          fi
          echo "Tracking job/$job (latest pod will be followed)."

          # Poll for completion; re-detect the latest pod and use job-scoped logs
          for i in $(seq 1 120); do
            # Always re-detect the newest pod for this job (pods can rotate on failure)
            PNEW=$(kubectl -n "$ns" get pods -l job-name=$job --sort-by=.metadata.creationTimestamp -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null | tail -n 1 || true)
            [ -n "${PNEW:-}" ] && POD="$PNEW"

            # If the job itself vanished unexpectedly, fail fast with diagnostics
            if ! kubectl -n "$ns" get job "$job" >/dev/null 2>&1; then
              # Treat NotFound as success if the most recent pod finished 0
              CODE=$(kubectl -n "$ns" get pod "$POD" -o jsonpath='{.status.containerStatuses[?(@.name=="flyway")].state.terminated.exitCode}' 2>/dev/null || true)
              if [ "${CODE:-}" = "0" ]; then
                echo "Job object gone but pod exited 0 — considering success. Showing logs:"
                kubectl -n "$ns" logs "$POD" -c flyway --tail=200 || true
                exit 0
              fi
              echo "::error::Job $job no longer exists and success could not be confirmed. Recent events:" >&2
              kubectl -n "$ns" get events --sort-by=.lastTimestamp | tail -n 50 || true
              # Try to surface pod/container logs if present
              if [ -n "${POD:-}" ]; then
                echo "=== Logs (flyway) ===" >&2
                kubectl -n "$ns" logs "$POD" -c flyway --tail=200 || true
                echo "=== Logs (cloud-sql-proxy) ===" >&2
                kubectl -n "$ns" logs "$POD" -c cloud-sql-proxy --tail=200 || true
              fi
              exit 1
            fi

            CODE=$(kubectl -n "$ns" get pod "$POD" -o jsonpath='{.status.containerStatuses[?(@.name=="flyway")].state.terminated.exitCode}' 2>/dev/null || true)
            if [ "${CODE:-}" = "0" ]; then
              echo "Flyway finished successfully (exitCode=0). Showing logs:"
              kubectl -n "$ns" logs job/$job -c flyway --tail=200 || true
              kubectl -n "$ns" delete job "$job" --wait=true || true
              exit 0
            elif [ -n "${CODE:-}" ]; then
              echo "Flyway container exited with code ${CODE} (may retry if backoff allows)"
              echo "=== Logs (flyway) ===" >&2
              kubectl -n "$ns" logs job/$job -c flyway --tail=200 || true
              echo "=== Logs (cloud-sql-proxy) ===" >&2
              kubectl -n "$ns" logs job/$job -c cloud-sql-proxy --tail=200 || true
            fi

            # Fallback: infer success from log markers when sidecar keeps pod Running
            LOGS=$(kubectl -n "$ns" logs job/$job -c flyway --tail=200 2>/dev/null || true)
            if echo "$LOGS" | grep -qiE "Successfully (applied|repaired|validated)|Schema \"public\" is up to date|Current version of schema"; then
              echo "Flyway appears successful based on logs. Cleaning up job/$job ..."
              echo "$LOGS" | sed -n '1,200p' || true
              kubectl -n "$ns" delete job "$job" --wait=true || true
              exit 0
            fi

            # Bail out if the job has failed and is no longer active after retries
            SUC=$(kubectl -n "$ns" get job "$job" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)
            FLD=$(kubectl -n "$ns" get job "$job" -o jsonpath='{.status.failed}' 2>/dev/null || true)
            ACT=$(kubectl -n "$ns" get job "$job" -o jsonpath='{.status.active}' 2>/dev/null || true)
            if [ "${SUC:-0}" = "1" ]; then
              echo "Job signaled success. Cleaning up..."
              kubectl -n "$ns" delete job "$job" --wait=true || true
              exit 0
            fi
            if [ "${ACT:-0}" = "0" ] && [ -n "${FLD:-}" ] && [ "${FLD:-0}" -ge 2 ]; then
              echo "::error::Job failed after retries. Dumping diagnostics..." >&2
              kubectl -n "$ns" describe job "$job" | sed -n '1,200p' || true
              kubectl -n "$ns" get pods -l job-name=$job -o wide || true
              kubectl -n "$ns" logs job/$job -c flyway --tail=200 || true
              kubectl -n "$ns" logs job/$job -c cloud-sql-proxy --tail=200 || true
              exit 1
            fi
            sleep 5
          done
          echo "::error::Flyway did not finish within timeout. Dumping diagnostics..." >&2
          echo "\n=== Job status ===" >&2
          kubectl -n "$ns" get job "$job" -o wide || true
          kubectl -n "$ns" describe job "$job" | sed -n '1,200p' || true
          echo "\n=== Pods ===" >&2
          kubectl -n "$ns" get pods -l job-name=$job -o wide || true
          for p in $(kubectl -n "$ns" get pods -l job-name=$job -o name); do
            echo "\n--- Describe $p ---" >&2
            kubectl -n "$ns" describe "$p" | sed -n '1,200p' || true
            echo "\n--- Logs $p (all containers) ---" >&2
            kubectl -n "$ns" logs "$p" --all-containers=true --prefix=true || true
          done
          exit 1

      ############################################
      # (Optional) Redeploy API if needed
      ############################################
      - name: 🔄 Show deployments
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" get deploy,svc,ingress
