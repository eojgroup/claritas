name: Terraform Infrastructure Deployment

on:
  push:
    branches: [main]
    # Application deployments are owned by gke-deploy.yml. Restrict this
    # expensive infrastructure workflow to Terraform changes; operators can
    # still run it explicitly when GitHub variables or secrets change.
    paths:
      - 'infra/gcp/terraform/**'
      - 'infra/scripts/terraform-init-retry.sh'
      - '.github/workflows/terraform-deploy.yml'
  workflow_dispatch:

concurrency:
  # Shared with gke-deploy.yml because both workflows mutate production
  # Kubernetes configuration. Application migrations belong to GKE deploy.
  group: claritas-production-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Terraform + Cloud SQL + Configuration
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: claritas-457808
      REGION: europe-west2
      ZONE: europe-west2-b
      GKE_CLUSTER: claritas-cluster
      K8S_NAMESPACE: claritas
      NETWORK: default
      DOMAIN: app.claritas.info
      TF_VAR_smtp_host: ${{ vars.SMTP_HOST || '' }}
      TF_VAR_smtp_port: ${{ vars.SMTP_PORT || '587' }}
      TF_VAR_smtp_secure: ${{ vars.SMTP_SECURE || 'false' }}
      TF_VAR_smtp_from: ${{ vars.SMTP_FROM || '' }}
      TF_VAR_smtp_from_name: ${{ vars.SMTP_FROM_NAME || 'Claritas' }}
      TF_VAR_smtp_reply_to: ${{ vars.SMTP_REPLY_TO || '' }}
      TF_VAR_smtp_username: ${{ secrets.SMTP_USERNAME || '' }}
      TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD || '' }}
      TF_VAR_email_public_base_url: ${{ vars.EMAIL_PUBLIC_BASE_URL || 'https://app.claritas.info' }}
      TF_VAR_personal_briefing_email_enabled: ${{ vars.PERSONAL_BRIEFING_EMAIL_ENABLED || 'false' }}
      # These values initialize new infrastructure and feed the preserve-safe
      # post-apply Secret merge. Omitted values do not revoke live credentials.
      TF_VAR_auth_keycloak_client_secret: ${{ secrets.AUTH_KEYCLOAK_CLIENT_SECRET || '' }}
      TF_VAR_ingest_api_token: ${{ secrets.INGEST_API_TOKEN || '' }}
      TF_VAR_keycloak_admin: ${{ vars.KEYCLOAK_ADMIN || 'admin' }}
      TF_VAR_keycloak_admin_password: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD || '' }}
      TF_VAR_auth_google_client_id: ${{ secrets.KC_IDP_GOOGLE_CLIENT_ID || '' }}
      TF_VAR_auth_google_client_secret: ${{ secrets.KC_IDP_GOOGLE_CLIENT_SECRET || '' }}
      TF_VAR_auth_microsoft_client_id: ${{ secrets.KC_IDP_MICROSOFT_CLIENT_ID || '' }}
      TF_VAR_auth_microsoft_client_secret: ${{ secrets.KC_IDP_MICROSOFT_CLIENT_SECRET || '' }}
      TF_VAR_auth_microsoft_tenant_id: ${{ secrets.KC_IDP_MICROSOFT_TENANT || '' }}
      TF_VAR_auth_apple_client_id: ${{ secrets.KC_IDP_APPLE_CLIENT_ID || '' }}
      TF_VAR_auth_apple_team_id: ${{ secrets.KC_IDP_APPLE_TEAM_ID || '' }}
      TF_VAR_auth_apple_key_id: ${{ secrets.KC_IDP_APPLE_KEY_ID || '' }}
      TF_VAR_auth_apple_private_key: ${{ secrets.KC_IDP_APPLE_PRIVATE_KEY || '' }}

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false   # <- prevents ::debug:: noise on stdout

      - name: 🔐 Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

      - name: ☁️ Install gcloud SDK + GKE auth plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      # Bootstrap permissions needed before Terraform can manage the same
      # bindings itself. Pub/Sub resources cannot bootstrap their own creator.
      - name: 🚨 Ensure infrastructure IAM permissions
        run: |
          gcloud projects add-iam-policy-binding "${PROJECT_ID}" \
            --member="serviceAccount:terraform-github-oidc@${PROJECT_ID}.iam.gserviceaccount.com" \
            --role="roles/monitoring.alertPolicyEditor" \
            --condition=None \
            --quiet
          gcloud projects add-iam-policy-binding "${PROJECT_ID}" \
            --member="serviceAccount:terraform-github-oidc@${PROJECT_ID}.iam.gserviceaccount.com" \
            --role="roles/pubsub.admin" \
            --condition=None \
            --quiet

      ############################################
      # Core Terraform (networking, GKE, registry)
      ############################################
      - name: 🌍 Terraform Init (core)
        run: ./infra/scripts/terraform-init-retry.sh infra/gcp/terraform

      - name: ✅ Terraform formatting and validation
        working-directory: infra/gcp/terraform
        run: |
          terraform fmt -check -recursive
          terraform validate


      - name: 🛠️ Terraform Import (existing resources)
        working-directory: infra/gcp/terraform
        run: |
          set -euo pipefail

          import_if_missing() {
            local address="$1"
            local import_id="$2"

            if terraform state show "$address" >/dev/null 2>&1; then
              echo "$address is already managed; skipping import."
              return
            fi

            terraform import "$address" "$import_id"
          }

          import_if_missing google_storage_bucket.terraform_state claritas-tf-state
          import_if_missing google_artifact_registry_repository.claritas_app "projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/repositories/claritas-app"
          import_if_missing google_container_cluster.primary "projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/clusters/${{ env.GKE_CLUSTER }}"
          import_if_missing google_compute_global_address.sql_psa_range "projects/${{ env.PROJECT_ID }}/global/addresses/claritas-sql-psa-range"
          import_if_missing google_service_networking_connection.vpc_connection "projects/${{ env.PROJECT_ID }}/global/networks/${{ env.NETWORK }}:servicenetworking.googleapis.com"
          import_if_missing google_sql_database_instance.pg "projects/${{ env.PROJECT_ID }}/instances/claritas-sql"
          import_if_missing google_sql_database.db "projects/${{ env.PROJECT_ID }}/instances/claritas-sql/databases/claritas"
          import_if_missing google_sql_user.app "projects/${{ env.PROJECT_ID }}/instances/claritas-sql/users/claritas_app"
          import_if_missing google_service_account.claritas_sql_gsa "projects/${{ env.PROJECT_ID }}/serviceAccounts/claritas-sql-gsa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

      - name: 🔍 Terraform Plan (core)
        working-directory: infra/gcp/terraform
        run: terraform plan -var-file="terraform.tfvars" -lock-timeout=5m

      - name: 🚀 Terraform Apply (core)
        working-directory: infra/gcp/terraform
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if terraform apply -auto-approve -var-file="terraform.tfvars" -lock-timeout=5m; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Terraform apply failed after ${attempt} attempts." >&2
              exit 1
            fi
            delay=$((attempt * 30))
            echo "Terraform apply failed; waiting ${delay}s for Google API/IAM propagation before retry ${attempt}/5." >&2
            sleep "$delay"
          done

      ############################################
      # Cloud SQL Terraform outputs
      ############################################
      - name: 🌉 Capture Terraform outputs
        id: tf_out
        working-directory: infra/gcp/terraform
        run: |
          ICN=$(terraform output -raw instance_connection_name 2>/dev/null | tr -d '\n')
          DB_NAME=$(terraform output -raw db_name 2>/dev/null | tr -d '\n')
          DB_USER=$(terraform output -raw db_user 2>/dev/null | tr -d '\n')
          DB_PASS=$(terraform output -raw db_pass 2>/dev/null | tr -d '\n')
          API_EGRESS_IP=$(terraform output -raw api_egress_ip 2>/dev/null | tr -d '\n')

          {
            echo "icn=${ICN}"
            echo "db_name=${DB_NAME}"
            echo "db_user=${DB_USER}"
            echo "db_pass=${DB_PASS}"
            echo "api_egress_ip=${API_EGRESS_IP}"
          } >> "$GITHUB_OUTPUT"

      - name: 📮 Show SMTP allowlist address
        run: |
          echo "::notice title=Claritas static egress IP::Authorize ${{ steps.tf_out.outputs.api_egress_ip }} for SMTP in Brevo."

      - name: 🕵️ Mask DB secret
        run: |
          echo "::add-mask::${{ steps.tf_out.outputs.db_pass }}"

      ############################################
      # Kube access + namespace
      ############################################
      - name: 💻 Get GKE credentials
        run: |
          gcloud container clusters get-credentials "${{ env.GKE_CLUSTER }}" --region "${{ env.REGION }}" --project "${{ env.PROJECT_ID }}"

      - name: 🧰 Ensure namespace exists
        run: |
          kubectl get ns "${{ env.K8S_NAMESPACE }}" || kubectl create ns "${{ env.K8S_NAMESPACE }}"

      - name: 🔐 Merge supplied Keycloak/API auth secrets
        env:
          AUTH_KEYCLOAK_CLIENT_SECRET: ${{ secrets.AUTH_KEYCLOAK_CLIENT_SECRET }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
          KEYCLOAK_ADMIN: ${{ vars.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KC_IDP_GOOGLE_CLIENT_ID: ${{ secrets.KC_IDP_GOOGLE_CLIENT_ID }}
          KC_IDP_GOOGLE_CLIENT_SECRET: ${{ secrets.KC_IDP_GOOGLE_CLIENT_SECRET }}
          KC_IDP_MICROSOFT_CLIENT_ID: ${{ secrets.KC_IDP_MICROSOFT_CLIENT_ID }}
          KC_IDP_MICROSOFT_CLIENT_SECRET: ${{ secrets.KC_IDP_MICROSOFT_CLIENT_SECRET }}
          KC_IDP_MICROSOFT_TENANT: ${{ secrets.KC_IDP_MICROSOFT_TENANT }}
          KC_IDP_APPLE_CLIENT_ID: ${{ secrets.KC_IDP_APPLE_CLIENT_ID }}
          KC_IDP_APPLE_TEAM_ID: ${{ secrets.KC_IDP_APPLE_TEAM_ID }}
          KC_IDP_APPLE_KEY_ID: ${{ secrets.KC_IDP_APPLE_KEY_ID }}
          KC_IDP_APPLE_PRIVATE_KEY: ${{ secrets.KC_IDP_APPLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ns="${{ env.K8S_NAMESPACE }}"
          kubectl -n "$ns" get secret claritas-auth >/dev/null
          auth_patch="$(node <<'NODE'
          const names = [
            "AUTH_KEYCLOAK_CLIENT_SECRET",
            "INGEST_API_TOKEN",
            "KEYCLOAK_ADMIN",
            "KEYCLOAK_ADMIN_PASSWORD",
            "KC_IDP_GOOGLE_CLIENT_ID",
            "KC_IDP_GOOGLE_CLIENT_SECRET",
            "KC_IDP_MICROSOFT_CLIENT_ID",
            "KC_IDP_MICROSOFT_CLIENT_SECRET",
            "KC_IDP_MICROSOFT_TENANT",
            "KC_IDP_APPLE_CLIENT_ID",
            "KC_IDP_APPLE_TEAM_ID",
            "KC_IDP_APPLE_KEY_ID",
            "KC_IDP_APPLE_PRIVATE_KEY",
          ];
          const data = {};
          for (const name of names) {
            const value = process.env[name];
            if (value?.trim()) data[name] = Buffer.from(value).toString("base64");
          }
          process.stdout.write(JSON.stringify({ data }));
          NODE
          )"
          kubectl -n "$ns" patch secret claritas-auth --type merge -p "$auth_patch" >/dev/null
          echo "Merged supplied auth values while preserving omitted live Secret keys."

      - name: 🪪 Apply KSA for Workload Identity
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" apply -f infra/k8s/config/serviceaccounts.yaml

      ############################################
      # ConfigMap + Secret (idempotent upsert)
      ############################################
      - name: 🧩 Upsert ConfigMap (claritas-config)
        env:
          SEC_EDGAR_USER_AGENT: ${{ vars.SEC_EDGAR_USER_AGENT || secrets.SEC_EDGAR_USER_AGENT }}
          NWS_USER_AGENT: ${{ vars.NWS_USER_AGENT || secrets.NWS_USER_AGENT }}
          EVENT_CORRELATION_ENABLED: ${{ vars.EVENT_CORRELATION_ENABLED || 'true' }}
          EVENT_ALERTS_ENABLED: ${{ vars.EVENT_ALERTS_ENABLED || 'true' }}
          EARTH_OBSERVATION_ENABLED: ${{ vars.EARTH_OBSERVATION_ENABLED || 'true' }}
          COPERNICUS_ENABLED: ${{ vars.COPERNICUS_ENABLED || 'true' }}
          NASA_FIRMS_ENABLED: ${{ vars.NASA_FIRMS_ENABLED || 'true' }}
          NASA_GIBS_ENABLED: ${{ vars.NASA_GIBS_ENABLED || 'true' }}
          USGS_EARTHQUAKES_ENABLED: ${{ vars.USGS_EARTHQUAKES_ENABLED || 'true' }}
          EO_VISION_ENRICHMENT_ENABLED: ${{ vars.EO_VISION_ENRICHMENT_ENABLED || 'true' }}
          EO_VISION_MODEL: ${{ vars.EO_VISION_MODEL || 'openrouter/free' }}
          EO_VISION_MAX_DAILY_REQUESTS: ${{ vars.EO_VISION_MAX_DAILY_REQUESTS || '10' }}
          EO_VISION_MAX_IMAGE_BYTES: ${{ vars.EO_VISION_MAX_IMAGE_BYTES || '8388608' }}
          EO_MAX_DAILY_PROCESSING_UNITS: ${{ vars.EO_MAX_DAILY_PROCESSING_UNITS || '100' }}
          EO_MAX_MONTHLY_PROCESSING_UNITS: ${{ vars.EO_MAX_MONTHLY_PROCESSING_UNITS || '3000' }}
          EO_ESTIMATED_PROCESSING_UNITS_PER_RENDER: ${{ vars.EO_ESTIMATED_PROCESSING_UNITS_PER_RENDER || '4' }}
          EO_MAX_REVISITS_PER_EVENT: ${{ vars.EO_MAX_REVISITS_PER_EVENT || '2' }}
          EO_REVISIT_INTERVAL_HOURS: ${{ vars.EO_REVISIT_INTERVAL_HOURS || '24' }}
          EO_ASSET_RETENTION_DAYS: ${{ vars.EO_ASSET_RETENTION_DAYS }}
          APNS_DELIVERY_ENABLED: ${{ vars.APNS_DELIVERY_ENABLED || 'true' }}
          APNS_MATERIALIZATION_BATCH_SIZE: ${{ vars.APNS_MATERIALIZATION_BATCH_SIZE || '500' }}
          APNS_MAX_ACTIVE_DEVICES_PER_USER: ${{ vars.APNS_MAX_ACTIVE_DEVICES_PER_USER || '8' }}
          APNS_MAX_DEVICE_RECORDS_PER_USER: ${{ vars.APNS_MAX_DEVICE_RECORDS_PER_USER || '64' }}
          SOCIAL_DISCOVERY_QUERIES: ${{ vars.SOCIAL_DISCOVERY_QUERIES }}
          SOCIAL_MAX_RESULTS_PER_QUERY: ${{ vars.SOCIAL_MAX_RESULTS_PER_QUERY }}
          SOCIAL_LOOKBACK_HOURS: ${{ vars.SOCIAL_LOOKBACK_HOURS }}
          SOCIAL_RETENTION_DAYS: ${{ vars.SOCIAL_RETENTION_DAYS }}
          SOCIAL_USER_AGENT: ${{ vars.SOCIAL_USER_AGENT }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
          REDDIT_API_APPROVED: ${{ vars.REDDIT_API_APPROVED || 'false' }}
          SOCIAL_X_ENABLED: ${{ vars.SOCIAL_X_ENABLED || 'true' }}
          SOCIAL_REDDIT_ENABLED: ${{ vars.SOCIAL_REDDIT_ENABLED || 'false' }}
          SOCIAL_YOUTUBE_ENABLED: ${{ vars.SOCIAL_YOUTUBE_ENABLED || 'true' }}
          SOCIAL_BLUESKY_ENABLED: ${{ vars.SOCIAL_BLUESKY_ENABLED || 'true' }}
        run: |
          ns="${{ env.K8S_NAMESPACE }}"
          base="${{ env.DOMAIN }}"
          if [ -n "${base}" ] && [ "${base#http}" = "${base}" ]; then
            base="https://${base}"
          fi
          kubectl -n "$ns" apply -f infra/k8s/config/claritas-config.yaml
          kubectl -n "$ns" patch configmap claritas-config --type merge -p "{\"data\":{\"INSTANCE_CONNECTION_NAME\":\"${{ steps.tf_out.outputs.icn }}\",\"DB_NAME\":\"${{ steps.tf_out.outputs.db_name }}\",\"DB_USER\":\"${{ steps.tf_out.outputs.db_user }}\",\"AUTH_BASE_URL\":\"${base}\",\"AUTH_SUCCESS_REDIRECT_URL\":\"${base}/auth/success\",\"AUTH_FAILURE_REDIRECT_URL\":\"${base}/auth/error\",\"AUTH_ALLOWED_REDIRECTS\":\"${base},claritas://auth/callback\"}}"
          if [ -n "${SEC_EDGAR_USER_AGENT:-}" ]; then
            sec_patch=$(node -e 'process.stdout.write(JSON.stringify({data:{SEC_EDGAR_USER_AGENT:process.env.SEC_EDGAR_USER_AGENT.trim()}}))')
            kubectl -n "$ns" patch configmap claritas-config --type merge -p "$sec_patch"
          fi
          if [ -n "${NWS_USER_AGENT:-}" ]; then
            nws_patch=$(node -e 'process.stdout.write(JSON.stringify({data:{NWS_USER_AGENT:process.env.NWS_USER_AGENT.trim()}}))')
            kubectl -n "$ns" patch configmap claritas-config --type merge -p "$nws_patch"
          fi
          feature_patch=$(node -e '
            const data={};
            for (const key of ["EVENT_CORRELATION_ENABLED","EVENT_ALERTS_ENABLED","EARTH_OBSERVATION_ENABLED","COPERNICUS_ENABLED","NASA_FIRMS_ENABLED","NASA_GIBS_ENABLED","USGS_EARTHQUAKES_ENABLED","EO_VISION_ENRICHMENT_ENABLED","EO_VISION_MODEL","EO_VISION_MAX_DAILY_REQUESTS","EO_VISION_MAX_IMAGE_BYTES","EO_MAX_DAILY_PROCESSING_UNITS","EO_MAX_MONTHLY_PROCESSING_UNITS","EO_ESTIMATED_PROCESSING_UNITS_PER_RENDER","EO_MAX_REVISITS_PER_EVENT","EO_REVISIT_INTERVAL_HOURS","EO_ASSET_RETENTION_DAYS","APNS_DELIVERY_ENABLED","APNS_MATERIALIZATION_BATCH_SIZE","APNS_MAX_ACTIVE_DEVICES_PER_USER","APNS_MAX_DEVICE_RECORDS_PER_USER","SOCIAL_DISCOVERY_QUERIES","SOCIAL_MAX_RESULTS_PER_QUERY","SOCIAL_LOOKBACK_HOURS","SOCIAL_RETENTION_DAYS","SOCIAL_USER_AGENT","REDDIT_USER_AGENT","REDDIT_API_APPROVED","SOCIAL_X_ENABLED","SOCIAL_REDDIT_ENABLED","SOCIAL_YOUTUBE_ENABLED","SOCIAL_BLUESKY_ENABLED"]) {
              const value=process.env[key]?.trim(); if (value) data[key]=value;
            }
            process.stdout.write(JSON.stringify({data}));
          ')
          kubectl -n "$ns" patch configmap claritas-config --type merge -p "$feature_patch"

      - name: 🔐 Upsert Secret (claritas-db)
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" create secret generic claritas-db \
            --from-literal=DB_HOST=127.0.0.1 \
            --from-literal=DB_PORT=5432 \
            --from-literal=DB_NAME="${{ steps.tf_out.outputs.db_name }}" \
            --from-literal=DB_USER="${{ steps.tf_out.outputs.db_user }}" \
            --from-literal=DB_PASSWORD="${{ steps.tf_out.outputs.db_pass }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: 🔐 Upsert Secret (claritas-openweather)
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          if [ -z "${OPENWEATHER_API_KEY:-}" ]; then
            echo "::warning::OPENWEATHER_API_KEY not set in GitHub Secrets; skipping secret upsert";
          else
            kubectl -n "${{ env.K8S_NAMESPACE }}" create secret generic claritas-openweather \
              --from-literal=OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: 🔐 Upsert social provider secrets
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          ns="${{ env.K8S_NAMESPACE }}"
          if [ -n "${X_BEARER_TOKEN:-}" ]; then
            kubectl -n "$ns" create secret generic claritas-x-social \
              --from-literal=X_BEARER_TOKEN="$X_BEARER_TOKEN" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::notice::X_BEARER_TOKEN not set; preserving any existing X secret. Disable SOCIAL_X_ENABLED and revoke/delete explicitly when retiring access."
          fi
          if [ -n "${REDDIT_CLIENT_ID:-}" ] && [ -n "${REDDIT_CLIENT_SECRET:-}" ]; then
            kubectl -n "$ns" create secret generic claritas-reddit \
              --from-literal=REDDIT_CLIENT_ID="$REDDIT_CLIENT_ID" \
              --from-literal=REDDIT_CLIENT_SECRET="$REDDIT_CLIENT_SECRET" \
              --dry-run=client -o yaml | kubectl apply -f -
          elif [ -n "${REDDIT_CLIENT_ID:-}${REDDIT_CLIENT_SECRET:-}" ]; then
            echo "::warning::Reddit credentials are incomplete; preserving any existing Reddit secret"
          else
            echo "::notice::Reddit credentials not set; preserving any existing Reddit secret. Keep both Reddit gates false or revoke/delete explicitly when retiring access."
          fi
          if [ -n "${YOUTUBE_API_KEY:-}" ]; then
            kubectl -n "$ns" create secret generic claritas-youtube \
              --from-literal=YOUTUBE_API_KEY="$YOUTUBE_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::notice::YOUTUBE_API_KEY not set; preserving any existing YouTube secret. Disable SOCIAL_YOUTUBE_ENABLED and revoke/delete explicitly when retiring access."
          fi

      - name: 🔐 Upsert Secret (claritas-earth-observation)
        env:
          COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
          COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
          NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${COPERNICUS_CLIENT_ID:-}" ]; then
            args+=(--from-literal=COPERNICUS_CLIENT_ID="$COPERNICUS_CLIENT_ID")
          fi
          if [ -n "${COPERNICUS_CLIENT_SECRET:-}" ]; then
            args+=(--from-literal=COPERNICUS_CLIENT_SECRET="$COPERNICUS_CLIENT_SECRET")
          fi
          if [ -n "${NASA_FIRMS_MAP_KEY:-}" ]; then
            args+=(--from-literal=NASA_FIRMS_MAP_KEY="$NASA_FIRMS_MAP_KEY")
          fi
          if [ "${#args[@]}" -gt 0 ]; then
            kubectl -n "${{ env.K8S_NAMESPACE }}" create secret generic claritas-earth-observation "${args[@]}" --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::Earth Observation credentials not set; optional providers remain disabled"
          fi

      - name: 🔐 Upsert Secret (claritas-apns)
        env:
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_SANDBOX_PRIVATE_KEY: ${{ secrets.APNS_SANDBOX_PRIVATE_KEY }}
          APNS_SANDBOX_KEY_ID: ${{ secrets.APNS_SANDBOX_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${APNS_PRIVATE_KEY:-}" ] && [ -n "${APNS_KEY_ID:-}" ] && [ -n "${APNS_TEAM_ID:-}" ]; then
            apns_args=(
              --from-literal=APNS_PRIVATE_KEY="$APNS_PRIVATE_KEY"
              --from-literal=APNS_KEY_ID="$APNS_KEY_ID"
              --from-literal=APNS_TEAM_ID="$APNS_TEAM_ID"
            )
            if [ -n "${APNS_SANDBOX_PRIVATE_KEY:-}" ] && [ -n "${APNS_SANDBOX_KEY_ID:-}" ]; then
              apns_args+=(
                --from-literal=APNS_SANDBOX_PRIVATE_KEY="$APNS_SANDBOX_PRIVATE_KEY"
                --from-literal=APNS_SANDBOX_KEY_ID="$APNS_SANDBOX_KEY_ID"
              )
            elif [ -n "${APNS_SANDBOX_PRIVATE_KEY:-}${APNS_SANDBOX_KEY_ID:-}" ]; then
              echo "::error::APNS_SANDBOX_PRIVATE_KEY and APNS_SANDBOX_KEY_ID must be supplied together" >&2
              exit 1
            fi
            kubectl -n "${{ env.K8S_NAMESPACE }}" create secret generic claritas-apns "${apns_args[@]}" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::APNs GitHub credentials are incomplete; any existing claritas-apns secret is preserved and may remain active. Disable APNS_DELIVERY_ENABLED or rotate/revoke explicitly."
          fi

      ############################################
      # (Optional) Redeploy API if needed
      ############################################
      - name: 🔄 Restart API after Terraform-managed configuration changes
        run: |
          set -euo pipefail
          kubectl -n "${{ env.K8S_NAMESPACE }}" rollout restart deployment/claritas-api
          kubectl -n "${{ env.K8S_NAMESPACE }}" rollout status deployment/claritas-api --timeout=300s

      - name: 🔄 Show deployments
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" get deploy,svc,ingress
