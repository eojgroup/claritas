name: Terraform Infrastructure Deployment
# This workflow deploys Terraform infrastructure to Google Cloud using OIDC authentication.
# It is triggered on pushes to the main branch.
# The workflow includes steps for checking out the code, setting up Terraform, authenticating to Google Cloud,
# initializing Terraform, importing existing resources, planning changes, and applying the configuration.
# The workflow uses a service account with Workload Identity Federation for authentication.
# The service account is specified using the workload identity provider and service account name.
# The workflow also includes permissions for OIDC and repository contents.

on:
  push:
    branches: [main]

permissions:
  id-token: write  # Required for OIDC
  contents: read   # Required to clone the repo

jobs:
  deploy:
    name: Terraform Apply via OIDC
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v3

      - name: ⚙️ Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: 🔐 Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"

      - name: 🌍 Terraform Init
        working-directory: infra/gcp/terraform
        run: terraform init -migrate-state -force-copy

      - name: 🛠️ Terraform Import (GCS Bucket)
        working-directory: infra/gcp/terraform
        run: |
          # Import GCS bucket to state if it exists, skip if already imported
          terraform import google_storage_bucket.terraform_state claritas-tf-state || true

      - name: 🛠️ Terraform Import (Artifact Registry Repository)
        working-directory: infra/gcp/terraform
        run: |
          # Import the Artifact Registry repository if it exists
          terraform import google_artifact_registry_repository.claritas_app projects/claritas-457808/locations/europe-west2/repositories/claritas-app || true

      - name: 🛠️ Terraform Import (GKE Cluster)
        working-directory: infra/gcp/terraform
        run: |
          # Import the GKE cluster if it exists
          terraform import google_container_cluster.primary projects/claritas-457808/locations/europe-west2/clusters/claritas-cluster || true

      - name: 🔍 Terraform Plan
        working-directory: infra/gcp/terraform
        run: terraform plan -var-file="terraform.tfvars" -lock=false || true
        # Optional: `|| true` prevents pipeline from failing due to locking errors, but may hide other issues.

      - name: 🚀 Terraform Apply
        working-directory: infra/gcp/terraform
        run: terraform apply -auto-approve -var-file="terraform.tfvars" -lock=false