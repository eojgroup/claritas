name: Terraform OIDC Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write  # Required for OIDC
  contents: read   # Required to clone the repo

jobs:
  deploy:
    name: Terraform Apply via OIDC
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v3

      - name: ⚙️ Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: 🔐 Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-wif-pool/providers/claritas-github-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"

      - name: 🌍 Terraform Init
        working-directory: infra/gcp
        run: terraform init

      - name: 🔍 Terraform Plan
        working-directory: infra/gcp
        run: terraform plan -var-file="terraform.tfvars"

      - name: 🚀 Terraform Apply
        working-directory: infra/gcp
        run: terraform apply -auto-approve -var-file="terraform.tfvars"