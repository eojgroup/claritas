name: Terraform Deploy

on:
  push:
    branches: [main]

jobs:
  terraform:
    name: Secure Terraform Apply
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v3

      - name: ⚙️ Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: 📝 Write raw GCP credentials to keyfile.json
        run: |
          echo "${{ secrets.GCP_CREDENTIALS }}" > keyfile.json

          echo "🔵 Showing first 5 lines of keyfile.json:"
          head -n 5 keyfile.json || echo "❌ Cannot read keyfile.json"

          echo "🔵 Validate if JSON is correct with jq:"
          cat keyfile.json | jq . || echo "❌ Invalid JSON structure!"

      - name: ⚙️ Terraform Init
        working-directory: infra/gcp
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/keyfile.json
        run: terraform init

      - name: 🔍 Terraform Plan
        working-directory: infra/gcp
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/keyfile.json
        run: terraform plan -var-file="terraform.tfvars"

      - name: 🚀 Terraform Apply
        working-directory: infra/gcp
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/keyfile.json
        run: terraform apply -auto-approve -var-file="terraform.tfvars"

      - name: 🧹 Securely delete keyfile
        if: always()
        run: shred -u keyfile.json || rm -f keyfile.json