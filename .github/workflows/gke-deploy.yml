name: Build and Deploy to GKE

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build Docker Image and Push to Artifact Registry
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3

      - name: 🚀 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🧾 Debug repo layout
        run: |
          echo "PWD=$(pwd)"
          ls -la
          echo "---- apps/web ----" && ls -la ./apps/web || true
          echo "---- apps/api ----" && ls -la ./apps/api || true

      - name: 🔐 Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"

      - name: Configure Docker for Google Cloud Artifact Registry
        run: |
          echo "Configuring Docker to use Google Cloud credentials for Artifact Registry"
          gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

      - name: 🏗️ Build Docker image (web)
        env:
          IMAGE_URI_WEB: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-web
        run: |
          test -f ./apps/web/Dockerfile || { echo "ERROR: ./apps/web/Dockerfile not found"; exit 1; }
          docker build -t "${IMAGE_URI_WEB}:${{ github.sha }}" -f ./apps/web/Dockerfile .

      - name: 🖼️ Push Docker image (web)
        env:
          IMAGE_URI_WEB: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-web
        run: |
          docker push "${IMAGE_URI_WEB}:${{ github.sha }}"

      - name: 🏗️ Build Docker image (api)
        env:
          IMAGE_URI_API: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-api
        run: |
          test -f ./apps/api/Dockerfile || { echo "ERROR: ./apps/api/Dockerfile not found"; exit 1; }
          docker build -t "${IMAGE_URI_API}:${{ github.sha }}" -f ./apps/api/Dockerfile .

      - name: 🖼️ Push Docker image (api)
        env:
          IMAGE_URI_API: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-api
        run: |
          docker push "${IMAGE_URI_API}:${{ github.sha }}"

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build
    env:
      PROJECT_ID: claritas-457808
      REGION: europe-west2
      CLUSTER: claritas-cluster
      NAMESPACE: claritas
      IMAGE_URI_WEB: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-web
      IMAGE_URI_API: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-api
      DOMAIN: app.claritas.info
      DNS_ZONE: ""  # set to your Cloud DNS managed zone name to auto-manage A record (optional)

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3

      - name: 🔐 Authenticate to GKE with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"

      - name: 🔧 Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: 💻 Configure kubectl
        run: |
          echo "Getting GKE credentials for cluster ${CLUSTER}"
          gcloud container clusters get-credentials "${CLUSTER}" --region "${REGION}" --project "${PROJECT_ID}"
          kubectl version --client

      - name: 🔎 Debug cluster & namespace
        run: |
          echo "Context:" && kubectl config current-context
          echo "Namespaces:" && kubectl get ns -o wide
          echo "All deployments (all namespaces):" && kubectl get deploy -A -o wide || true
          echo "Resources in ${NAMESPACE}:" && kubectl -n "${NAMESPACE}" get all || true
          echo "Manifests present:" && ls -la ./infra/k8s || true

      - name: 🧭 Ensure namespace exists
        run: |
          kubectl get ns "${NAMESPACE}" || kubectl create ns "${NAMESPACE}"

      - name: 🛡️ Apply RBAC (ServiceAccounts for Workload Identity)
        run: |
          kubectl get ns "${NAMESPACE}" || kubectl create ns "${NAMESPACE}"
          kubectl -n "${NAMESPACE}" apply -f infra/k8s/api-sa.yaml
          kubectl -n "${NAMESPACE}" apply -f infra/k8s/flyway-sa.yaml

      - name: ⚙️ Apply ConfigMaps
        run: |
          # Ensure claritas-config (DB_NAME, DB_USER, INSTANCE_CONNECTION_NAME) exists
          kubectl -n "${NAMESPACE}" apply -f infra/k8s/config/db-config.yaml

      - name: 🛠️ Apply Kubernetes resources
        run: |
          kubectl apply -f ./infra/k8s/web-deployment.yaml
          kubectl apply -f ./infra/k8s/web-service.yaml
          kubectl apply -f ./infra/k8s/api-deployment.yaml
          kubectl apply -f ./infra/k8s/api-service.yaml
          # Scheduled ingest CronJob
          kubectl apply -f ./infra/k8s/ingest-cronjob.yaml
          kubectl apply -f ./infra/k8s/managed-cert.yaml
          kubectl apply -f ./infra/k8s/ingress.yaml

      - name: 🔐 Ensure DB secret matches Terraform state
        env:
          NS: ${{ env.NAMESPACE }}
        run: |
          set -euo pipefail
          # Read DB name/user from the ConfigMap we just applied
          DB_NAME=$(kubectl -n "$NS" get configmap claritas-config -o jsonpath='{.data.DB_NAME}')
          DB_USER=$(kubectl -n "$NS" get configmap claritas-config -o jsonpath='{.data.DB_USER}')
          # Extract password from local terraform state (dev convenience). In prod, source from Secret Manager.
          DB_PASS=$(jq -r '.resources[] | select(.type=="random_password" and .name=="db_password") | .instances[0].attributes.result' infra/gcp/terraform/terraform.tfstate)
          if [ -z "$DB_PASS" ] || [ "$DB_PASS" = "null" ]; then
            echo "::warning::Could not extract DB password from terraform.tfstate; skipping secret upsert"
          else
            kubectl -n "$NS" delete secret claritas-db --ignore-not-found
            kubectl -n "$NS" create secret generic claritas-db \
              --from-literal=DB_NAME="$DB_NAME" \
              --from-literal=DB_USER="$DB_USER" \
              --from-literal=DB_PASSWORD="$DB_PASS"
          fi

      - name: 🔐 Ensure API provider secrets exist
        env:
          NS: ${{ env.NAMESPACE }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          set -euo pipefail
          # Upsert NewsAPI secret if provided
          if [ -n "${NEWSAPI_API_KEY:-}" ]; then
            kubectl -n "$NS" create secret generic claritas-newsapi \
              --from-literal=NEWSAPI_API_KEY="$NEWSAPI_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::NEWSAPI_API_KEY secret not provided; skipping claritas-newsapi upsert"
          fi

          # Upsert OpenWeather secret if provided
          if [ -n "${OPENWEATHER_API_KEY:-}" ]; then
            kubectl -n "$NS" create secret generic claritas-openweather \
              --from-literal=OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::OPENWEATHER_API_KEY secret not provided; skipping claritas-openweather upsert"
          fi

      - name: 🧩 Run DB migrations (Flyway)
        env:
          NS: ${{ env.NAMESPACE }}
        run: |
          set -euo pipefail
          # Upsert Flyway scripts from repo SQL directory
          kubectl -n "$NS" create configmap flyway-scripts \
            --from-file=infra/gcp/sql/ \
            --dry-run=client -o yaml | kubectl apply -f -

          # Recreate and apply the Job
          kubectl -n "$NS" delete job flyway-migrate --ignore-not-found=true || true
          kubectl -n "$NS" apply -f infra/k8s/migrations/flyway-job.yaml

          # Wait for completion and show logs on failure
          echo "Waiting for pod of job/flyway-migrate to start..."
          for i in $(seq 1 60); do
            POD=$(kubectl -n "$NS" get pods -l job-name=flyway-migrate -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "${POD:-}" ]; then break; fi
            sleep 5
          done
          if [ -z "${POD:-}" ]; then
            echo "::error::No pod created for job/flyway-migrate within timeout" >&2
            kubectl -n "$NS" get job flyway-migrate -o wide || true
            exit 1
          fi
          echo "Tracking container 'flyway' in pod $POD ..."
          for i in $(seq 1 120); do
            CODE=$(kubectl -n "$NS" get pod "$POD" -o jsonpath='{.status.containerStatuses[?(@.name=="flyway")].state.terminated.exitCode}' 2>/dev/null || true)
            if [ "${CODE:-}" = "0" ]; then
              echo "Flyway finished successfully. Showing logs:"
              kubectl -n "$NS" logs "$POD" -c flyway --tail=200 || true
              kubectl -n "$NS" delete job flyway-migrate --wait=true || true
              break
            elif [ -n "${CODE:-}" ]; then
              echo "::error::Flyway container exited with code ${CODE}" >&2
              echo "=== Logs (flyway) ===" >&2
              kubectl -n "$NS" logs "$POD" -c flyway --tail=200 || true
              echo "=== Logs (cloud-sql-proxy) ===" >&2
              kubectl -n "$NS" logs "$POD" -c cloud-sql-proxy --tail=200 || true
              exit 1
            fi
            sleep 5
          done

      - name: 📤 Set image and rollout (with diagnostics)
        run: |
          set -euo pipefail
          ns="${NAMESPACE}"

          # Update images to this commit
          kubectl -n "$ns" set image deployment/claritas-web claritas-web="${IMAGE_URI_WEB}:${{ github.sha }}"
          kubectl -n "$ns" set image deployment/claritas-api claritas-api="${IMAGE_URI_API}:${{ github.sha }}"

          wait_rollout () {
            local dep="$1"
            echo "⏳ Waiting for rollout of $dep ..."
            if ! kubectl -n "$ns" rollout status "deployment/${dep}" --timeout=600s; then
              echo "::warning::Rollout for ${dep} timed out — dumping diagnostics"
              echo "=== describe deployment ==="
              kubectl -n "$ns" describe deployment "${dep}" | sed -n '1,200p' || true
              echo "=== replica sets ==="
              kubectl -n "$ns" get rs -l app=${dep} -o wide || true
              local rs
              rs="$(kubectl -n "$ns" get rs -l app=${dep} -o name | tail -n1 || true)"
              if [ -n "${rs}" ]; then
                echo "=== describe $rs ==="
                kubectl -n "$ns" describe "${rs}" | sed -n '1,200p' || true
              fi
              echo "=== pods ==="
              kubectl -n "$ns" get pods -l app=${dep} -o wide || true
              for p in $(kubectl -n "$ns" get pods -l app=${dep} -o name); do
                echo "--- logs $p (all containers, last 200) ---"
                kubectl -n "$ns" logs "$p" --all-containers --tail=200 || true
              done
              exit 1
            fi
            echo "✅ ${dep} rolled out"
          }

          wait_rollout claritas-web
          wait_rollout claritas-api

      - name: 🔒 Check ManagedCertificate (best-effort)
        continue-on-error: true
        run: |
          echo "ManagedCertificate status:" || true
          kubectl -n "${NAMESPACE}" get managedcertificate claritas-web-cert -o yaml || true
          echo "Describe certificate:" || true
          kubectl -n "${NAMESPACE}" describe managedcertificate claritas-web-cert | sed -n '1,200p' || true

      - name: 🌐 Show Ingress IP and suggested DNS
        run: |
          INGRESS_IP=$(kubectl -n "${NAMESPACE}" get ingress claritas -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Ingress IP: ${INGRESS_IP}"
          echo "Add/ensure A record: ${DOMAIN} -> ${INGRESS_IP}"

      - name: 🌐 Ensure A record in Cloud DNS (optional)
        if: env.DNS_ZONE != ''
        run: |
          set -euo pipefail
          INGRESS_IP=$(kubectl -n "${NAMESPACE}" get ingress claritas -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Ensuring A record for ${DOMAIN} in zone ${DNS_ZONE} -> ${INGRESS_IP}"
          gcloud dns managed-zones describe "${DNS_ZONE}" >/dev/null

          gcloud dns record-sets transaction start --zone="${DNS_ZONE}" || true

          EXISTING=$(gcloud dns record-sets list --zone="${DNS_ZONE}" --name="${DOMAIN}." --type=A --format='value(rrdatas[])') || true
          if [ -n "${EXISTING:-}" ]; then
            gcloud dns record-sets transaction remove --zone="${DNS_ZONE}" --name="${DOMAIN}." --type=A --ttl=300 ${EXISTING} || true
          fi

          gcloud dns record-sets transaction add --zone="${DNS_ZONE}" --name="${DOMAIN}." --type=A --ttl=300 "${INGRESS_IP}"

          gcloud dns record-sets transaction execute --zone="${DNS_ZONE}"
          echo "A ${DOMAIN} -> ${INGRESS_IP} ensured."
