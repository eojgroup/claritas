name: Build and Deploy to GKE
run-name: GKE release · ${{ github.sha }}

on:
  push:
    branches:
      - main
    # Runtime deployments own application images, Kubernetes manifests, and
    # Flyway scripts. Pure Terraform/docs changes do not need image builds.
    paths:
      - 'apps/**'
      - 'infra/k8s/**'
      - 'infra/gcp/sql/**'
      - 'infra/scripts/check-flyway-migrations.py'
      - 'infra/scripts/wait-for-k8s-job.sh'
      - '.github/workflows/gke-deploy.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'apps/mobile/**'
      - '.github/workflows/**'
      - 'infra/gcp/terraform/**'
      - 'infra/k8s/api-deployment.yaml'
      - 'infra/k8s/config/claritas-config.yaml'
      - 'infra/gcp/sql/**'
      - 'infra/k8s/migrations/**'
      - 'infra/scripts/check-flyway-migrations.py'
      - 'infra/scripts/wait-for-k8s-job.sh'
  workflow_dispatch:

# Terraform deployment also updates production Kubernetes configuration.
# Serialize production runs, but isolate and supersede validation runs per PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('claritas-deployment-validation-{0}', github.event.pull_request.number) || 'claritas-production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflows, migrations, and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Build API and smoke-test briefing map
        working-directory: apps/api
        run: |
          npm ci
          npm test
          npm run build
          node -e 'const map=require("./dist/email-map.js"); map.renderBriefingMapPng([{country_iso2:"US",country_name:"United States",relevance_score:95,news_count:4,podcast_count:1,market_count:2}]).then((image)=>{if(image.length<1000)process.exit(1);console.log("Rendered "+image.length+" byte briefing map.");})'

      - name: Exercise the event backbone against PostGIS
        working-directory: apps/api
        run: |
          set -euo pipefail
          docker run --name claritas-postgis-test \
            -e POSTGRES_PASSWORD=claritas_test \
            -e POSTGRES_DB=claritas \
            -p 54329:5432 \
            -d postgis/postgis:16-3.5
          cleanup() { docker rm -f claritas-postgis-test >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 90); do
            if docker logs claritas-postgis-test 2>&1 | grep -q 'PostgreSQL init process complete' \
              && docker exec claritas-postgis-test pg_isready -U postgres -d claritas >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec claritas-postgis-test pg_isready -U postgres -d claritas
          for migration in $(find ../../infra/gcp/sql -maxdepth 1 -type f -name 'V*.sql' | sort -V); do
            docker exec -i claritas-postgis-test psql -v ON_ERROR_STOP=1 -U postgres -d claritas < "$migration" >/dev/null
          done
          DB_HOST=127.0.0.1 DB_PORT=54329 DB_NAME=claritas \
            DB_USER=postgres DB_PASSWORD=claritas_test npm run test:integration

      - name: Build and lint web
        working-directory: apps/web
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Validate Terraform
        working-directory: infra/gcp/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Validate Flyway migration versions
        run: python3 infra/scripts/check-flyway-migrations.py

      - name: Check deployment shell scripts
        run: bash -n infra/scripts/wait-for-k8s-job.sh

  build:
    name: Build Docker Image and Push to Artifact Registry
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🧾 Debug repo layout
        run: |
          echo "PWD=$(pwd)"
          ls -la
          echo "---- apps/web ----"
          ls -la ./apps/web || true
          echo "---- apps/api ----"
          ls -la ./apps/api || true

      - name: 🔐 Authenticate to Google Cloud via OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"
          token_format: "access_token"
          access_token_lifetime: "3600s"

      - name: 🔑 Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-west2-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: 🏗️ Build Docker image (web)
        env:
          IMAGE_URI_WEB: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-web
        run: |
          test -f ./apps/web/Dockerfile || { echo "ERROR: ./apps/web/Dockerfile not found"; exit 1; }
          docker build -t "${IMAGE_URI_WEB}:${{ github.sha }}" -t "${IMAGE_URI_WEB}:latest" -f ./apps/web/Dockerfile .

      - name: 🖼️ Push Docker image (web)
        env:
          IMAGE_URI_WEB: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-web
        run: |
          for tag in "${{ github.sha }}" "latest"; do
            for attempt in 1 2 3; do
              if docker push "${IMAGE_URI_WEB}:${tag}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "Failed to push ${IMAGE_URI_WEB}:${tag} after ${attempt} attempts" >&2
                exit 1
              fi
              echo "Retrying ${IMAGE_URI_WEB}:${tag} (attempt ${attempt}/3)..." >&2
              sleep $((attempt * 10))
            done
          done

      - name: 🏗️ Build Docker image (api)
        env:
          IMAGE_URI_API: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-api
        run: |
          test -f ./apps/api/Dockerfile || { echo "ERROR: ./apps/api/Dockerfile not found"; exit 1; }
          docker build -t "${IMAGE_URI_API}:${{ github.sha }}" -t "${IMAGE_URI_API}:latest" -f ./apps/api/Dockerfile .

      - name: 🖼️ Push Docker image (api)
        env:
          IMAGE_URI_API: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-api
        run: |
          for tag in "${{ github.sha }}" "latest"; do
            for attempt in 1 2 3; do
              if docker push "${IMAGE_URI_API}:${tag}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "Failed to push ${IMAGE_URI_API}:${tag} after ${attempt} attempts" >&2
                exit 1
              fi
              echo "Retrying ${IMAGE_URI_API}:${tag} (attempt ${attempt}/3)..." >&2
              sleep $((attempt * 10))
            done
          done

      - name: 🏗️ Build Docker image (opencode)
        env:
          IMAGE_URI_OPENCODE: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/opencode
        run: |
          test -f ./apps/opencode/Dockerfile || { echo "ERROR: ./apps/opencode/Dockerfile not found"; exit 1; }
          docker build -t "${IMAGE_URI_OPENCODE}:${{ github.sha }}" -t "${IMAGE_URI_OPENCODE}:latest" -f ./apps/opencode/Dockerfile .

      - name: 🖼️ Push Docker image (opencode)
        env:
          IMAGE_URI_OPENCODE: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/opencode
        run: |
          for tag in "${{ github.sha }}" "latest"; do
            for attempt in 1 2 3; do
              if docker push "${IMAGE_URI_OPENCODE}:${tag}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "Failed to push ${IMAGE_URI_OPENCODE}:${tag} after ${attempt} attempts" >&2
                exit 1
              fi
              echo "Retrying ${IMAGE_URI_OPENCODE}:${tag} (attempt ${attempt}/3)..." >&2
              sleep $((attempt * 10))
            done
          done

  deploy:
    name: Deploy to GKE
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Keep enough headroom for bounded rollouts plus a four-workload rollback,
    # while preventing a stalled production control-plane call from occupying
    # the serialized deploy lane indefinitely.
    timeout-minutes: 180
    needs: build
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: claritas-457808
      REGION: europe-west2
      CLUSTER: claritas-cluster
      NAMESPACE: claritas
      IMAGE_URI_WEB: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-web
      IMAGE_URI_API: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-api
      IMAGE_URI_OPENCODE: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/opencode
      DOMAIN: app.claritas.info
      AUTH_DOMAIN: auth.claritas.info
      DNS_ZONE: ""  # set to your Cloud DNS managed zone name to auto-manage A record (optional)

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to GKE with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"

      - name: 🔧 Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: 🧰 Setup Terraform (outputs)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false

      - name: 💻 Configure kubectl credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          use_auth_provider: false

      - name: 💻 Verify kubectl client
        run: |
          echo "Configured GKE credentials for cluster ${CLUSTER}"
          kubectl version --client

      - name: 🔎 Debug cluster & namespace
        run: |
          echo "Context:"
          kubectl config current-context
          echo "Namespaces:"
          kubectl get ns -o wide
          echo "All deployments (all namespaces):"
          kubectl get deploy -A -o wide || true
          echo "Resources in ${NAMESPACE}:"
          kubectl -n "${NAMESPACE}" get all || true
          echo "Manifests present:"
          ls -la ./infra/k8s || true

      - name: ✅ Validate manifests have no placeholder images
        run: |
          set -euo pipefail
          if grep -RIn "PLACEHOLDER" infra/k8s; then
            echo "::error::Found placeholder values in Kubernetes manifests. Replace before deploy." >&2
            exit 1
          fi

      - name: 🧭 Ensure namespace exists
        run: |
          kubectl get ns "${NAMESPACE}" || kubectl create ns "${NAMESPACE}"

      - name: 🛡️ Apply RBAC (ServiceAccounts for Workload Identity)
        run: |
          kubectl get ns "${NAMESPACE}" || kubectl create ns "${NAMESPACE}"
          kubectl -n "${NAMESPACE}" apply -f infra/k8s/api-sa.yaml
          kubectl -n "${NAMESPACE}" apply -f infra/k8s/flyway-sa.yaml
          kubectl -n "${NAMESPACE}" apply -f infra/k8s/keycloak-sa.yaml

      - name: ⚙️ Apply ConfigMaps
        env:
          BRIEFING_LLM_PROVIDER: ${{ secrets.BRIEFING_LLM_PROVIDER }}
          OPENCODE_SERVER_URL: ${{ secrets.OPENCODE_SERVER_URL }}
          OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL }}
          OPENCODE_PROVIDER_ID: ${{ secrets.OPENCODE_PROVIDER_ID }}
          OPENCODE_MODEL_ID: ${{ secrets.OPENCODE_MODEL_ID }}
          PODCAST_DISCOVERY_TERMS: ${{ vars.PODCAST_DISCOVERY_TERMS }}
          PODCAST_FEED_IDS: ${{ vars.PODCAST_FEED_IDS }}
          PODCAST_MAX_FEEDS: ${{ vars.PODCAST_MAX_FEEDS }}
          PODCAST_MAX_EPISODES_PER_FEED: ${{ vars.PODCAST_MAX_EPISODES_PER_FEED }}
          PODCAST_INTELLIGENCE_EXTRACTION_ENABLED: ${{ vars.PODCAST_INTELLIGENCE_EXTRACTION_ENABLED }}
          PODCASTINDEX_USER_AGENT: ${{ vars.PODCASTINDEX_USER_AGENT }}
          SEC_EDGAR_USER_AGENT: ${{ vars.SEC_EDGAR_USER_AGENT || secrets.SEC_EDGAR_USER_AGENT }}
          NWS_USER_AGENT: ${{ vars.NWS_USER_AGENT || secrets.NWS_USER_AGENT }}
          EVENT_CORRELATION_ENABLED: ${{ vars.EVENT_CORRELATION_ENABLED || 'true' }}
          EVENT_ALERTS_ENABLED: ${{ vars.EVENT_ALERTS_ENABLED || 'true' }}
          EARTH_OBSERVATION_ENABLED: ${{ vars.EARTH_OBSERVATION_ENABLED || 'true' }}
          COPERNICUS_ENABLED: ${{ vars.COPERNICUS_ENABLED || 'true' }}
          NASA_FIRMS_ENABLED: ${{ vars.NASA_FIRMS_ENABLED || 'true' }}
          NASA_GIBS_ENABLED: ${{ vars.NASA_GIBS_ENABLED || 'true' }}
          USGS_EARTHQUAKES_ENABLED: ${{ vars.USGS_EARTHQUAKES_ENABLED || 'true' }}
          EO_VISION_ENRICHMENT_ENABLED: ${{ vars.EO_VISION_ENRICHMENT_ENABLED || 'true' }}
          EO_VISION_MODEL: ${{ vars.EO_VISION_MODEL || 'openrouter/free' }}
          EO_VISION_MAX_DAILY_REQUESTS: ${{ vars.EO_VISION_MAX_DAILY_REQUESTS || '10' }}
          EO_VISION_MAX_IMAGE_BYTES: ${{ vars.EO_VISION_MAX_IMAGE_BYTES || '8388608' }}
          EO_MAX_DAILY_PROCESSING_UNITS: ${{ vars.EO_MAX_DAILY_PROCESSING_UNITS || '100' }}
          EO_MAX_MONTHLY_PROCESSING_UNITS: ${{ vars.EO_MAX_MONTHLY_PROCESSING_UNITS || '3000' }}
          EO_ESTIMATED_PROCESSING_UNITS_PER_RENDER: ${{ vars.EO_ESTIMATED_PROCESSING_UNITS_PER_RENDER || '4' }}
          EO_MAX_REVISITS_PER_EVENT: ${{ vars.EO_MAX_REVISITS_PER_EVENT || '2' }}
          EO_REVISIT_INTERVAL_HOURS: ${{ vars.EO_REVISIT_INTERVAL_HOURS || '24' }}
          EO_ASSET_RETENTION_DAYS: ${{ vars.EO_ASSET_RETENTION_DAYS }}
          APNS_DELIVERY_ENABLED: ${{ vars.APNS_DELIVERY_ENABLED || 'true' }}
          APNS_MATERIALIZATION_BATCH_SIZE: ${{ vars.APNS_MATERIALIZATION_BATCH_SIZE || '500' }}
          APNS_MAX_ACTIVE_DEVICES_PER_USER: ${{ vars.APNS_MAX_ACTIVE_DEVICES_PER_USER || '8' }}
          APNS_MAX_DEVICE_RECORDS_PER_USER: ${{ vars.APNS_MAX_DEVICE_RECORDS_PER_USER || '64' }}
          IMPORTANT_EVENT_EMAIL_ENABLED: ${{ vars.IMPORTANT_EVENT_EMAIL_ENABLED || 'true' }}
          IMPORTANT_EVENT_EMAIL_POLL_SECONDS: ${{ vars.IMPORTANT_EVENT_EMAIL_POLL_SECONDS || '20' }}
          IMPORTANT_EVENT_EMAIL_CYCLE_CAP: ${{ vars.IMPORTANT_EVENT_EMAIL_CYCLE_CAP || '10' }}
          IMPORTANT_EVENT_EMAIL_MATERIALIZATION_CAP: ${{ vars.IMPORTANT_EVENT_EMAIL_MATERIALIZATION_CAP || '200' }}
          IMPORTANT_EVENT_EMAIL_USER_DAILY_CAP: ${{ vars.IMPORTANT_EVENT_EMAIL_USER_DAILY_CAP || '5' }}
          IMPORTANT_EVENT_EMAIL_GLOBAL_DAILY_CAP: ${{ vars.IMPORTANT_EVENT_EMAIL_GLOBAL_DAILY_CAP || '200' }}
          IMPORTANT_EVENT_EMAIL_MAX_AGE_HOURS: ${{ vars.IMPORTANT_EVENT_EMAIL_MAX_AGE_HOURS || '48' }}
        run: |
          # Ensure claritas-config (DB + auth settings) exists
          kubectl -n "${NAMESPACE}" apply -f infra/k8s/config/claritas-config.yaml
          base="${DOMAIN}"
          if [ -n "${base}" ] && [ "${base#http}" = "${base}" ]; then
            base="https://${base}"
          fi
          if [ -n "${base}" ]; then
            allowed_redirects="${base},claritas://,http://localhost:5173,http://localhost:8080"
            api_redirects="${base}/api/auth/google/callback,${base}/api/auth/microsoft/callback,${base}/api/auth/apple/callback,http://localhost:8080/api/auth/google/callback,http://localhost:8080/api/auth/microsoft/callback,http://localhost:8080/api/auth/apple/callback"
            kubectl -n "${NAMESPACE}" patch configmap claritas-config --type merge -p "{\"data\":{\"AUTH_BASE_URL\":\"${base}\",\"AUTH_SUCCESS_REDIRECT_URL\":\"${base}/auth/success\",\"AUTH_FAILURE_REDIRECT_URL\":\"${base}/auth/error\",\"AUTH_ALLOWED_REDIRECTS\":\"${allowed_redirects}\",\"AUTH_ALLOWED_REDIRECT_SCHEMES\":\"claritas\",\"KEYCLOAK_API_REDIRECT_URIS\":\"${api_redirects}\"}}"
          fi
          node <<'NODE'
          const fs = require("fs");
          const data = {};
          for (const key of [
            "BRIEFING_LLM_PROVIDER",
            "OPENCODE_SERVER_URL",
            "OPENCODE_MODEL",
            "OPENCODE_PROVIDER_ID",
            "OPENCODE_MODEL_ID",
            "PODCAST_DISCOVERY_TERMS",
            "PODCAST_FEED_IDS",
            "PODCAST_MAX_FEEDS",
            "PODCAST_MAX_EPISODES_PER_FEED",
            "PODCAST_INTELLIGENCE_EXTRACTION_ENABLED",
            "PODCASTINDEX_USER_AGENT",
            "SEC_EDGAR_USER_AGENT",
            "NWS_USER_AGENT",
            "EVENT_CORRELATION_ENABLED",
            "EVENT_ALERTS_ENABLED",
            "EARTH_OBSERVATION_ENABLED",
            "COPERNICUS_ENABLED",
            "NASA_FIRMS_ENABLED",
            "NASA_GIBS_ENABLED",
            "USGS_EARTHQUAKES_ENABLED",
            "EO_VISION_ENRICHMENT_ENABLED",
            "EO_VISION_MODEL",
            "EO_VISION_MAX_DAILY_REQUESTS",
            "EO_VISION_MAX_IMAGE_BYTES",
            "EO_MAX_DAILY_PROCESSING_UNITS",
            "EO_MAX_MONTHLY_PROCESSING_UNITS",
            "EO_ESTIMATED_PROCESSING_UNITS_PER_RENDER",
            "EO_MAX_REVISITS_PER_EVENT",
            "EO_REVISIT_INTERVAL_HOURS",
            "EO_ASSET_RETENTION_DAYS",
            "APNS_DELIVERY_ENABLED",
            "APNS_MATERIALIZATION_BATCH_SIZE",
            "APNS_MAX_ACTIVE_DEVICES_PER_USER",
            "APNS_MAX_DEVICE_RECORDS_PER_USER",
            "IMPORTANT_EVENT_EMAIL_ENABLED",
            "IMPORTANT_EVENT_EMAIL_POLL_SECONDS",
            "IMPORTANT_EVENT_EMAIL_CYCLE_CAP",
            "IMPORTANT_EVENT_EMAIL_MATERIALIZATION_CAP",
            "IMPORTANT_EVENT_EMAIL_USER_DAILY_CAP",
            "IMPORTANT_EVENT_EMAIL_GLOBAL_DAILY_CAP",
            "IMPORTANT_EVENT_EMAIL_MAX_AGE_HOURS",
          ]) {
            const value = process.env[key];
            if (value && value.trim()) data[key] = value.trim();
          }
          fs.writeFileSync("/tmp/claritas-briefing-config.json", JSON.stringify({ data }));
          NODE
          if node -e 'const patch=require("/tmp/claritas-briefing-config.json"); process.exit(Object.keys(patch.data || {}).length ? 0 : 1)'; then
            kubectl -n "${NAMESPACE}" patch configmap claritas-config --type merge -p "$(cat /tmp/claritas-briefing-config.json)"
          else
            echo "::warning::OpenCode briefing config secrets not provided; skipping claritas-config patch"
          fi

      - name: 🛠️ Apply Kubernetes resources (non-workload)
        run: |
          kubectl apply -f ./infra/k8s/api-backendconfig.yaml
          kubectl apply -f ./infra/k8s/web-service.yaml
          kubectl apply -f ./infra/k8s/api-service.yaml
          kubectl apply -f ./infra/k8s/opencode-service.yaml
          kubectl apply -f ./infra/k8s/keycloak-pdb.yaml
          kubectl apply -f ./infra/k8s/keycloak-backendconfig.yaml
          kubectl apply -f ./infra/k8s/keycloak-service.yaml
          kubectl apply -f ./infra/k8s/keycloak-bootstrap-configmap.yaml
          kubectl apply -f ./infra/k8s/keycloak-theme-configmap.yaml
          kubectl -n "${NAMESPACE}" delete managedcertificate claritas-web-cert --ignore-not-found=true
          kubectl apply -f ./infra/k8s/managed-cert.yaml
          kubectl apply -f ./infra/k8s/ingress.yaml

      - name: 🔁 Reconcile Cloud SQL user passwords from Terraform state
        run: |
          set -euo pipefail
          ./infra/scripts/terraform-init-retry.sh infra/gcp/terraform
          DB_PASS="$(terraform -chdir=infra/gcp/terraform output -raw db_pass 2>/dev/null || true)"
          KC_DB_PASS="$(terraform -chdir=infra/gcp/terraform output -raw keycloak_db_pass 2>/dev/null || true)"
          ICN="$(terraform -chdir=infra/gcp/terraform output -raw instance_connection_name 2>/dev/null || true)"
          DB_INSTANCE="${ICN##*:}"
          if [ -z "${DB_INSTANCE:-}" ] || [ "$DB_INSTANCE" = "$ICN" ]; then
            DB_INSTANCE="claritas-sql"
          fi
          if [ -z "${DB_PASS:-}" ] || [ "$DB_PASS" = "null" ]; then
            echo "::error::Could not extract db_pass from Terraform output." >&2
            exit 1
          fi
          if [ -z "${KC_DB_PASS:-}" ] || [ "$KC_DB_PASS" = "null" ]; then
            echo "::error::Could not extract keycloak_db_pass from Terraform output." >&2
            exit 1
          fi
          gcloud sql users set-password claritas_app --instance="$DB_INSTANCE" --project "${PROJECT_ID}" --password="$DB_PASS"
          gcloud sql users set-password keycloak_app --instance="$DB_INSTANCE" --project "${PROJECT_ID}" --password="$KC_DB_PASS"

      - name: 🔐 Ensure DB secret matches Terraform state
        env:
          NS: ${{ env.NAMESPACE }}
        run: |
          set -euo pipefail
          # Read DB name/user from the ConfigMap we just applied
          DB_NAME=$(kubectl -n "$NS" get configmap claritas-config -o jsonpath='{.data.DB_NAME}')
          DB_USER=$(kubectl -n "$NS" get configmap claritas-config -o jsonpath='{.data.DB_USER}')
          # Extract password from Terraform output (remote state via GCS backend).
          DB_PASS=""
          ./infra/scripts/terraform-init-retry.sh infra/gcp/terraform
          DB_PASS=$(terraform -chdir=infra/gcp/terraform output -raw db_pass 2>/dev/null || true)
          if [ -z "$DB_PASS" ] || [ "$DB_PASS" = "null" ]; then
            echo "::error::Could not extract DB password from Terraform output (db_pass). Refusing deploy to avoid broken API DB auth." >&2
            exit 1
          fi
          kubectl -n "$NS" create secret generic claritas-db \
            --from-literal=DB_NAME="$DB_NAME" \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASS" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: 🔐 Ensure API provider secrets exist
        env:
          NS: ${{ env.NAMESPACE }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PODCASTINDEX_API_KEY: ${{ secrets.PODCASTINDEX_API_KEY }}
          PODCASTINDEX_API_SECRET: ${{ secrets.PODCASTINDEX_API_SECRET }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          BARENTSWATCH_AIS_CLIENT_ID: ${{ secrets.BARENTSWATCH_AIS_CLIENT_ID }}
          BARENTSWATCH_AIS_CLIENT_SECRET: ${{ secrets.BARENTSWATCH_AIS_CLIENT_SECRET }}
          MPA_OCEANS_X_API_KEY: ${{ secrets.MPA_OCEANS_X_API_KEY }}
          COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
          COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
          NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_SANDBOX_PRIVATE_KEY: ${{ secrets.APNS_SANDBOX_PRIVATE_KEY }}
          APNS_SANDBOX_KEY_ID: ${{ secrets.APNS_SANDBOX_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
        run: |
          set -euo pipefail
          # Upsert OpenWeather secret if provided
          if [ -n "${OPENWEATHER_API_KEY:-}" ]; then
            kubectl -n "$NS" create secret generic claritas-openweather \
              --from-literal=OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::OPENWEATHER_API_KEY secret not provided; skipping claritas-openweather upsert"
          fi

          # FRED requires a free API key. The connector itself limits ingestion
          # to an explicit public-institution series allowlist.
          if [ -n "${FRED_API_KEY:-}" ]; then
            kubectl -n "$NS" create secret generic claritas-fred \
              --from-literal=FRED_API_KEY="$FRED_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::FRED_API_KEY not provided; FRED ingestion remains opt-in and disabled"
          fi

          # PodcastIndex uses a key and secret to sign each API request.
          if [ -n "${PODCASTINDEX_API_KEY:-}" ] && [ -n "${PODCASTINDEX_API_SECRET:-}" ]; then
            kubectl -n "$NS" create secret generic claritas-podcastindex \
              --from-literal=PODCASTINDEX_API_KEY="$PODCASTINDEX_API_KEY" \
              --from-literal=PODCASTINDEX_API_SECRET="$PODCASTINDEX_API_SECRET" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::PodcastIndex credentials not provided; podcast automation remains disabled"
          fi

          # AISstream uses one server-side key for the long-lived maritime feed.
          if [ -n "${AISSTREAM_API_KEY:-}" ]; then
            kubectl -n "$NS" create secret generic claritas-aisstream \
              --from-literal=AISSTREAM_API_KEY="$AISSTREAM_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::AISSTREAM_API_KEY not provided; primary maritime ingestion is unavailable and only configured regional fallbacks can run"
          fi

          # BarentsWatch exposes Norwegian Coastal Administration AIS through
          # an OAuth client-credentials pair. It is an optional regional path.
          if [ -n "${BARENTSWATCH_AIS_CLIENT_ID:-}" ] && [ -n "${BARENTSWATCH_AIS_CLIENT_SECRET:-}" ]; then
            kubectl -n "$NS" create secret generic claritas-barentswatch-ais \
              --from-literal=BARENTSWATCH_AIS_CLIENT_ID="$BARENTSWATCH_AIS_CLIENT_ID" \
              --from-literal=BARENTSWATCH_AIS_CLIENT_SECRET="$BARENTSWATCH_AIS_CLIENT_SECRET" \
              --dry-run=client -o yaml | kubectl apply -f -
          elif [ -n "${BARENTSWATCH_AIS_CLIENT_ID:-}" ] || [ -n "${BARENTSWATCH_AIS_CLIENT_SECRET:-}" ]; then
            echo "::warning::BarentsWatch AIS credentials are incomplete; the Norwegian HTTPS fallback remains not configured"
          else
            echo "::notice::BarentsWatch AIS credentials not provided; skipping optional Norwegian HTTPS fallback secret"
          fi

          # MPA OCEANS-X uses one server-side API key for its Singapore vessel
          # position snapshot. Missing credentials do not block other sources.
          if [ -n "${MPA_OCEANS_X_API_KEY:-}" ]; then
            kubectl -n "$NS" create secret generic claritas-mpa-oceans-x \
              --from-literal=MPA_OCEANS_X_API_KEY="$MPA_OCEANS_X_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning title=Singapore AIS not configured::MPA_OCEANS_X_API_KEY is absent. The OCEANS-X Singapore vessel feed cannot run until the published Vessel Positions API is subscribed and its production key is stored as this repository secret."
          fi

          eo_args=()
          if [ -n "${COPERNICUS_CLIENT_ID:-}" ]; then
            eo_args+=(--from-literal=COPERNICUS_CLIENT_ID="$COPERNICUS_CLIENT_ID")
          fi
          if [ -n "${COPERNICUS_CLIENT_SECRET:-}" ]; then
            eo_args+=(--from-literal=COPERNICUS_CLIENT_SECRET="$COPERNICUS_CLIENT_SECRET")
          fi
          if [ -n "${NASA_FIRMS_MAP_KEY:-}" ]; then
            eo_args+=(--from-literal=NASA_FIRMS_MAP_KEY="$NASA_FIRMS_MAP_KEY")
          fi
          if [ "${#eo_args[@]}" -gt 0 ]; then
            kubectl -n "$NS" create secret generic claritas-earth-observation "${eo_args[@]}" --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::Earth Observation credentials are absent; credentialed providers remain disabled"
          fi

          apns_args=()
          if [ -n "${APNS_PRIVATE_KEY:-}" ]; then
            apns_args+=(--from-literal=APNS_PRIVATE_KEY="$APNS_PRIVATE_KEY")
          fi
          if [ -n "${APNS_KEY_ID:-}" ]; then
            apns_args+=(--from-literal=APNS_KEY_ID="$APNS_KEY_ID")
          fi
          if [ -n "${APNS_SANDBOX_PRIVATE_KEY:-}" ]; then
            apns_args+=(--from-literal=APNS_SANDBOX_PRIVATE_KEY="$APNS_SANDBOX_PRIVATE_KEY")
          fi
          if [ -n "${APNS_SANDBOX_KEY_ID:-}" ]; then
            apns_args+=(--from-literal=APNS_SANDBOX_KEY_ID="$APNS_SANDBOX_KEY_ID")
          fi
          if [ -n "${APNS_TEAM_ID:-}" ]; then
            apns_args+=(--from-literal=APNS_TEAM_ID="$APNS_TEAM_ID")
          fi
          if [ -n "${APNS_PRIVATE_KEY:-}" ] && [ -n "${APNS_KEY_ID:-}" ] && [ -n "${APNS_TEAM_ID:-}" ] \
             && { [ -z "${APNS_SANDBOX_PRIVATE_KEY:-}" ] && [ -z "${APNS_SANDBOX_KEY_ID:-}" ] \
                  || [ -n "${APNS_SANDBOX_PRIVATE_KEY:-}" ] && [ -n "${APNS_SANDBOX_KEY_ID:-}" ]; }; then
            kubectl -n "$NS" create secret generic claritas-apns "${apns_args[@]}" --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::APNs credentials are incomplete; sandbox key and ID must be supplied together. The existing Kubernetes secret is preserved."
          fi

      - name: 🔐 Ensure OpenCode briefing secrets exist
        env:
          NS: ${{ env.NAMESPACE }}
          OPENCODE_SERVER_USERNAME: ${{ secrets.OPENCODE_SERVER_USERNAME }}
          OPENCODE_SERVER_PASSWORD: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
          OPENCODE_CONFIG_JSON: ${{ secrets.OPENCODE_CONFIG_JSON }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${OPENCODE_SERVER_USERNAME:-}" ]; then
            args+=(--from-literal=OPENCODE_SERVER_USERNAME="$OPENCODE_SERVER_USERNAME")
          fi
          if [ -n "${OPENCODE_SERVER_PASSWORD:-}" ]; then
            args+=(--from-literal=OPENCODE_SERVER_PASSWORD="$OPENCODE_SERVER_PASSWORD")
          fi
          if [ -n "${OPENCODE_AUTH_JSON:-}" ]; then
            args+=(--from-literal=OPENCODE_AUTH_JSON="$OPENCODE_AUTH_JSON")
          fi
          if [ -n "${OPENCODE_CONFIG_JSON:-}" ]; then
            args+=(--from-literal=OPENCODE_CONFIG_JSON="$OPENCODE_CONFIG_JSON")
          fi
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            args+=(--from-literal=OPENROUTER_API_KEY="$OPENROUTER_API_KEY")
          fi
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            args+=(--from-literal=OPENAI_API_KEY="$OPENAI_API_KEY")
          fi
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            args+=(--from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY")
          fi
          if [ -n "${GOOGLE_GENERATIVE_AI_API_KEY:-}" ]; then
            args+=(--from-literal=GOOGLE_GENERATIVE_AI_API_KEY="$GOOGLE_GENERATIVE_AI_API_KEY")
          fi
          if [ -n "${GROQ_API_KEY:-}" ]; then
            args+=(--from-literal=GROQ_API_KEY="$GROQ_API_KEY")
          fi
          if [ -n "${XAI_API_KEY:-}" ]; then
            args+=(--from-literal=XAI_API_KEY="$XAI_API_KEY")
          fi
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            args+=(--from-literal=DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY")
          fi
          if [ "${#args[@]}" -gt 0 ]; then
            kubectl -n "$NS" create secret generic claritas-opencode "${args[@]}" --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::OpenCode server auth secrets not provided; skipping claritas-opencode upsert"
          fi

      - name: 🔐 Ensure Keycloak/API auth secrets exist
        env:
          NS: ${{ env.NAMESPACE }}
          AUTH_KEYCLOAK_CLIENT_SECRET: ${{ secrets.AUTH_KEYCLOAK_CLIENT_SECRET }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KC_IDP_GOOGLE_CLIENT_ID: ${{ secrets.KC_IDP_GOOGLE_CLIENT_ID }}
          KC_IDP_GOOGLE_CLIENT_SECRET: ${{ secrets.KC_IDP_GOOGLE_CLIENT_SECRET }}
          KC_IDP_MICROSOFT_CLIENT_ID: ${{ secrets.KC_IDP_MICROSOFT_CLIENT_ID }}
          KC_IDP_MICROSOFT_CLIENT_SECRET: ${{ secrets.KC_IDP_MICROSOFT_CLIENT_SECRET }}
          KC_IDP_MICROSOFT_TENANT: ${{ secrets.KC_IDP_MICROSOFT_TENANT }}
          KC_IDP_APPLE_CLIENT_ID: ${{ secrets.KC_IDP_APPLE_CLIENT_ID }}
          KC_IDP_APPLE_TEAM_ID: ${{ secrets.KC_IDP_APPLE_TEAM_ID }}
          KC_IDP_APPLE_KEY_ID: ${{ secrets.KC_IDP_APPLE_KEY_ID }}
          KC_IDP_APPLE_PRIVATE_KEY: ${{ secrets.KC_IDP_APPLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          tf_ready=0
          if ./infra/scripts/terraform-init-retry.sh infra/gcp/terraform; then
            tf_ready=1
          else
            echo "::warning::Terraform init failed in deploy job; will rely on existing cluster/GitHub secrets."
          fi

          # First fallback: existing Kubernetes secret (keeps previously working credentials stable).
          if [ -z "${KEYCLOAK_DB_PASSWORD:-}" ] || [ "${KEYCLOAK_DB_PASSWORD}" = "null" ]; then
            b64="$(kubectl -n "$NS" get secret claritas-auth -o jsonpath='{.data.KEYCLOAK_DB_PASSWORD}' 2>/dev/null || true)"
            if [ -n "${b64:-}" ]; then
              KEYCLOAK_DB_PASSWORD="$(printf '%s' "$b64" | base64 --decode 2>/dev/null || true)"
            fi
          fi
          if [ -z "${KEYCLOAK_ADMIN:-}" ]; then
            b64="$(kubectl -n "$NS" get secret claritas-auth -o jsonpath='{.data.KEYCLOAK_ADMIN}' 2>/dev/null || true)"
            if [ -n "${b64:-}" ]; then
              KEYCLOAK_ADMIN="$(printf '%s' "$b64" | base64 --decode 2>/dev/null || true)"
            fi
          fi
          if [ -z "${KEYCLOAK_ADMIN_PASSWORD:-}" ]; then
            b64="$(kubectl -n "$NS" get secret claritas-auth -o jsonpath='{.data.KEYCLOAK_ADMIN_PASSWORD}' 2>/dev/null || true)"
            if [ -n "${b64:-}" ]; then
              KEYCLOAK_ADMIN_PASSWORD="$(printf '%s' "$b64" | base64 --decode 2>/dev/null || true)"
            fi
          fi

          # Second fallback: Terraform outputs from remote state.
          if [ "${tf_ready}" -eq 1 ]; then
            if [ -z "${KEYCLOAK_DB_PASSWORD:-}" ] || [ "${KEYCLOAK_DB_PASSWORD}" = "null" ]; then
              KEYCLOAK_DB_PASSWORD="$(terraform -chdir=infra/gcp/terraform output -raw keycloak_db_pass 2>/dev/null || true)"
            fi
            if [ -z "${KEYCLOAK_ADMIN:-}" ]; then
              KEYCLOAK_ADMIN="$(terraform -chdir=infra/gcp/terraform output -raw keycloak_admin 2>/dev/null || true)"
            fi
            if [ -z "${KEYCLOAK_ADMIN_PASSWORD:-}" ]; then
              KEYCLOAK_ADMIN_PASSWORD="$(terraform -chdir=infra/gcp/terraform output -raw keycloak_admin_password 2>/dev/null || true)"
            fi
          fi

          if [ -z "${KEYCLOAK_DB_PASSWORD:-}" ] || [ "${KEYCLOAK_DB_PASSWORD}" = "null" ]; then
            echo "::error::KEYCLOAK_DB_PASSWORD is required. Provide GitHub secret KEYCLOAK_DB_PASSWORD or ensure Terraform output keycloak_db_pass is available." >&2
            exit 1
          fi
          if [ -z "${KEYCLOAK_ADMIN:-}" ]; then
            KEYCLOAK_ADMIN="admin"
          fi
          if [ -z "${KEYCLOAK_ADMIN_PASSWORD:-}" ]; then
            echo "::error::KEYCLOAK_ADMIN_PASSWORD is required. Provide GitHub secret KEYCLOAK_ADMIN_PASSWORD, or set Terraform var keycloak_admin_password and rerun terraform-deploy." >&2
            exit 1
          fi

          args=(
            --from-literal=KEYCLOAK_DB_PASSWORD="$KEYCLOAK_DB_PASSWORD"
            --from-literal=KEYCLOAK_ADMIN="$KEYCLOAK_ADMIN"
            --from-literal=KEYCLOAK_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD"
          )
          if [ -n "${AUTH_KEYCLOAK_CLIENT_SECRET:-}" ]; then
            args+=(--from-literal=AUTH_KEYCLOAK_CLIENT_SECRET="$AUTH_KEYCLOAK_CLIENT_SECRET")
          fi
          if [ -n "${INGEST_API_TOKEN:-}" ]; then
            args+=(--from-literal=INGEST_API_TOKEN="$INGEST_API_TOKEN")
          fi
          if [ -n "${KC_IDP_GOOGLE_CLIENT_ID:-}" ]; then
            args+=(--from-literal=KC_IDP_GOOGLE_CLIENT_ID="$KC_IDP_GOOGLE_CLIENT_ID")
          fi
          if [ -n "${KC_IDP_GOOGLE_CLIENT_SECRET:-}" ]; then
            args+=(--from-literal=KC_IDP_GOOGLE_CLIENT_SECRET="$KC_IDP_GOOGLE_CLIENT_SECRET")
          fi
          if [ -n "${KC_IDP_MICROSOFT_CLIENT_ID:-}" ]; then
            args+=(--from-literal=KC_IDP_MICROSOFT_CLIENT_ID="$KC_IDP_MICROSOFT_CLIENT_ID")
          fi
          if [ -n "${KC_IDP_MICROSOFT_CLIENT_SECRET:-}" ]; then
            args+=(--from-literal=KC_IDP_MICROSOFT_CLIENT_SECRET="$KC_IDP_MICROSOFT_CLIENT_SECRET")
          fi
          if [ -n "${KC_IDP_MICROSOFT_TENANT:-}" ]; then
            args+=(--from-literal=KC_IDP_MICROSOFT_TENANT="$KC_IDP_MICROSOFT_TENANT")
          fi
          if [ -n "${KC_IDP_APPLE_CLIENT_ID:-}" ]; then
            args+=(--from-literal=KC_IDP_APPLE_CLIENT_ID="$KC_IDP_APPLE_CLIENT_ID")
          fi
          if [ -n "${KC_IDP_APPLE_TEAM_ID:-}" ]; then
            args+=(--from-literal=KC_IDP_APPLE_TEAM_ID="$KC_IDP_APPLE_TEAM_ID")
          fi
          if [ -n "${KC_IDP_APPLE_KEY_ID:-}" ]; then
            args+=(--from-literal=KC_IDP_APPLE_KEY_ID="$KC_IDP_APPLE_KEY_ID")
          fi
          if [ -n "${KC_IDP_APPLE_PRIVATE_KEY:-}" ]; then
            args+=(--from-literal=KC_IDP_APPLE_PRIVATE_KEY="$KC_IDP_APPLE_PRIVATE_KEY")
          fi

          kubectl -n "$NS" create secret generic claritas-auth "${args[@]}" --dry-run=client -o yaml | kubectl apply -f -

      - name: 🌐 Ensure static API egress infrastructure exists
        run: |
          set -euo pipefail
          ./infra/scripts/terraform-init-retry.sh infra/gcp/terraform
          terraform -chdir=infra/gcp/terraform apply -auto-approve -var-file="terraform.tfvars" -lock-timeout=5m \
            -target=google_compute_address.api_egress \
            -target=google_compute_router.api_egress \
            -target=google_compute_router_nat.api_egress \
            -target=google_container_node_pool.api_egress
          EGRESS_IP="$(terraform -chdir=infra/gcp/terraform output -raw api_egress_ip)"
          echo "::notice title=Claritas static egress IP::Authorize ${EGRESS_IP} for SMTP in Brevo."

      - name: 📌 Capture complete immutable rollback state
        run: |
          set -euo pipefail
          ns="${NAMESPACE}"

          snapshot_deployment() {
            local deployment="$1"
            local deployment_json="$RUNNER_TEMP/claritas-current-${deployment}.json"
            local pods_json="$RUNNER_TEMP/claritas-current-${deployment}-pods.json"
            local snapshot="$RUNNER_TEMP/claritas-rollback-${deployment}.json"

            # Capture what is actually serving before the first workload
            # manifest is applied. Every regular container (including database
            # sidecars) is pinned to its runtime digest in the saved full spec.
            kubectl -n "$ns" rollout status "deployment/${deployment}" --timeout=300s >&2
            kubectl -n "$ns" get "deployment/${deployment}" -o json > "$deployment_json"
            kubectl -n "$ns" get pods -l "app=${deployment}" -o json > "$pods_json"
            env \
              ROLLBACK_DEPLOYMENT="$deployment" \
              ROLLBACK_DEPLOYMENT_JSON="$deployment_json" \
              ROLLBACK_PODS_JSON="$pods_json" \
              ROLLBACK_SNAPSHOT="$snapshot" \
              node <<'NODE'
          const fs = require("node:fs");
          const deployment = JSON.parse(fs.readFileSync(process.env.ROLLBACK_DEPLOYMENT_JSON, "utf8"));
          const pods = JSON.parse(fs.readFileSync(process.env.ROLLBACK_PODS_JSON, "utf8"));
          const name = process.env.ROLLBACK_DEPLOYMENT;
          const readyPods = (pods.items || []).filter((pod) =>
            (pod.status?.conditions || []).some((condition) =>
              condition.type === "Ready" && condition.status === "True"));
          if (readyPods.length === 0) throw new Error(`No ready pods found for ${name}`);

          const repositoryOf = (image) => {
            const withoutDigest = image.split("@", 1)[0];
            const slash = withoutDigest.lastIndexOf("/");
            const colon = withoutDigest.lastIndexOf(":");
            return colon > slash ? withoutDigest.slice(0, colon) : withoutDigest;
          };
          const immutableImage = (configuredImage, runtimeId) => {
            const id = runtimeId.replace(/^[a-z][a-z0-9+.-]*:\/\//i, "");
            let immutable;
            if (id.includes("@sha256:")) immutable = id;
            else if (/^sha256:[a-f0-9]{64}$/i.test(id)) {
              immutable = `${repositoryOf(configuredImage)}@${id}`;
            } else {
              throw new Error(`Runtime image for ${configuredImage} is not digest-addressed: ${runtimeId}`);
            }
            if (!/@sha256:[a-f0-9]{64}$/i.test(immutable)) {
              throw new Error(`Invalid immutable image derived for ${configuredImage}: ${immutable}`);
            }
            return immutable;
          };

          const containers = deployment.spec?.template?.spec?.containers || [];
          if (containers.length === 0) throw new Error(`Deployment ${name} has no containers`);
          for (const container of containers) {
            const ids = new Set();
            for (const pod of readyPods) {
              const status = (pod.status?.containerStatuses || []).find((entry) =>
                entry.name === container.name && entry.ready === true);
              if (status?.imageID) ids.add(status.imageID);
            }
            if (ids.size !== 1) {
              throw new Error(
                `Expected one serving digest for ${name}/${container.name}; found ${ids.size}: ${Array.from(ids).join(", ")}`,
              );
            }
            container.image = immutableImage(container.image, Array.from(ids)[0]);
          }
          fs.writeFileSync(process.env.ROLLBACK_SNAPSHOT, JSON.stringify({ spec: deployment.spec }));
          NODE

            node -e '
              const snapshot = require(process.argv[1]);
              const containers = snapshot.spec?.template?.spec?.containers || [];
              if (!containers.length || containers.some((container) => !/@sha256:[a-f0-9]{64}$/i.test(container.image || ""))) {
                process.exit(1);
              }
            ' "$snapshot"
          }

          for deployment in keycloak claritas-web claritas-api opencode; do
            snapshot_deployment "$deployment"
          done
          {
            echo "APPLICATION_ROLLBACK_ARMED=true"
            echo "RELEASE_GATE_ID=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          } >> "$GITHUB_ENV"
          echo "Captured four complete pre-release workload specs with every container image pinned by digest."

      - name: 🛠️ Apply identity deployment
        run: |
          # Keycloak must be available for the realm bootstrap below. Keep the
          # application workloads on the previous image until this commit's
          # migrations have completed and their schema has been verified.
          kubectl apply -f ./infra/k8s/keycloak-deployment.yaml

      - name: 🔑 Bootstrap Keycloak realm and IdPs
        env:
          NS: ${{ env.NAMESPACE }}
        run: |
          set -euo pipefail
          if ! kubectl -n "$NS" rollout status deployment/keycloak --timeout=600s; then
            echo "::error::Keycloak deployment rollout failed. Dumping diagnostics..." >&2
            kubectl -n "$NS" get deploy keycloak -o wide || true
            kubectl -n "$NS" describe deploy keycloak || true
            kubectl -n "$NS" get pods -l app=keycloak -o wide || true
            for p in $(kubectl -n "$NS" get pods -l app=keycloak -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true); do
              echo "=== describe pod/${p} ==="
              kubectl -n "$NS" describe pod "$p" || true
              echo "=== logs pod/${p} container=keycloak ==="
              kubectl -n "$NS" logs "$p" -c keycloak --tail=200 || true
              echo "=== logs pod/${p} container=cloud-sql-proxy ==="
              kubectl -n "$NS" logs "$p" -c cloud-sql-proxy --tail=200 || true
            done
            exit 1
          fi
          job="keycloak-bootstrap-${GITHUB_RUN_ID}"
          kubectl -n "$NS" delete job "$job" --ignore-not-found=true || true
          sed -E "s/^\s*name: keycloak-bootstrap$/  name: ${job}/" infra/k8s/keycloak-bootstrap-job.yaml | kubectl -n "$NS" apply -f -
          if ! kubectl -n "$NS" wait --for=condition=complete "job/${job}" --timeout=600s; then
            echo "::error::Keycloak bootstrap job failed" >&2
            kubectl -n "$NS" describe "job/${job}" || true
            kubectl -n "$NS" logs "job/${job}" --tail=200 || true
            exit 1
          fi
          kubectl -n "$NS" logs "job/${job}" --tail=200 || true
          kubectl -n "$NS" delete "job/${job}" --wait=true || true

      - name: 🧩 Run DB migrations (Flyway)
        env:
          NS: ${{ env.NAMESPACE }}
        run: |
          set -euo pipefail
          # Each migration Job gets an immutable view of the scripts from its
          # own commit; another deployment cannot replace its mounted ConfigMap.
          python3 infra/scripts/check-flyway-migrations.py
          scripts="flyway-scripts-${GITHUB_RUN_ID}"
          kubectl -n "$NS" create configmap "$scripts" \
            --from-file=infra/gcp/sql/ \
            --dry-run=client -o yaml | kubectl apply -f -

          # Use a unique Job name to avoid collisions across runs
          job="flyway-migrate-${GITHUB_RUN_ID}"
          cleanup_migration_artifacts() {
            kubectl -n "$NS" delete job "$job" --ignore-not-found=true --wait=false || true
            kubectl -n "$NS" delete configmap "$scripts" --ignore-not-found=true || true
          }
          trap cleanup_migration_artifacts EXIT
          kubectl -n "$NS" delete job "$job" --ignore-not-found=true || true
          # Apply manifest with a run-scoped job name
          sed -E \
            -e "s/^\s*name: flyway-migrate$/  name: ${job}/" \
            -e "s/^\s*name: flyway-scripts$/            name: ${scripts}/" \
            infra/k8s/migrations/flyway-job.yaml | kubectl -n "$NS" apply -f -

          echo "Waiting for Flyway job/$job completion..."
          if ! ./infra/scripts/wait-for-k8s-job.sh "$NS" "$job" 420; then
            echo "::error::Flyway job did not complete successfully" >&2
            kubectl -n "$NS" get job "$job" -o wide || true
            kubectl -n "$NS" describe job "$job" | sed -n '1,200p' || true
            kubectl -n "$NS" get pods -l job-name="$job" -o wide || true
            kubectl -n "$NS" get pods -l job-name="$job" -o jsonpath='{range .items[*]}{.metadata.name}{" flyway="}{.status.containerStatuses[?(@.name=="flyway")].state.terminated.reason}{" exit="}{.status.containerStatuses[?(@.name=="flyway")].state.terminated.exitCode}{" message="}{.status.containerStatuses[?(@.name=="flyway")].state.terminated.message}{"\n"}{end}' || true
            kubectl -n "$NS" logs "job/$job" -c flyway --tail=200 || true
            kubectl -n "$NS" logs "job/$job" -c cloud-sql-proxy --tail=200 || true
            exit 1
          fi
          kubectl -n "$NS" logs "job/$job" -c flyway --tail=200 || true

      - name: ✅ Verify DB schema and migration history
        env:
          NS: ${{ env.NAMESPACE }}
        run: |
          set -euo pipefail
          job="db-verify-${GITHUB_RUN_ID}"
          cleanup_verify_job() {
            kubectl -n "$NS" delete job "$job" --ignore-not-found=true --wait=false || true
          }
          trap cleanup_verify_job EXIT
          kubectl -n "$NS" delete job "$job" --ignore-not-found=true || true
          sed -E "s/^\s*name: db-verify$/  name: ${job}/" infra/k8s/migrations/db-verify-job.yaml | kubectl -n "$NS" apply -f -
          if ! ./infra/scripts/wait-for-k8s-job.sh "$NS" "$job" 600; then
            echo "::error::DB verification failed" >&2
            kubectl -n "$NS" describe "job/${job}" || true
            kubectl -n "$NS" logs "job/${job}" -c db-verify --tail=200 || true
            kubectl -n "$NS" logs "job/${job}" -c cloud-sql-proxy --tail=200 || true
            exit 1
          fi
          kubectl -n "$NS" logs "job/${job}" -c db-verify --tail=200 || true

      - name: 🛠️ Apply application workload deployments
        run: |
          set -euo pipefail
          # These manifests reference :latest, which already points at this
          # commit. Applying them before Flyway could start new API code against
          # an old schema, so application rollout is deliberately post-migrate.
          kubectl apply -f ./infra/k8s/web-deployment.yaml
          kubectl apply -f ./infra/k8s/api-deployment.yaml
          kubectl apply -f ./infra/k8s/opencode-deployment.yaml

      - name: 📤 Set image and rollout (with diagnostics)
        run: |
          set -euo pipefail
          ns="${NAMESPACE}"

          # Update images to this commit
          kubectl -n "$ns" set image deployment/claritas-web claritas-web="${IMAGE_URI_WEB}:${{ github.sha }}"
          kubectl -n "$ns" set image deployment/claritas-api claritas-api="${IMAGE_URI_API}:${{ github.sha }}"
          kubectl -n "$ns" set image deployment/opencode opencode="${IMAGE_URI_OPENCODE}:${{ github.sha }}"
          kubectl -n "$ns" rollout restart deployment/claritas-api
          kubectl -n "$ns" rollout restart deployment/opencode

          wait_rollout () {
            local dep="$1"
            echo "⏳ Waiting for rollout of $dep ..."
            if ! kubectl -n "$ns" rollout status "deployment/${dep}" --timeout=600s; then
              echo "::warning::Rollout for ${dep} timed out — dumping diagnostics"
              echo "=== describe deployment ==="
              kubectl -n "$ns" describe deployment "${dep}" | sed -n '1,200p' || true
              echo "=== replica sets ==="
              kubectl -n "$ns" get rs -l "app=${dep}" -o wide || true
              local rs
              rs="$(kubectl -n "$ns" get rs -l "app=${dep}" -o name | tail -n1 || true)"
              if [ -n "${rs}" ]; then
                echo "=== describe $rs ==="
                kubectl -n "$ns" describe "${rs}" | sed -n '1,200p' || true
              fi
              echo "=== pods ==="
              kubectl -n "$ns" get pods -l "app=${dep}" -o wide || true
              while IFS= read -r p; do
                echo "--- logs $p (all containers, last 200) ---"
                kubectl -n "$ns" logs "$p" --all-containers --tail=200 || true
              done < <(kubectl -n "$ns" get pods -l "app=${dep}" -o name)
              exit 1
            fi
            echo "✅ ${dep} rolled out"
          }

          wait_rollout claritas-web
          wait_rollout claritas-api
          wait_rollout opencode
          wait_rollout keycloak

      - name: 🩺 Verify ingestion and scheduler runtime configuration
        run: |
          set -euo pipefail
          # The single quotes intentionally protect JavaScript template literals from Bash.
          # shellcheck disable=SC2016
          timeout --signal=TERM --kill-after=5s 30s \
            kubectl -n "${NAMESPACE}" exec deployment/claritas-api -c claritas-api -- node -e '
            const missing = [];
            if (!process.env.FRED_API_KEY?.trim()) missing.push("FRED_API_KEY");
            const disabled = (value) => ["0", "false", "no", "off"].includes((value || "true").trim().toLowerCase());
            const primaryConfigured = !disabled(process.env.AISSTREAM_ENABLED) && Boolean(process.env.AISSTREAM_API_KEY?.trim());
            const regionalConfigured =
              !disabled(process.env.DIGITRAFFIC_MARITIME_ENABLED) ||
              (!disabled(process.env.BARENTSWATCH_AIS_ENABLED) && Boolean(process.env.BARENTSWATCH_AIS_CLIENT_ID?.trim()) && Boolean(process.env.BARENTSWATCH_AIS_CLIENT_SECRET?.trim())) ||
              (!disabled(process.env.MPA_OCEANS_X_ENABLED) && Boolean(process.env.MPA_OCEANS_X_API_KEY?.trim()));
            if (!primaryConfigured && !regionalConfigured) missing.push("an enabled, configured maritime provider");
            if (["0", "false", "no", "off"].includes((process.env.DAILY_BRIEFING_SCHEDULER_ENABLED || "true").toLowerCase())) {
              missing.push("DAILY_BRIEFING_SCHEDULER_ENABLED=true");
            }
            if (disabled(process.env.INGEST_AUTOMATION_ENABLED)) {
              missing.push("INGEST_AUTOMATION_ENABLED=true");
            }
            if (disabled(process.env.NEWS_ASSESSMENT_WORKER_ENABLED)) {
              missing.push("NEWS_ASSESSMENT_WORKER_ENABLED=true");
            }
            if (missing.length) {
              console.error(`Required production runtime configuration missing: ${missing.join(", ")}`);
              process.exit(1);
            }
            fetch("http://127.0.0.1:8080/readyz", { signal: AbortSignal.timeout(5_000) })
              .then((response) => {
                if (!response.ok) throw new Error(`readiness returned ${response.status}`);
                console.log("FRED, maritime provider path, ingestion automation, news assessment, daily scheduler, and API readiness are configured.");
              })
              .catch((error) => {
                console.error(error);
                process.exit(1);
              });
          '

          refresh_queued=0
          release_news_run_id=""
          for attempt in $(seq 1 20); do
            echo "Post-rollout news refresh request ${attempt}/20"
            refresh_body="$(
              timeout --signal=TERM --kill-after=5s 20s \
                kubectl -n "${NAMESPACE}" exec deployment/claritas-api -c claritas-api -- \
                env RELEASE_GATE_ID="$RELEASE_GATE_ID" node -e '
                  const url = new URL("http://127.0.0.1:8080/internal/news/refresh");
                  url.searchParams.set("releaseId", process.env.RELEASE_GATE_ID);
                  fetch(url, { method: "POST", signal: AbortSignal.timeout(10_000) })
                    .then(async (response) => ({ status: response.status, body: await response.json() }))
                    .then((result) => process.stdout.write(JSON.stringify(result)))
                    .catch(() => process.exit(1));
                ' 2>/dev/null || true
            )"
            printf '%s\n' "$refresh_body"
            refresh_summary="$(
              printf '%s' "$refresh_body" | node -e '
                let input = "";
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => {
                  try {
                    const result = JSON.parse(input);
                    const runId = Number(result.body?.runId);
                    const accepted = result.status === 202 && Number.isSafeInteger(runId) && runId > 0;
                    process.stdout.write(String(accepted) + "\t" + (accepted ? String(runId) : ""));
                  } catch { process.stdout.write("false\t"); }
                });
              '
            )"
            IFS=$'\t' read -r refresh_queued_value release_news_run_id <<< "$refresh_summary"
            if [ "$refresh_queued_value" = "true" ]; then
              refresh_queued=1
              break
            fi
            if [ "$attempt" -lt 20 ]; then sleep 15; fi
          done
          if [ "$refresh_queued" -ne 1 ]; then
            echo "::error::Could not queue or reuse a post-rollout governed news refresh." >&2
            exit 1
          fi
          echo "RELEASE_NEWS_RUN_ID=${release_news_run_id}" >> "$GITHUB_ENV"
          printf '%s' "$release_news_run_id" > "$RUNNER_TEMP/claritas-release-news-run-id"
          echo "Verifying exact release-owned news run ${release_news_run_id}."

          # Prove the user-visible data outcome, not merely that the scheduler
          # process started: fresh assessed reporting, a current markets stream,
          # publisher diversity, and non-GB subject geography must all exist.
          news_ready=0
          news_body=""
          for attempt in $(seq 1 40); do
            echo "News runtime verification attempt ${attempt}/40"
            news_body="$(
              timeout --signal=TERM --kill-after=5s 30s \
                kubectl -n "${NAMESPACE}" exec deployment/claritas-api -c claritas-api -- \
                env RELEASE_NEWS_RUN_ID="$release_news_run_id" node -e '
                const url = new URL("http://127.0.0.1:8080/internal/news/runtime-health");
                url.searchParams.set("runId", process.env.RELEASE_NEWS_RUN_ID);
                fetch(url, { signal: AbortSignal.timeout(20_000) })
                  .then((response) => response.text())
                  .then((value) => process.stdout.write(value))
                  .catch(() => process.exit(1));
              ' 2>/dev/null || true
            )"
            news_ready_value="$(
              printf '%s' "$news_body" | env EXPECTED_RELEASE_NEWS_RUN_ID="$release_news_run_id" node -e '
                let input = "";
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => {
                  try {
                    const health = JSON.parse(input);
                    const expectedRunId = Number(process.env.EXPECTED_RELEASE_NEWS_RUN_ID);
                    process.stdout.write(String(
                      health.ready === true && health.release_run?.id === expectedRunId
                    ));
                  }
                  catch { process.stdout.write("false"); }
                });
              '
            )"
            if [ "$news_ready_value" = "true" ]; then
              news_ready=1
              break
            fi
            printf '%s\n' "$news_body"
            if [ "$attempt" -lt 40 ]; then sleep 15; fi
          done
          if [ "$news_ready" -ne 1 ]; then
            echo "::error::News runtime did not prove fresh markets, assessed publisher diversity, and non-GB subject geography." >&2
            printf '%s\n' "$news_body"
            kubectl -n "${NAMESPACE}" logs deployment/claritas-api -c claritas-api --since=20m | \
              grep -E "(news_assessment|News ingestion|gdelt|GDELT|ingestion_automation)" || true
            exit 1
          fi
          printf '%s' "$news_body" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const health = JSON.parse(input);
              console.log("News runtime verified: " + health.current.count + " current; " + health.current.markets + " markets (" + health.current.publisher_verified_markets + " publisher-timed); " + health.current.publishers + " publishers; " + health.geography_24h.countries + " mapped countries; " + health.geography_24h.non_gb_stories + " non-GB stories; " + health.release_run.gdelt_gkg_sampled + " exact-run GKG rows decoded; " + health.release_run.gdelt_gkg_canonical_country_url_probes + " deterministic country/canonical persistence probes; " + health.release_run.gdelt_gkg_matched + " incidental DOC matches (" + health.release_run.gdelt_gkg_matched_country_rows + " accepted with valid country geography).");
            });
          '

          # Query every pod over its loopback interface. Standby replicas are
          # expected under advisory-lock leader election; the release requires
          # at least one current leader source, without requiring vessels to be
          # present in Fintraffic's regional reception area.
          transport_ready=0
          transport_state=""
          transport_body=""
          for attempt in $(seq 1 24); do
            echo "Transport runtime verification attempt ${attempt}/24"
            mapfile -t pods < <(
              kubectl -n "${NAMESPACE}" get pods \
                -l app=claritas-api \
                --field-selector=status.phase=Running \
                -o name
            )
            for pod in "${pods[@]}"; do
              body="$(
                timeout --signal=TERM --kill-after=5s 15s \
                  kubectl -n "${NAMESPACE}" exec "$pod" -c claritas-api -- node -e '
                  fetch("http://127.0.0.1:8080/internal/transport/runtime-health", { signal: AbortSignal.timeout(5_000) })
                    .then((response) => response.text())
                    .then((value) => process.stdout.write(value))
                    .catch(() => process.exit(1));
                ' 2>/dev/null || true
              )"
              summary="$(
                printf '%s' "$body" | node -e '
                  let input = "";
                  process.stdin.on("data", (chunk) => { input += chunk; });
                  process.stdin.on("end", () => {
                    try {
                      const health = JSON.parse(input);
                      console.log(String(health.ready === true) + " " + (health.state || "unknown"));
                    } catch {
                      console.log("false unreadable");
                    }
                  });
                '
              )"
              read -r ready state <<< "$summary"
              echo "${pod}: transport runtime ${state}"
              if [ "$ready" = "true" ] && [ "$state" = "live_primary" ]; then
                transport_ready=1
                transport_state="$state"
                transport_body="$body"
                break 2
              fi
              if [ "$ready" = "true" ] && [ "$state" = "regional_fallback" ]; then
                # Remember an honest degraded fallback, but keep the full
                # verification window open for a configured AISstream primary.
                # This prevents a fast Fintraffic poll from hiding a silent
                # primary immediately after rollout.
                transport_ready=1
                transport_state="$state"
                transport_body="$body"
              fi
            done
            if [ "$attempt" -lt 24 ]; then sleep 10; fi
          done
          if [ "$transport_ready" -ne 1 ]; then
            echo "::error::No transport leader reported a current AISstream primary or an explicit current regional fallback." >&2
            kubectl -n "${NAMESPACE}" logs deployment/claritas-api -c claritas-api --since=10m | \
              grep -E "(AISstream|aisstream_|digitraffic_maritime_refresh|barentswatch_maritime_refresh|mpa_oceans_x_maritime_refresh|Transport ingestion worker)" || true
            exit 1
          fi

          printf '%s' "$transport_body" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const health = JSON.parse(input);
              const primary = health.primary || {};
              console.log("Transport coverage: " + (health.coverage_state || "unknown") + "; primary=" + (primary.current ? "current" : "not_current") + "; scope=" + (primary.coverage || "unknown"));
              for (const source of health.regional_sources || []) {
                console.log("Regional AIS " + source.id + ": configuration=" + (source.configuration_status || (source.configured ? "configured" : "not_configured")) + "; current=" + Boolean(source.current) + "; traffic=" + Boolean(source.traffic_current) + "; fetched=" + (source.last_fetched_count ?? "n/a") + "; parsed=" + (source.last_parsed_count ?? "n/a") + "; queued=" + (source.last_queued_count ?? "n/a"));
              }
              if (primary.configured && !primary.current) {
                console.log("::warning title=AISstream primary is silent::The configured AISstream connection did not produce and persist a current vessel position during the full verification window; release coverage is regional only.");
              }
              const singapore = (health.regional_sources || []).find((source) => source.id === "mpa_oceans_x");
              if (!singapore?.configured) {
                console.log("::warning title=Singapore AIS unavailable::MPA OCEANS-X is not configured in the running ingestion leader, so Singapore has no official regional vessel fallback.");
              } else if (!singapore.current || !singapore.traffic_current) {
                console.log("::warning title=Singapore AIS has no current traffic::MPA OCEANS-X is configured but did not prove a current provider response and vessel position during release verification.");
              }
            });
          '
          if [ "$transport_state" = "regional_fallback" ]; then
            echo "::warning::Transport readiness is degraded to current official regional source coverage. It does not imply global or Singapore vessel coverage."
          else
            echo "::notice title=Transport runtime verified::AISstream primary is current for its configured subscription areas."
          fi

          # The general transport gate proves provider liveness. Prove the
          # reported Singapore regression separately against uncached persisted
          # data: at least one fresh maritime position must currently resolve to
          # SG. Flag, origin, destination and route links do not qualify.
          singapore_transport_ready=0
          singapore_transport_body=""
          for attempt in $(seq 1 24); do
            echo "Singapore maritime coverage verification attempt ${attempt}/24"
            singapore_transport_body="$(
              timeout --signal=TERM --kill-after=5s 15s \
                kubectl -n "${NAMESPACE}" exec deployment/claritas-api -c claritas-api -- node -e '
                  fetch("http://127.0.0.1:8080/internal/transport/singapore-health", { signal: AbortSignal.timeout(5_000) })
                    .then((response) => response.text())
                    .then((value) => process.stdout.write(value))
                    .catch(() => process.exit(1));
                ' 2>/dev/null || true
            )"
            singapore_transport_ready_value="$(
              printf '%s' "$singapore_transport_body" | node -e '
                let input = "";
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => {
                  try {
                    const health = JSON.parse(input);
                    process.stdout.write(String(
                      health.ready === true &&
                      health.state === "current_singapore_vessel" &&
                      health.country === "SG" &&
                      health.mode === "maritime" &&
                      health.position_basis === "current_country_iso2" &&
                      health.cache_bypassed === true &&
                      Number(health.current_vessels) > 0
                    ));
                  } catch {
                    process.stdout.write("false");
                  }
                });
              '
            )"
            if [ "$singapore_transport_ready_value" = "true" ]; then
              singapore_transport_ready=1
              break
            fi
            printf '%s\n' "$singapore_transport_body"
            if [ "$attempt" -lt 24 ]; then sleep 10; fi
          done
          if [ "$singapore_transport_ready" -ne 1 ]; then
            echo "::error::No fresh position-derived maritime entity is currently in Singapore; flag, origin, destination and route links are intentionally excluded." >&2
            printf '%s\n' "$singapore_transport_body"
            kubectl -n "${NAMESPACE}" logs deployment/claritas-api -c claritas-api --since=10m | \
              grep -E "(AISstream|aisstream_|mpa_oceans_x_maritime_refresh|MPA OCEANS-X|singapore_transport_health_failed)" || true
            exit 1
          fi
          printf '%s' "$singapore_transport_body" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const health = JSON.parse(input);
              console.log("Singapore maritime coverage verified: " + health.current_vessels + " fresh position-derived vessels; latest=" + health.latest_observed_at + "; sources=" + (health.source_names || []).join(","));
            });
          '
          kubectl -n "${NAMESPACE}" logs deployment/claritas-api -c claritas-api --since=10m | \
            grep -E "(Ingestion automation worker started|Daily briefing scheduler started|Transport ingestion worker|AISstream transport subscription connected|aisstream_subscription_started|aisstream_ingestion_progress|aisstream_idle_reconnect|digitraffic_maritime_refresh|barentswatch_maritime_refresh|mpa_oceans_x_maritime_refresh|BarentsWatch|MPA OCEANS-X)" || true

      - name: 🌐 Verify API pods use the reserved egress IP
        run: |
          set -euo pipefail
          expected="$(terraform -chdir=infra/gcp/terraform output -raw api_egress_ip)"
          mapfile -t pods < <(
            kubectl -n "${NAMESPACE}" get pods \
              -l app=claritas-api \
              --field-selector=status.phase=Running \
              -o name
          )
          if [ "${#pods[@]}" -eq 0 ]; then
            echo "::error::No running Claritas API pods were found for egress verification." >&2
            exit 1
          fi
          for pod in "${pods[@]}"; do
            actual=""
            for attempt in 1 2 3; do
              actual="$(
                timeout --signal=TERM --kill-after=5s 20s \
                  kubectl -n "${NAMESPACE}" exec "$pod" -c claritas-api -- \
                  node -e 'fetch("https://api.ipify.org", { signal: AbortSignal.timeout(10_000) }).then((response)=>response.text()).then((ip)=>process.stdout.write(ip.trim()))' \
                  2>/dev/null || true
              )"
              if [ -n "$actual" ]; then
                break
              fi
              sleep $((attempt * 5))
            done
            if [ "$actual" != "$expected" ]; then
              echo "::error::${pod} used ${actual:-an unknown address}; expected reserved egress ${expected}." >&2
              exit 1
            fi
            echo "${pod} -> ${actual}"
          done
          echo "::notice title=Verified Claritas egress::All API pods use ${expected}."

      - name: 🧪 Verify OpenCode tool-free briefing runtime
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 30s \
            kubectl -n "${NAMESPACE}" exec deployment/opencode -- node -e '
            const config = require("/home/opencode/.config/opencode/opencode.json");
            const failures = [];
            if (config.default_agent !== "briefing") failures.push("default_agent must be briefing");
            if (config.permission?.["*"] !== "deny") failures.push("global wildcard permission must be deny");
            if (config.agent?.briefing?.permission?.["*"] !== "deny") failures.push("briefing agent wildcard permission must be deny");
            if (config.tools?.bash !== false) failures.push("bash tool must be disabled");
            if (config.tools?.StructuredOutput !== false) failures.push("StructuredOutput tool must be disabled");
            if (failures.length) {
              console.error(failures.join("; "));
              process.exit(1);
            }
            console.log("OpenCode briefing runtime is tool-free.");
          '

      - name: 🔒 Check ManagedCertificate (best-effort)
        continue-on-error: true
        run: |
          for cert in claritas-app-cert claritas-auth-cert; do
            echo "ManagedCertificate status: ${cert}" || true
            kubectl -n "${NAMESPACE}" get managedcertificate "${cert}" -o yaml || true
            echo "Describe certificate: ${cert}" || true
            kubectl -n "${NAMESPACE}" describe managedcertificate "${cert}" | sed -n '1,200p' || true
          done

      - name: 🌐 Show Ingress IP and suggested DNS
        run: |
          INGRESS_IP=$(kubectl -n "${NAMESPACE}" get ingress claritas -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Ingress IP: ${INGRESS_IP}"
          echo "Add/ensure A record: ${DOMAIN} -> ${INGRESS_IP}"
          echo "Add/ensure A record: ${AUTH_DOMAIN} -> ${INGRESS_IP}"

      - name: 🌐 Ensure A record in Cloud DNS (optional)
        if: env.DNS_ZONE != ''
        run: |
          set -euo pipefail
          INGRESS_IP=$(kubectl -n "${NAMESPACE}" get ingress claritas -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Ensuring A records in zone ${DNS_ZONE} -> ${INGRESS_IP}"
          gcloud dns managed-zones describe "${DNS_ZONE}" >/dev/null

          gcloud dns record-sets transaction start --zone="${DNS_ZONE}" || true

          for host in "${DOMAIN}" "${AUTH_DOMAIN}"; do
            mapfile -t existing_records < <(
              gcloud dns record-sets list \
                --zone="${DNS_ZONE}" \
                --name="${host}." \
                --type=A \
                --flatten='rrdatas[]' \
                --format='value(rrdatas)' || true
            )
            if (( ${#existing_records[@]} > 0 )); then
              gcloud dns record-sets transaction remove \
                --zone="${DNS_ZONE}" \
                --name="${host}." \
                --type=A \
                --ttl=300 \
                "${existing_records[@]}" || true
            fi
            gcloud dns record-sets transaction add --zone="${DNS_ZONE}" --name="${host}." --type=A --ttl=300 "${INGRESS_IP}"
          done

          gcloud dns record-sets transaction execute --zone="${DNS_ZONE}"
          echo "A ${DOMAIN} and ${AUTH_DOMAIN} -> ${INGRESS_IP} ensured."

      - name: ↩️ Roll back application workloads after any failed release check
        if: ${{ always() && env.APPLICATION_ROLLBACK_ARMED == 'true' && job.status != 'success' }}
        run: |
          set -uo pipefail
          echo "::warning::A post-mutation release step failed; restoring all previously serving digest-addressed images."

          # Cancel only the run owned by this exact workflow attempt. If the
          # new API is already unavailable, stale-run reclamation remains a
          # durable fallback when the previous release resumes.
          release_run_id="${RELEASE_NEWS_RUN_ID:-}"
          if [ -z "$release_run_id" ] && [ -f "$RUNNER_TEMP/claritas-release-news-run-id" ]; then
            release_run_id="$(<"$RUNNER_TEMP/claritas-release-news-run-id")"
          fi
          if [[ "$release_run_id" =~ ^[1-9][0-9]*$ ]]; then
            mapfile -t api_pods < <(
              kubectl -n "${NAMESPACE}" get pods \
                -l app=claritas-api \
                --field-selector=status.phase=Running \
                -o name 2>/dev/null || true
            )
            for pod in "${api_pods[@]}"; do
              cancel_result="$(
                timeout --signal=TERM --kill-after=5s 20s \
                  kubectl -n "${NAMESPACE}" exec "$pod" -c claritas-api -- \
                  env RELEASE_NEWS_RUN_ID="$release_run_id" RELEASE_GATE_ID="$RELEASE_GATE_ID" node -e '
                    const url = new URL("http://127.0.0.1:8080/internal/news/refresh/" + process.env.RELEASE_NEWS_RUN_ID + "/cancel");
                    url.searchParams.set("releaseId", process.env.RELEASE_GATE_ID);
                    fetch(url, { method: "POST", signal: AbortSignal.timeout(10_000) })
                      .then(async (response) => ({ status: response.status, body: await response.json() }))
                      .then((result) => process.stdout.write(JSON.stringify(result)))
                      .catch(() => process.exit(1));
                  ' 2>/dev/null || true
              )"
              printf '%s\n' "$cancel_result"
              if printf '%s' "$cancel_result" | node -e '
                let input = "";
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => {
                  try { process.exit(JSON.parse(input).body?.cancelled === true ? 0 : 1); }
                  catch { process.exit(1); }
                });
              '; then
                break
              fi
            done
          fi

          rollback_failed=0
          restore_deployment_spec() {
            local deployment="$1"
            local snapshot="$RUNNER_TEMP/claritas-rollback-${deployment}.json"
            local patch
            if [ ! -s "$snapshot" ]; then
              echo "::error::Missing pre-apply workload snapshot for ${deployment}." >&2
              return 1
            fi
            patch="$(node -e '
              const snapshot = require(process.argv[1]);
              process.stdout.write(JSON.stringify([
                { op: "replace", path: "/spec", value: snapshot.spec },
              ]));
            ' "$snapshot")"
            kubectl -n "${NAMESPACE}" patch "deployment/${deployment}" --type=json -p "$patch"
          }
          for deployment in keycloak claritas-web claritas-api opencode; do
            if ! restore_deployment_spec "$deployment"; then
              rollback_failed=1
            fi
          done
          for deployment in keycloak claritas-web claritas-api opencode; do
            if ! kubectl -n "${NAMESPACE}" rollout status "deployment/${deployment}" --timeout=600s; then
              echo "::error::Rollback rollout failed for ${deployment}." >&2
              kubectl -n "${NAMESPACE}" describe "deployment/${deployment}" | sed -n '1,160p' || true
              rollback_failed=1
            fi
          done
          if [ "$rollback_failed" -ne 0 ]; then
            echo "::error::Application rollback was incomplete; manual intervention is required." >&2
            exit 1
          fi
          echo "::notice title=Application rollback complete::Restored all four complete pre-release workload specs with every container image digest-pinned."
