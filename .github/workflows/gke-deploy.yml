name: Build and Deploy to GKE

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build Docker Image and Push to Artifact Registry
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3

      - name: 🚀 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔐 Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"

      - name: 🏗️ Build Docker image
        run: |
          IMAGE_NAME="europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-app:${{ github.sha }}"
          echo "Building Docker image with tag: $IMAGE_NAME"
          docker build -t $IMAGE_NAME -f ./infra/docker/Dockerfile .
# inside build job
      - name: 🏗️ Build Docker image (web)
        run: |
          IMAGE_NAME="europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-app:${{ github.sha }}"
          docker build -t "$IMAGE_NAME" -f ./apps/web/Dockerfile .

      - name: 🖼️ Push Docker image to Artifact Registry
        run: |
          IMAGE_NAME="europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-app:${{ github.sha }}"
          docker push "$IMAGE_NAME"
      - name: Configure Docker for Google Cloud Artifact Registry
        run: |
          echo "Configuring Docker to use Google Cloud credentials for Artifact Registry"
          gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

      - name: 🖼️ Push Docker image to Artifact Registry
        run: |
          IMAGE_NAME="europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-app:${{ github.sha }}"
          echo "Pushing Docker image to Artifact Registry: $IMAGE_NAME"
          docker push $IMAGE_NAME

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build
    env:
      PROJECT_ID: claritas-457808
      REGION: europe-west2
      CLUSTER: claritas-cluster
      NAMESPACE: claritas
      IMAGE_URI: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-app

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3

      - name: 🔐 Authenticate to GKE with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"

      - name: 🔧 Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: 💻 Configure kubectl
        run: |
          echo "Getting GKE credentials for cluster ${CLUSTER}"
          gcloud container clusters get-credentials "${CLUSTER}" --region "${REGION}" --project "${PROJECT_ID}"
          kubectl version --client

      - name: 🔎 Debug cluster & namespace
        run: |
          echo "Context:" && kubectl config current-context
          echo "Namespaces:" && kubectl get ns -o wide
          echo "All deployments (all namespaces):" && kubectl get deploy -A -o wide || true
          echo "Resources in ${NAMESPACE}:" && kubectl -n "${NAMESPACE}" get all || true
          echo "Manifests present:" && ls -la ./infra/k8s || true

      - name: 🧭 Ensure namespace exists
        run: |
          kubectl get ns "${NAMESPACE}" || kubectl create ns "${NAMESPACE}"

      - name: 🛠️ Apply Kubernetes resources
        run: |
          echo "Applying Kubernetes resources (namespace, deployment, service, ingress)"
          # Apply manifests idempotently; if you keep a namespace.yaml, include it here
          if [ -f ./infra/k8s/namespace.yaml ]; then kubectl apply -f ./infra/k8s/namespace.yaml; fi
          kubectl apply -f ./infra/k8s/deployment.yaml -n "${NAMESPACE}"
          kubectl apply -f ./infra/k8s/service.yaml -n "${NAMESPACE}"
          if [ -f ./infra/k8s/ingress.yaml ]; then kubectl apply -f ./infra/k8s/ingress.yaml -n "${NAMESPACE}"; fi

      - name: 📤 Set image and rollout
        run: |
          IMAGE_NAME="${IMAGE_URI}:${{ github.sha }}"
          echo "Setting image for deployment claritas-app in namespace ${NAMESPACE} to ${IMAGE_NAME}"
          kubectl -n "${NAMESPACE}" set image deployment/claritas-app claritas-app="${IMAGE_NAME}"
          kubectl -n "${NAMESPACE}" rollout status deployment/claritas-app --timeout=180s

      - name: 🚀 Verify deployment
        run: |
          kubectl -n "${NAMESPACE}" get deploy
          kubectl -n "${NAMESPACE}" get pods -o wide
          kubectl -n "${NAMESPACE}" get svc
          if kubectl -n "${NAMESPACE}" get ingress >/dev/null 2>&1; then kubectl -n "${NAMESPACE}" get ingress; fi