name: Build and Deploy to GKE

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build Docker Image and Push to Artifact Registry
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3

      - name: 🚀 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🧾 Debug repo layout
        run: |
          echo "PWD=$(pwd)"
          ls -la
          echo "---- apps/web ----" && ls -la ./apps/web || true
          echo "---- apps/api ----" && ls -la ./apps/api || true

      - name: 🔐 Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"

      - name: Configure Docker for Google Cloud Artifact Registry
        run: |
          echo "Configuring Docker to use Google Cloud credentials for Artifact Registry"
          gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

      - name: 🏗️ Build Docker image (web)
        env:
          IMAGE_URI_WEB: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-web
        run: |
          test -f ./apps/web/Dockerfile || { echo "ERROR: ./apps/web/Dockerfile not found"; exit 1; }
          docker build -t "${IMAGE_URI_WEB}:${{ github.sha }}" -t "${IMAGE_URI_WEB}:latest" -f ./apps/web/Dockerfile .

      - name: 🖼️ Push Docker image (web)
        env:
          IMAGE_URI_WEB: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-web
        run: |
          docker push "${IMAGE_URI_WEB}:${{ github.sha }}"
          docker push "${IMAGE_URI_WEB}:latest"

      - name: 🏗️ Build Docker image (api)
        env:
          IMAGE_URI_API: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-api
        run: |
          test -f ./apps/api/Dockerfile || { echo "ERROR: ./apps/api/Dockerfile not found"; exit 1; }
          docker build -t "${IMAGE_URI_API}:${{ github.sha }}" -t "${IMAGE_URI_API}:latest" -f ./apps/api/Dockerfile .

      - name: 🖼️ Push Docker image (api)
        env:
          IMAGE_URI_API: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-api
        run: |
          docker push "${IMAGE_URI_API}:${{ github.sha }}"
          docker push "${IMAGE_URI_API}:latest"

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build
    env:
      PROJECT_ID: claritas-457808
      REGION: europe-west2
      CLUSTER: claritas-cluster
      NAMESPACE: claritas
      IMAGE_URI_WEB: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-web
      IMAGE_URI_API: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-api
      DOMAIN: app.claritas.info
      DNS_ZONE: ""  # set to your Cloud DNS managed zone name to auto-manage A record (optional)

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3

      - name: 🔐 Authenticate to GKE with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"

      - name: 🔧 Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: 🧰 Setup Terraform (outputs)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false

      - name: 💻 Configure kubectl
        run: |
          echo "Getting GKE credentials for cluster ${CLUSTER}"
          gcloud container clusters get-credentials "${CLUSTER}" --region "${REGION}" --project "${PROJECT_ID}"
          kubectl version --client

      - name: 🔎 Debug cluster & namespace
        run: |
          echo "Context:" && kubectl config current-context
          echo "Namespaces:" && kubectl get ns -o wide
          echo "All deployments (all namespaces):" && kubectl get deploy -A -o wide || true
          echo "Resources in ${NAMESPACE}:" && kubectl -n "${NAMESPACE}" get all || true
          echo "Manifests present:" && ls -la ./infra/k8s || true

      - name: 🧭 Ensure namespace exists
        run: |
          kubectl get ns "${NAMESPACE}" || kubectl create ns "${NAMESPACE}"

      - name: 🛡️ Apply RBAC (ServiceAccounts for Workload Identity)
        run: |
          kubectl get ns "${NAMESPACE}" || kubectl create ns "${NAMESPACE}"
          kubectl -n "${NAMESPACE}" apply -f infra/k8s/api-sa.yaml
          kubectl -n "${NAMESPACE}" apply -f infra/k8s/flyway-sa.yaml
          kubectl -n "${NAMESPACE}" apply -f infra/k8s/keycloak-sa.yaml

      - name: ⚙️ Apply ConfigMaps
        run: |
          # Ensure claritas-config (DB + auth settings) exists
          kubectl -n "${NAMESPACE}" apply -f infra/k8s/config/claritas-config.yaml
          base="${DOMAIN}"
          if [ -n "${base}" ] && [ "${base#http}" = "${base}" ]; then
            base="https://${base}"
          fi
          if [ -n "${base}" ]; then
            allowed_redirects="${base},claritas://,http://localhost:5173,http://localhost:8080"
            kubectl -n "${NAMESPACE}" patch configmap claritas-config --type merge -p "{\"data\":{\"AUTH_BASE_URL\":\"${base}\",\"AUTH_SUCCESS_REDIRECT_URL\":\"${base}/auth/success\",\"AUTH_FAILURE_REDIRECT_URL\":\"${base}/auth/error\",\"AUTH_ALLOWED_REDIRECTS\":\"${allowed_redirects}\"}}"
          fi

      - name: 🛠️ Apply Kubernetes resources
        run: |
          kubectl apply -f ./infra/k8s/web-deployment.yaml
          kubectl apply -f ./infra/k8s/web-service.yaml
          kubectl apply -f ./infra/k8s/api-deployment.yaml
          kubectl apply -f ./infra/k8s/api-service.yaml
          kubectl apply -f ./infra/k8s/keycloak-pdb.yaml
          kubectl apply -f ./infra/k8s/keycloak-deployment.yaml
          kubectl apply -f ./infra/k8s/keycloak-service.yaml
          kubectl apply -f ./infra/k8s/keycloak-bootstrap-configmap.yaml
          # Scheduled ingest CronJob
          kubectl apply -f ./infra/k8s/ingest-cronjob.yaml
          kubectl apply -f ./infra/k8s/managed-cert.yaml
          kubectl apply -f ./infra/k8s/ingress.yaml

      - name: 🔐 Ensure DB secret matches Terraform state
        env:
          NS: ${{ env.NAMESPACE }}
        run: |
          set -euo pipefail
          # Read DB name/user from the ConfigMap we just applied
          DB_NAME=$(kubectl -n "$NS" get configmap claritas-config -o jsonpath='{.data.DB_NAME}')
          DB_USER=$(kubectl -n "$NS" get configmap claritas-config -o jsonpath='{.data.DB_USER}')
          # Extract password from Terraform output (remote state via GCS backend).
          DB_PASS=""
          if terraform -chdir=infra/gcp/terraform init -input=false -backend=true; then
            DB_PASS=$(terraform -chdir=infra/gcp/terraform output -raw db_pass 2>/dev/null || true)
          else
            echo "::warning::Terraform init failed; skipping secret upsert"
          fi
          if [ -z "$DB_PASS" ] || [ "$DB_PASS" = "null" ]; then
            echo "::warning::Could not extract DB password from Terraform output; skipping secret upsert"
          else
            kubectl -n "$NS" delete secret claritas-db --ignore-not-found
            kubectl -n "$NS" create secret generic claritas-db \
              --from-literal=DB_NAME="$DB_NAME" \
              --from-literal=DB_USER="$DB_USER" \
              --from-literal=DB_PASSWORD="$DB_PASS"
          fi

      - name: 🔐 Ensure API provider secrets exist
        env:
          NS: ${{ env.NAMESPACE }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          set -euo pipefail
          # Upsert NewsAPI secret if provided
          if [ -n "${NEWSAPI_API_KEY:-}" ]; then
            kubectl -n "$NS" create secret generic claritas-newsapi \
              --from-literal=NEWSAPI_API_KEY="$NEWSAPI_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::NEWSAPI_API_KEY secret not provided; skipping claritas-newsapi upsert"
          fi

          # Upsert OpenWeather secret if provided
          if [ -n "${OPENWEATHER_API_KEY:-}" ]; then
            kubectl -n "$NS" create secret generic claritas-openweather \
              --from-literal=OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::OPENWEATHER_API_KEY secret not provided; skipping claritas-openweather upsert"
          fi

      - name: 🔐 Ensure Keycloak/API auth secrets exist
        env:
          NS: ${{ env.NAMESPACE }}
          AUTH_KEYCLOAK_CLIENT_SECRET: ${{ secrets.AUTH_KEYCLOAK_CLIENT_SECRET }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KC_IDP_GOOGLE_CLIENT_ID: ${{ secrets.KC_IDP_GOOGLE_CLIENT_ID }}
          KC_IDP_GOOGLE_CLIENT_SECRET: ${{ secrets.KC_IDP_GOOGLE_CLIENT_SECRET }}
          KC_IDP_MICROSOFT_CLIENT_ID: ${{ secrets.KC_IDP_MICROSOFT_CLIENT_ID }}
          KC_IDP_MICROSOFT_CLIENT_SECRET: ${{ secrets.KC_IDP_MICROSOFT_CLIENT_SECRET }}
          KC_IDP_MICROSOFT_TENANT: ${{ secrets.KC_IDP_MICROSOFT_TENANT }}
          KC_IDP_APPLE_CLIENT_ID: ${{ secrets.KC_IDP_APPLE_CLIENT_ID }}
          KC_IDP_APPLE_TEAM_ID: ${{ secrets.KC_IDP_APPLE_TEAM_ID }}
          KC_IDP_APPLE_KEY_ID: ${{ secrets.KC_IDP_APPLE_KEY_ID }}
          KC_IDP_APPLE_PRIVATE_KEY: ${{ secrets.KC_IDP_APPLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${KEYCLOAK_DB_PASSWORD:-}" ] || [ "${KEYCLOAK_DB_PASSWORD}" = "null" ]; then
            if terraform -chdir=infra/gcp/terraform init -input=false -backend=true; then
              KEYCLOAK_DB_PASSWORD="$(terraform -chdir=infra/gcp/terraform output -raw keycloak_db_pass 2>/dev/null || true)"
            fi
          fi

          args=()
          if [ -n "${AUTH_KEYCLOAK_CLIENT_SECRET:-}" ]; then
            args+=(--from-literal=AUTH_KEYCLOAK_CLIENT_SECRET="$AUTH_KEYCLOAK_CLIENT_SECRET")
          fi
          if [ -n "${INGEST_API_TOKEN:-}" ]; then
            args+=(--from-literal=INGEST_API_TOKEN="$INGEST_API_TOKEN")
          fi
          if [ -n "${KEYCLOAK_DB_PASSWORD:-}" ]; then
            args+=(--from-literal=KEYCLOAK_DB_PASSWORD="$KEYCLOAK_DB_PASSWORD")
          fi
          if [ -n "${KEYCLOAK_ADMIN:-}" ]; then
            args+=(--from-literal=KEYCLOAK_ADMIN="$KEYCLOAK_ADMIN")
          fi
          if [ -n "${KEYCLOAK_ADMIN_PASSWORD:-}" ]; then
            args+=(--from-literal=KEYCLOAK_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD")
          fi
          if [ -n "${KC_IDP_GOOGLE_CLIENT_ID:-}" ]; then
            args+=(--from-literal=KC_IDP_GOOGLE_CLIENT_ID="$KC_IDP_GOOGLE_CLIENT_ID")
          fi
          if [ -n "${KC_IDP_GOOGLE_CLIENT_SECRET:-}" ]; then
            args+=(--from-literal=KC_IDP_GOOGLE_CLIENT_SECRET="$KC_IDP_GOOGLE_CLIENT_SECRET")
          fi
          if [ -n "${KC_IDP_MICROSOFT_CLIENT_ID:-}" ]; then
            args+=(--from-literal=KC_IDP_MICROSOFT_CLIENT_ID="$KC_IDP_MICROSOFT_CLIENT_ID")
          fi
          if [ -n "${KC_IDP_MICROSOFT_CLIENT_SECRET:-}" ]; then
            args+=(--from-literal=KC_IDP_MICROSOFT_CLIENT_SECRET="$KC_IDP_MICROSOFT_CLIENT_SECRET")
          fi
          if [ -n "${KC_IDP_MICROSOFT_TENANT:-}" ]; then
            args+=(--from-literal=KC_IDP_MICROSOFT_TENANT="$KC_IDP_MICROSOFT_TENANT")
          fi
          if [ -n "${KC_IDP_APPLE_CLIENT_ID:-}" ]; then
            args+=(--from-literal=KC_IDP_APPLE_CLIENT_ID="$KC_IDP_APPLE_CLIENT_ID")
          fi
          if [ -n "${KC_IDP_APPLE_TEAM_ID:-}" ]; then
            args+=(--from-literal=KC_IDP_APPLE_TEAM_ID="$KC_IDP_APPLE_TEAM_ID")
          fi
          if [ -n "${KC_IDP_APPLE_KEY_ID:-}" ]; then
            args+=(--from-literal=KC_IDP_APPLE_KEY_ID="$KC_IDP_APPLE_KEY_ID")
          fi
          if [ -n "${KC_IDP_APPLE_PRIVATE_KEY:-}" ]; then
            args+=(--from-literal=KC_IDP_APPLE_PRIVATE_KEY="$KC_IDP_APPLE_PRIVATE_KEY")
          fi

          if [ "${#args[@]}" -eq 0 ]; then
            echo "::warning::No Keycloak secrets configured; auth components will not start correctly."
          else
            kubectl -n "$NS" create secret generic claritas-auth "${args[@]}" --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: 🔑 Bootstrap Keycloak realm and IdPs
        env:
          NS: ${{ env.NAMESPACE }}
        run: |
          set -euo pipefail
          kubectl -n "$NS" rollout status deployment/keycloak --timeout=600s
          job="keycloak-bootstrap-${GITHUB_RUN_ID}"
          kubectl -n "$NS" delete job "$job" --ignore-not-found=true || true
          sed -E "s/^\s*name: keycloak-bootstrap$/  name: ${job}/" infra/k8s/keycloak-bootstrap-job.yaml | kubectl -n "$NS" apply -f -
          if ! kubectl -n "$NS" wait --for=condition=complete "job/${job}" --timeout=600s; then
            echo "::error::Keycloak bootstrap job failed" >&2
            kubectl -n "$NS" describe "job/${job}" || true
            kubectl -n "$NS" logs "job/${job}" --tail=200 || true
            exit 1
          fi
          kubectl -n "$NS" logs "job/${job}" --tail=200 || true
          kubectl -n "$NS" delete "job/${job}" --wait=true || true

      - name: 🧩 Run DB migrations (Flyway)
        env:
          NS: ${{ env.NAMESPACE }}
        run: |
          set -euo pipefail
          # Upsert Flyway scripts from repo SQL directory
          kubectl -n "$NS" create configmap flyway-scripts \
            --from-file=infra/gcp/sql/ \
            --dry-run=client -o yaml | kubectl apply -f -

          # Use a unique Job name to avoid collisions across runs
          job="flyway-migrate-${GITHUB_RUN_ID}"
          kubectl -n "$NS" delete job "$job" --ignore-not-found=true || true
          # Apply manifest with a run-scoped job name
          sed -E "s/^\s*name: flyway-migrate$/  name: ${job}/" infra/k8s/migrations/flyway-job.yaml | kubectl -n "$NS" apply -f -

          # Ensure the Job object actually exists before proceeding
          echo "Waiting for job/$job to be created..."
          for i in $(seq 1 30); do
            if kubectl -n "$NS" get job "$job" >/dev/null 2>&1; then
              echo "Job $job created."
              break
            fi
            sleep 2
          done
          if ! kubectl -n "$NS" get job "$job" >/dev/null 2>&1; then
            echo "::error::Job $job was not created. Dumping diagnostics..." >&2
            echo "=== Events (tail) ===" && kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -n 50 || true
            echo "=== Validate manifest (client-side) ===" && kubectl -n "$NS" apply --dry-run=client -f infra/k8s/migrations/flyway-job.yaml || true
            echo "=== Show manifest ===" && sed -n '1,200p' infra/k8s/migrations/flyway-job.yaml || true
            exit 1
          fi

          # Wait for completion and show logs on failure
          echo "Waiting for pod of job/$job to start..."
          for i in $(seq 1 60); do
            POD=$(kubectl -n "$NS" get pods -l job-name="$job" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "${POD:-}" ]; then break; fi
            sleep 5
          done
          if [ -z "${POD:-}" ]; then
            echo "::error::No pod created for job/$job within timeout" >&2
            kubectl -n "$NS" get job "$job" -o wide || true
            exit 1
          fi
          echo "Tracking container 'flyway' in pod $POD ..."
          for i in $(seq 1 120); do
            # Always re-detect the newest pod for this job (pods can rotate on failure)
            PNEW=$(kubectl -n "$NS" get pods -l job-name="$job" --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}' 2>/dev/null || true)
            [ -n "${PNEW:-}" ] && POD="$PNEW"

            CODE=$(kubectl -n "$NS" get pod "$POD" -o jsonpath='{.status.containerStatuses[?(@.name=="flyway")].state.terminated.exitCode}' 2>/dev/null || true)
            if [ "${CODE:-}" = "0" ]; then
              echo "Flyway finished successfully (exitCode=0). Showing logs:"
              kubectl -n "$NS" logs "job/$job" -c flyway --tail=200 || true
              kubectl -n "$NS" delete job "$job" --wait=true || true
              break
            elif [ -n "${CODE:-}" ]; then
              echo "Flyway container exited with code ${CODE} (will retry if job backoff allows)"
              # Print last logs from the job, which follows the latest pod
              echo "=== Logs (flyway) ===" && kubectl -n "$NS" logs "job/$job" -c flyway --tail=200 || true
              echo "=== Logs (cloud-sql-proxy) ===" && kubectl -n "$NS" logs "job/$job" -c cloud-sql-proxy --tail=200 || true
            fi

            # Fallback success detection by logs
            LOGS=$(kubectl -n "$NS" logs "job/$job" -c flyway --tail=200 2>/dev/null || true)
            if echo "$LOGS" | grep -qiE "Successfully (applied|repaired|validated)|Schema \"public\" is up to date|Current version of schema"; then
              echo "Flyway appears successful based on logs. Cleaning up job..."
              echo "$LOGS" | sed -n '1,200p' || true
              kubectl -n "$NS" delete job "$job" --wait=true || true
              break
            fi

            # If job signals failure and no active pods, bail out
            SUC=$(kubectl -n "$NS" get job "$job" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)
            FLD=$(kubectl -n "$NS" get job "$job" -o jsonpath='{.status.failed}' 2>/dev/null || true)
            ACT=$(kubectl -n "$NS" get job "$job" -o jsonpath='{.status.active}' 2>/dev/null || true)
            if [ "${SUC:-0}" = "1" ]; then
              echo "Job succeeded. Cleaning up..."
              kubectl -n "$NS" delete job "$job" --wait=true || true
              break
            fi
            if [ "${ACT:-0}" = "0" ] && [ -n "${FLD:-}" ] && [ "${FLD:-0}" -ge 2 ]; then
              echo "::error::Job failed after retries. Dumping diagnostics..." >&2
              kubectl -n "$NS" describe job "$job" | sed -n '1,200p' || true
              kubectl -n "$NS" get pods -l job-name="$job" -o wide || true
              kubectl -n "$NS" logs "job/$job" -c flyway --tail=200 || true
              kubectl -n "$NS" logs "job/$job" -c cloud-sql-proxy --tail=200 || true
              exit 1
            fi
            sleep 5
          done

      - name: 📤 Set image and rollout (with diagnostics)
        run: |
          set -euo pipefail
          ns="${NAMESPACE}"

          # Update images to this commit
          kubectl -n "$ns" set image deployment/claritas-web claritas-web="${IMAGE_URI_WEB}:${{ github.sha }}"
          kubectl -n "$ns" set image deployment/claritas-api claritas-api="${IMAGE_URI_API}:${{ github.sha }}"

          wait_rollout () {
            local dep="$1"
            echo "⏳ Waiting for rollout of $dep ..."
            if ! kubectl -n "$ns" rollout status "deployment/${dep}" --timeout=600s; then
              echo "::warning::Rollout for ${dep} timed out — dumping diagnostics"
              echo "=== describe deployment ==="
              kubectl -n "$ns" describe deployment "${dep}" | sed -n '1,200p' || true
              echo "=== replica sets ==="
              kubectl -n "$ns" get rs -l app=${dep} -o wide || true
              local rs
              rs="$(kubectl -n "$ns" get rs -l app=${dep} -o name | tail -n1 || true)"
              if [ -n "${rs}" ]; then
                echo "=== describe $rs ==="
                kubectl -n "$ns" describe "${rs}" | sed -n '1,200p' || true
              fi
              echo "=== pods ==="
              kubectl -n "$ns" get pods -l app=${dep} -o wide || true
              for p in $(kubectl -n "$ns" get pods -l app=${dep} -o name); do
                echo "--- logs $p (all containers, last 200) ---"
                kubectl -n "$ns" logs "$p" --all-containers --tail=200 || true
              done
              exit 1
            fi
            echo "✅ ${dep} rolled out"
          }

          wait_rollout claritas-web
          wait_rollout claritas-api
          wait_rollout keycloak

      - name: 🔒 Check ManagedCertificate (best-effort)
        continue-on-error: true
        run: |
          echo "ManagedCertificate status:" || true
          kubectl -n "${NAMESPACE}" get managedcertificate claritas-web-cert -o yaml || true
          echo "Describe certificate:" || true
          kubectl -n "${NAMESPACE}" describe managedcertificate claritas-web-cert | sed -n '1,200p' || true

      - name: 🌐 Show Ingress IP and suggested DNS
        run: |
          INGRESS_IP=$(kubectl -n "${NAMESPACE}" get ingress claritas -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Ingress IP: ${INGRESS_IP}"
          echo "Add/ensure A record: ${DOMAIN} -> ${INGRESS_IP}"
          echo "Add/ensure A record: auth.claritas.info -> ${INGRESS_IP}"

      - name: 🌐 Ensure A record in Cloud DNS (optional)
        if: env.DNS_ZONE != ''
        run: |
          set -euo pipefail
          INGRESS_IP=$(kubectl -n "${NAMESPACE}" get ingress claritas -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Ensuring A record for ${DOMAIN} in zone ${DNS_ZONE} -> ${INGRESS_IP}"
          gcloud dns managed-zones describe "${DNS_ZONE}" >/dev/null

          gcloud dns record-sets transaction start --zone="${DNS_ZONE}" || true

          EXISTING=$(gcloud dns record-sets list --zone="${DNS_ZONE}" --name="${DOMAIN}." --type=A --format='value(rrdatas[])') || true
          if [ -n "${EXISTING:-}" ]; then
            gcloud dns record-sets transaction remove --zone="${DNS_ZONE}" --name="${DOMAIN}." --type=A --ttl=300 ${EXISTING} || true
          fi

          gcloud dns record-sets transaction add --zone="${DNS_ZONE}" --name="${DOMAIN}." --type=A --ttl=300 "${INGRESS_IP}"

          gcloud dns record-sets transaction execute --zone="${DNS_ZONE}"
          echo "A ${DOMAIN} -> ${INGRESS_IP} ensured."
