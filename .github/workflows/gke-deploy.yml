name: Build and Deploy to GKE

on:
  push:
    branches:
      - main
    # Runtime deployments own application images, Kubernetes manifests, and
    # Flyway scripts. Pure Terraform/docs changes do not need image builds.
    paths:
      - 'apps/**'
      - 'infra/k8s/**'
      - 'infra/gcp/sql/**'
      - 'infra/scripts/check-flyway-migrations.py'
      - 'infra/scripts/wait-for-k8s-job.sh'
      - '.github/workflows/gke-deploy.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/**'
      - 'infra/gcp/terraform/**'
      - 'infra/k8s/api-deployment.yaml'
      - 'infra/gcp/sql/**'
      - 'infra/k8s/migrations/**'
      - 'infra/scripts/check-flyway-migrations.py'
      - 'infra/scripts/wait-for-k8s-job.sh'
  workflow_dispatch:

# Terraform deployment also updates production Kubernetes configuration.
# Serialize production runs, but isolate and supersede validation runs per PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('claritas-deployment-validation-{0}', github.event.pull_request.number) || 'claritas-production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflows, migrations, and scripts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Build API and smoke-test briefing map
        working-directory: apps/api
        run: |
          npm ci
          npm run build
          node -e 'const map=require("./dist/email-map.js"); map.renderBriefingMapPng([{country_iso2:"US",country_name:"United States",relevance_score:95,news_count:4,podcast_count:1,market_count:2}]).then((image)=>{if(image.length<1000)process.exit(1);console.log(`Rendered ${image.length} byte briefing map.`);})'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Validate Terraform
        working-directory: infra/gcp/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Validate Flyway migration versions
        run: python3 infra/scripts/check-flyway-migrations.py

      - name: Check deployment shell scripts
        run: bash -n infra/scripts/wait-for-k8s-job.sh

  build:
    name: Build Docker Image and Push to Artifact Registry
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🧾 Debug repo layout
        run: |
          echo "PWD=$(pwd)"
          ls -la
          echo "---- apps/web ----"
          ls -la ./apps/web || true
          echo "---- apps/api ----"
          ls -la ./apps/api || true

      - name: 🔐 Authenticate to Google Cloud via OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"
          token_format: "access_token"
          access_token_lifetime: "3600s"

      - name: 🔑 Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-west2-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: 🏗️ Build Docker image (web)
        env:
          IMAGE_URI_WEB: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-web
        run: |
          test -f ./apps/web/Dockerfile || { echo "ERROR: ./apps/web/Dockerfile not found"; exit 1; }
          docker build -t "${IMAGE_URI_WEB}:${{ github.sha }}" -t "${IMAGE_URI_WEB}:latest" -f ./apps/web/Dockerfile .

      - name: 🖼️ Push Docker image (web)
        env:
          IMAGE_URI_WEB: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-web
        run: |
          for tag in "${{ github.sha }}" "latest"; do
            for attempt in 1 2 3; do
              if docker push "${IMAGE_URI_WEB}:${tag}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "Failed to push ${IMAGE_URI_WEB}:${tag} after ${attempt} attempts" >&2
                exit 1
              fi
              echo "Retrying ${IMAGE_URI_WEB}:${tag} (attempt ${attempt}/3)..." >&2
              sleep $((attempt * 10))
            done
          done

      - name: 🏗️ Build Docker image (api)
        env:
          IMAGE_URI_API: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-api
        run: |
          test -f ./apps/api/Dockerfile || { echo "ERROR: ./apps/api/Dockerfile not found"; exit 1; }
          docker build -t "${IMAGE_URI_API}:${{ github.sha }}" -t "${IMAGE_URI_API}:latest" -f ./apps/api/Dockerfile .

      - name: 🖼️ Push Docker image (api)
        env:
          IMAGE_URI_API: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-api
        run: |
          for tag in "${{ github.sha }}" "latest"; do
            for attempt in 1 2 3; do
              if docker push "${IMAGE_URI_API}:${tag}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "Failed to push ${IMAGE_URI_API}:${tag} after ${attempt} attempts" >&2
                exit 1
              fi
              echo "Retrying ${IMAGE_URI_API}:${tag} (attempt ${attempt}/3)..." >&2
              sleep $((attempt * 10))
            done
          done

      - name: 🏗️ Build Docker image (opencode)
        env:
          IMAGE_URI_OPENCODE: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/opencode
        run: |
          test -f ./apps/opencode/Dockerfile || { echo "ERROR: ./apps/opencode/Dockerfile not found"; exit 1; }
          docker build -t "${IMAGE_URI_OPENCODE}:${{ github.sha }}" -t "${IMAGE_URI_OPENCODE}:latest" -f ./apps/opencode/Dockerfile .

      - name: 🖼️ Push Docker image (opencode)
        env:
          IMAGE_URI_OPENCODE: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/opencode
        run: |
          for tag in "${{ github.sha }}" "latest"; do
            for attempt in 1 2 3; do
              if docker push "${IMAGE_URI_OPENCODE}:${tag}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "Failed to push ${IMAGE_URI_OPENCODE}:${tag} after ${attempt} attempts" >&2
                exit 1
              fi
              echo "Retrying ${IMAGE_URI_OPENCODE}:${tag} (attempt ${attempt}/3)..." >&2
              sleep $((attempt * 10))
            done
          done

  deploy:
    name: Deploy to GKE
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: claritas-457808
      REGION: europe-west2
      CLUSTER: claritas-cluster
      NAMESPACE: claritas
      IMAGE_URI_WEB: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-web
      IMAGE_URI_API: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-api
      IMAGE_URI_OPENCODE: europe-west2-docker.pkg.dev/claritas-457808/claritas-app/opencode
      DOMAIN: app.claritas.info
      AUTH_DOMAIN: auth.claritas.info
      DNS_ZONE: ""  # set to your Cloud DNS managed zone name to auto-manage A record (optional)

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to GKE with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"

      - name: 🔧 Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: 🧰 Setup Terraform (outputs)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false

      - name: 💻 Configure kubectl credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          use_auth_provider: false

      - name: 💻 Verify kubectl client
        run: |
          echo "Configured GKE credentials for cluster ${CLUSTER}"
          kubectl version --client

      - name: 🔎 Debug cluster & namespace
        run: |
          echo "Context:"
          kubectl config current-context
          echo "Namespaces:"
          kubectl get ns -o wide
          echo "All deployments (all namespaces):"
          kubectl get deploy -A -o wide || true
          echo "Resources in ${NAMESPACE}:"
          kubectl -n "${NAMESPACE}" get all || true
          echo "Manifests present:"
          ls -la ./infra/k8s || true

      - name: ✅ Validate manifests have no placeholder images
        run: |
          set -euo pipefail
          if grep -RIn "PLACEHOLDER" infra/k8s; then
            echo "::error::Found placeholder values in Kubernetes manifests. Replace before deploy." >&2
            exit 1
          fi

      - name: 🧭 Ensure namespace exists
        run: |
          kubectl get ns "${NAMESPACE}" || kubectl create ns "${NAMESPACE}"

      - name: 🛡️ Apply RBAC (ServiceAccounts for Workload Identity)
        run: |
          kubectl get ns "${NAMESPACE}" || kubectl create ns "${NAMESPACE}"
          kubectl -n "${NAMESPACE}" apply -f infra/k8s/api-sa.yaml
          kubectl -n "${NAMESPACE}" apply -f infra/k8s/flyway-sa.yaml
          kubectl -n "${NAMESPACE}" apply -f infra/k8s/keycloak-sa.yaml

      - name: ⚙️ Apply ConfigMaps
        env:
          BRIEFING_LLM_PROVIDER: ${{ secrets.BRIEFING_LLM_PROVIDER }}
          OPENCODE_SERVER_URL: ${{ secrets.OPENCODE_SERVER_URL }}
          OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL }}
          OPENCODE_PROVIDER_ID: ${{ secrets.OPENCODE_PROVIDER_ID }}
          OPENCODE_MODEL_ID: ${{ secrets.OPENCODE_MODEL_ID }}
          PODCAST_DISCOVERY_TERMS: ${{ vars.PODCAST_DISCOVERY_TERMS }}
          PODCAST_FEED_IDS: ${{ vars.PODCAST_FEED_IDS }}
          PODCAST_MAX_FEEDS: ${{ vars.PODCAST_MAX_FEEDS }}
          PODCAST_MAX_EPISODES_PER_FEED: ${{ vars.PODCAST_MAX_EPISODES_PER_FEED }}
          PODCAST_INTELLIGENCE_EXTRACTION_ENABLED: ${{ vars.PODCAST_INTELLIGENCE_EXTRACTION_ENABLED }}
          PODCASTINDEX_USER_AGENT: ${{ vars.PODCASTINDEX_USER_AGENT }}
        run: |
          # Ensure claritas-config (DB + auth settings) exists
          kubectl -n "${NAMESPACE}" apply -f infra/k8s/config/claritas-config.yaml
          base="${DOMAIN}"
          if [ -n "${base}" ] && [ "${base#http}" = "${base}" ]; then
            base="https://${base}"
          fi
          if [ -n "${base}" ]; then
            allowed_redirects="${base},claritas://,http://localhost:5173,http://localhost:8080"
            api_redirects="${base}/api/auth/google/callback,${base}/api/auth/microsoft/callback,${base}/api/auth/apple/callback,http://localhost:8080/api/auth/google/callback,http://localhost:8080/api/auth/microsoft/callback,http://localhost:8080/api/auth/apple/callback"
            kubectl -n "${NAMESPACE}" patch configmap claritas-config --type merge -p "{\"data\":{\"AUTH_BASE_URL\":\"${base}\",\"AUTH_SUCCESS_REDIRECT_URL\":\"${base}/auth/success\",\"AUTH_FAILURE_REDIRECT_URL\":\"${base}/auth/error\",\"AUTH_ALLOWED_REDIRECTS\":\"${allowed_redirects}\",\"AUTH_ALLOWED_REDIRECT_SCHEMES\":\"claritas\",\"KEYCLOAK_API_REDIRECT_URIS\":\"${api_redirects}\"}}"
          fi
          node <<'NODE'
          const fs = require("fs");
          const data = {};
          for (const key of [
            "BRIEFING_LLM_PROVIDER",
            "OPENCODE_SERVER_URL",
            "OPENCODE_MODEL",
            "OPENCODE_PROVIDER_ID",
            "OPENCODE_MODEL_ID",
            "PODCAST_DISCOVERY_TERMS",
            "PODCAST_FEED_IDS",
            "PODCAST_MAX_FEEDS",
            "PODCAST_MAX_EPISODES_PER_FEED",
            "PODCAST_INTELLIGENCE_EXTRACTION_ENABLED",
            "PODCASTINDEX_USER_AGENT",
          ]) {
            const value = process.env[key];
            if (value && value.trim()) data[key] = value.trim();
          }
          fs.writeFileSync("/tmp/claritas-briefing-config.json", JSON.stringify({ data }));
          NODE
          if node -e 'const patch=require("/tmp/claritas-briefing-config.json"); process.exit(Object.keys(patch.data || {}).length ? 0 : 1)'; then
            kubectl -n "${NAMESPACE}" patch configmap claritas-config --type merge -p "$(cat /tmp/claritas-briefing-config.json)"
          else
            echo "::warning::OpenCode briefing config secrets not provided; skipping claritas-config patch"
          fi

      - name: 🛠️ Apply Kubernetes resources (non-workload)
        run: |
          kubectl apply -f ./infra/k8s/api-backendconfig.yaml
          kubectl apply -f ./infra/k8s/web-service.yaml
          kubectl apply -f ./infra/k8s/api-service.yaml
          kubectl apply -f ./infra/k8s/opencode-service.yaml
          kubectl apply -f ./infra/k8s/keycloak-pdb.yaml
          kubectl apply -f ./infra/k8s/keycloak-backendconfig.yaml
          kubectl apply -f ./infra/k8s/keycloak-service.yaml
          kubectl apply -f ./infra/k8s/keycloak-bootstrap-configmap.yaml
          kubectl apply -f ./infra/k8s/keycloak-theme-configmap.yaml
          kubectl -n "${NAMESPACE}" delete managedcertificate claritas-web-cert --ignore-not-found=true
          kubectl apply -f ./infra/k8s/managed-cert.yaml
          kubectl apply -f ./infra/k8s/ingress.yaml

      - name: 🔁 Reconcile Cloud SQL user passwords from Terraform state
        run: |
          set -euo pipefail
          ./infra/scripts/terraform-init-retry.sh infra/gcp/terraform
          DB_PASS="$(terraform -chdir=infra/gcp/terraform output -raw db_pass 2>/dev/null || true)"
          KC_DB_PASS="$(terraform -chdir=infra/gcp/terraform output -raw keycloak_db_pass 2>/dev/null || true)"
          ICN="$(terraform -chdir=infra/gcp/terraform output -raw instance_connection_name 2>/dev/null || true)"
          DB_INSTANCE="${ICN##*:}"
          if [ -z "${DB_INSTANCE:-}" ] || [ "$DB_INSTANCE" = "$ICN" ]; then
            DB_INSTANCE="claritas-sql"
          fi
          if [ -z "${DB_PASS:-}" ] || [ "$DB_PASS" = "null" ]; then
            echo "::error::Could not extract db_pass from Terraform output." >&2
            exit 1
          fi
          if [ -z "${KC_DB_PASS:-}" ] || [ "$KC_DB_PASS" = "null" ]; then
            echo "::error::Could not extract keycloak_db_pass from Terraform output." >&2
            exit 1
          fi
          gcloud sql users set-password claritas_app --instance="$DB_INSTANCE" --project "${PROJECT_ID}" --password="$DB_PASS"
          gcloud sql users set-password keycloak_app --instance="$DB_INSTANCE" --project "${PROJECT_ID}" --password="$KC_DB_PASS"

      - name: 🔐 Ensure DB secret matches Terraform state
        env:
          NS: ${{ env.NAMESPACE }}
        run: |
          set -euo pipefail
          # Read DB name/user from the ConfigMap we just applied
          DB_NAME=$(kubectl -n "$NS" get configmap claritas-config -o jsonpath='{.data.DB_NAME}')
          DB_USER=$(kubectl -n "$NS" get configmap claritas-config -o jsonpath='{.data.DB_USER}')
          # Extract password from Terraform output (remote state via GCS backend).
          DB_PASS=""
          ./infra/scripts/terraform-init-retry.sh infra/gcp/terraform
          DB_PASS=$(terraform -chdir=infra/gcp/terraform output -raw db_pass 2>/dev/null || true)
          if [ -z "$DB_PASS" ] || [ "$DB_PASS" = "null" ]; then
            echo "::error::Could not extract DB password from Terraform output (db_pass). Refusing deploy to avoid broken API DB auth." >&2
            exit 1
          fi
          kubectl -n "$NS" create secret generic claritas-db \
            --from-literal=DB_NAME="$DB_NAME" \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASS" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: 🔐 Ensure API provider secrets exist
        env:
          NS: ${{ env.NAMESPACE }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          THENEWSAPI_API_TOKEN: ${{ secrets.THENEWSAPI_API_TOKEN }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PODCASTINDEX_API_KEY: ${{ secrets.PODCASTINDEX_API_KEY }}
          PODCASTINDEX_API_SECRET: ${{ secrets.PODCASTINDEX_API_SECRET }}
        run: |
          set -euo pipefail
          # Upsert NewsAPI secret if provided
          if [ -n "${NEWSAPI_API_KEY:-}" ]; then
            kubectl -n "$NS" create secret generic claritas-newsapi \
              --from-literal=NEWSAPI_API_KEY="$NEWSAPI_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::NEWSAPI_API_KEY secret not provided; skipping claritas-newsapi upsert"
          fi

          # Upsert TheNewsAPI secret if provided
          if [ -n "${THENEWSAPI_API_TOKEN:-}" ]; then
            kubectl -n "$NS" create secret generic claritas-thenewsapi \
              --from-literal=THENEWSAPI_API_TOKEN="$THENEWSAPI_API_TOKEN" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::THENEWSAPI_API_TOKEN secret not provided; skipping claritas-thenewsapi upsert"
          fi

          # Upsert OpenWeather secret if provided
          if [ -n "${OPENWEATHER_API_KEY:-}" ]; then
            kubectl -n "$NS" create secret generic claritas-openweather \
              --from-literal=OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::OPENWEATHER_API_KEY secret not provided; skipping claritas-openweather upsert"
          fi

          # Upsert Finnhub secret if provided
          if [ -n "${FINNHUB_API_KEY:-}" ]; then
            kubectl -n "$NS" create secret generic claritas-finnhub \
              --from-literal=FINNHUB_API_KEY="$FINNHUB_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::FINNHUB_API_KEY secret not provided; skipping claritas-finnhub upsert"
          fi

          # PodcastIndex uses a key and secret to sign each API request.
          if [ -n "${PODCASTINDEX_API_KEY:-}" ] && [ -n "${PODCASTINDEX_API_SECRET:-}" ]; then
            kubectl -n "$NS" create secret generic claritas-podcastindex \
              --from-literal=PODCASTINDEX_API_KEY="$PODCASTINDEX_API_KEY" \
              --from-literal=PODCASTINDEX_API_SECRET="$PODCASTINDEX_API_SECRET" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::PodcastIndex credentials not provided; podcast automation remains disabled"
          fi

      - name: 🔐 Ensure OpenCode briefing secrets exist
        env:
          NS: ${{ env.NAMESPACE }}
          OPENCODE_SERVER_USERNAME: ${{ secrets.OPENCODE_SERVER_USERNAME }}
          OPENCODE_SERVER_PASSWORD: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
          OPENCODE_CONFIG_JSON: ${{ secrets.OPENCODE_CONFIG_JSON }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${OPENCODE_SERVER_USERNAME:-}" ]; then
            args+=(--from-literal=OPENCODE_SERVER_USERNAME="$OPENCODE_SERVER_USERNAME")
          fi
          if [ -n "${OPENCODE_SERVER_PASSWORD:-}" ]; then
            args+=(--from-literal=OPENCODE_SERVER_PASSWORD="$OPENCODE_SERVER_PASSWORD")
          fi
          if [ -n "${OPENCODE_AUTH_JSON:-}" ]; then
            args+=(--from-literal=OPENCODE_AUTH_JSON="$OPENCODE_AUTH_JSON")
          fi
          if [ -n "${OPENCODE_CONFIG_JSON:-}" ]; then
            args+=(--from-literal=OPENCODE_CONFIG_JSON="$OPENCODE_CONFIG_JSON")
          fi
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            args+=(--from-literal=OPENROUTER_API_KEY="$OPENROUTER_API_KEY")
          fi
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            args+=(--from-literal=OPENAI_API_KEY="$OPENAI_API_KEY")
          fi
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            args+=(--from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY")
          fi
          if [ -n "${GOOGLE_GENERATIVE_AI_API_KEY:-}" ]; then
            args+=(--from-literal=GOOGLE_GENERATIVE_AI_API_KEY="$GOOGLE_GENERATIVE_AI_API_KEY")
          fi
          if [ -n "${GROQ_API_KEY:-}" ]; then
            args+=(--from-literal=GROQ_API_KEY="$GROQ_API_KEY")
          fi
          if [ -n "${XAI_API_KEY:-}" ]; then
            args+=(--from-literal=XAI_API_KEY="$XAI_API_KEY")
          fi
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            args+=(--from-literal=DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY")
          fi
          if [ "${#args[@]}" -gt 0 ]; then
            kubectl -n "$NS" create secret generic claritas-opencode "${args[@]}" --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::OpenCode server auth secrets not provided; skipping claritas-opencode upsert"
          fi

      - name: 🔐 Ensure Keycloak/API auth secrets exist
        env:
          NS: ${{ env.NAMESPACE }}
          AUTH_KEYCLOAK_CLIENT_SECRET: ${{ secrets.AUTH_KEYCLOAK_CLIENT_SECRET }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KC_IDP_GOOGLE_CLIENT_ID: ${{ secrets.KC_IDP_GOOGLE_CLIENT_ID }}
          KC_IDP_GOOGLE_CLIENT_SECRET: ${{ secrets.KC_IDP_GOOGLE_CLIENT_SECRET }}
          KC_IDP_MICROSOFT_CLIENT_ID: ${{ secrets.KC_IDP_MICROSOFT_CLIENT_ID }}
          KC_IDP_MICROSOFT_CLIENT_SECRET: ${{ secrets.KC_IDP_MICROSOFT_CLIENT_SECRET }}
          KC_IDP_MICROSOFT_TENANT: ${{ secrets.KC_IDP_MICROSOFT_TENANT }}
          KC_IDP_APPLE_CLIENT_ID: ${{ secrets.KC_IDP_APPLE_CLIENT_ID }}
          KC_IDP_APPLE_TEAM_ID: ${{ secrets.KC_IDP_APPLE_TEAM_ID }}
          KC_IDP_APPLE_KEY_ID: ${{ secrets.KC_IDP_APPLE_KEY_ID }}
          KC_IDP_APPLE_PRIVATE_KEY: ${{ secrets.KC_IDP_APPLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          tf_ready=0
          if ./infra/scripts/terraform-init-retry.sh infra/gcp/terraform; then
            tf_ready=1
          else
            echo "::warning::Terraform init failed in deploy job; will rely on existing cluster/GitHub secrets."
          fi

          # First fallback: existing Kubernetes secret (keeps previously working credentials stable).
          if [ -z "${KEYCLOAK_DB_PASSWORD:-}" ] || [ "${KEYCLOAK_DB_PASSWORD}" = "null" ]; then
            b64="$(kubectl -n "$NS" get secret claritas-auth -o jsonpath='{.data.KEYCLOAK_DB_PASSWORD}' 2>/dev/null || true)"
            if [ -n "${b64:-}" ]; then
              KEYCLOAK_DB_PASSWORD="$(printf '%s' "$b64" | base64 --decode 2>/dev/null || true)"
            fi
          fi
          if [ -z "${KEYCLOAK_ADMIN:-}" ]; then
            b64="$(kubectl -n "$NS" get secret claritas-auth -o jsonpath='{.data.KEYCLOAK_ADMIN}' 2>/dev/null || true)"
            if [ -n "${b64:-}" ]; then
              KEYCLOAK_ADMIN="$(printf '%s' "$b64" | base64 --decode 2>/dev/null || true)"
            fi
          fi
          if [ -z "${KEYCLOAK_ADMIN_PASSWORD:-}" ]; then
            b64="$(kubectl -n "$NS" get secret claritas-auth -o jsonpath='{.data.KEYCLOAK_ADMIN_PASSWORD}' 2>/dev/null || true)"
            if [ -n "${b64:-}" ]; then
              KEYCLOAK_ADMIN_PASSWORD="$(printf '%s' "$b64" | base64 --decode 2>/dev/null || true)"
            fi
          fi

          # Second fallback: Terraform outputs from remote state.
          if [ "${tf_ready}" -eq 1 ]; then
            if [ -z "${KEYCLOAK_DB_PASSWORD:-}" ] || [ "${KEYCLOAK_DB_PASSWORD}" = "null" ]; then
              KEYCLOAK_DB_PASSWORD="$(terraform -chdir=infra/gcp/terraform output -raw keycloak_db_pass 2>/dev/null || true)"
            fi
            if [ -z "${KEYCLOAK_ADMIN:-}" ]; then
              KEYCLOAK_ADMIN="$(terraform -chdir=infra/gcp/terraform output -raw keycloak_admin 2>/dev/null || true)"
            fi
            if [ -z "${KEYCLOAK_ADMIN_PASSWORD:-}" ]; then
              KEYCLOAK_ADMIN_PASSWORD="$(terraform -chdir=infra/gcp/terraform output -raw keycloak_admin_password 2>/dev/null || true)"
            fi
          fi

          if [ -z "${KEYCLOAK_DB_PASSWORD:-}" ] || [ "${KEYCLOAK_DB_PASSWORD}" = "null" ]; then
            echo "::error::KEYCLOAK_DB_PASSWORD is required. Provide GitHub secret KEYCLOAK_DB_PASSWORD or ensure Terraform output keycloak_db_pass is available." >&2
            exit 1
          fi
          if [ -z "${KEYCLOAK_ADMIN:-}" ]; then
            KEYCLOAK_ADMIN="admin"
          fi
          if [ -z "${KEYCLOAK_ADMIN_PASSWORD:-}" ]; then
            echo "::error::KEYCLOAK_ADMIN_PASSWORD is required. Provide GitHub secret KEYCLOAK_ADMIN_PASSWORD, or set Terraform var keycloak_admin_password and rerun terraform-deploy." >&2
            exit 1
          fi

          args=(
            --from-literal=KEYCLOAK_DB_PASSWORD="$KEYCLOAK_DB_PASSWORD"
            --from-literal=KEYCLOAK_ADMIN="$KEYCLOAK_ADMIN"
            --from-literal=KEYCLOAK_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD"
          )
          if [ -n "${AUTH_KEYCLOAK_CLIENT_SECRET:-}" ]; then
            args+=(--from-literal=AUTH_KEYCLOAK_CLIENT_SECRET="$AUTH_KEYCLOAK_CLIENT_SECRET")
          fi
          if [ -n "${INGEST_API_TOKEN:-}" ]; then
            args+=(--from-literal=INGEST_API_TOKEN="$INGEST_API_TOKEN")
          fi
          if [ -n "${KC_IDP_GOOGLE_CLIENT_ID:-}" ]; then
            args+=(--from-literal=KC_IDP_GOOGLE_CLIENT_ID="$KC_IDP_GOOGLE_CLIENT_ID")
          fi
          if [ -n "${KC_IDP_GOOGLE_CLIENT_SECRET:-}" ]; then
            args+=(--from-literal=KC_IDP_GOOGLE_CLIENT_SECRET="$KC_IDP_GOOGLE_CLIENT_SECRET")
          fi
          if [ -n "${KC_IDP_MICROSOFT_CLIENT_ID:-}" ]; then
            args+=(--from-literal=KC_IDP_MICROSOFT_CLIENT_ID="$KC_IDP_MICROSOFT_CLIENT_ID")
          fi
          if [ -n "${KC_IDP_MICROSOFT_CLIENT_SECRET:-}" ]; then
            args+=(--from-literal=KC_IDP_MICROSOFT_CLIENT_SECRET="$KC_IDP_MICROSOFT_CLIENT_SECRET")
          fi
          if [ -n "${KC_IDP_MICROSOFT_TENANT:-}" ]; then
            args+=(--from-literal=KC_IDP_MICROSOFT_TENANT="$KC_IDP_MICROSOFT_TENANT")
          fi
          if [ -n "${KC_IDP_APPLE_CLIENT_ID:-}" ]; then
            args+=(--from-literal=KC_IDP_APPLE_CLIENT_ID="$KC_IDP_APPLE_CLIENT_ID")
          fi
          if [ -n "${KC_IDP_APPLE_TEAM_ID:-}" ]; then
            args+=(--from-literal=KC_IDP_APPLE_TEAM_ID="$KC_IDP_APPLE_TEAM_ID")
          fi
          if [ -n "${KC_IDP_APPLE_KEY_ID:-}" ]; then
            args+=(--from-literal=KC_IDP_APPLE_KEY_ID="$KC_IDP_APPLE_KEY_ID")
          fi
          if [ -n "${KC_IDP_APPLE_PRIVATE_KEY:-}" ]; then
            args+=(--from-literal=KC_IDP_APPLE_PRIVATE_KEY="$KC_IDP_APPLE_PRIVATE_KEY")
          fi

          kubectl -n "$NS" create secret generic claritas-auth "${args[@]}" --dry-run=client -o yaml | kubectl apply -f -

      - name: 🌐 Ensure static API egress infrastructure exists
        run: |
          set -euo pipefail
          ./infra/scripts/terraform-init-retry.sh infra/gcp/terraform
          terraform -chdir=infra/gcp/terraform apply -auto-approve -var-file="terraform.tfvars" -lock-timeout=5m \
            -target=google_compute_address.api_egress \
            -target=google_compute_router.api_egress \
            -target=google_compute_router_nat.api_egress \
            -target=google_container_node_pool.api_egress
          EGRESS_IP="$(terraform -chdir=infra/gcp/terraform output -raw api_egress_ip)"
          echo "::notice title=Claritas static egress IP::Authorize ${EGRESS_IP} for SMTP in Brevo."

      - name: 🛠️ Apply workload deployments
        run: |
          kubectl apply -f ./infra/k8s/web-deployment.yaml
          kubectl apply -f ./infra/k8s/api-deployment.yaml
          kubectl apply -f ./infra/k8s/opencode-deployment.yaml
          kubectl apply -f ./infra/k8s/keycloak-deployment.yaml
          kubectl apply -f ./infra/k8s/ingest-cronjob.yaml

      - name: 🔑 Bootstrap Keycloak realm and IdPs
        env:
          NS: ${{ env.NAMESPACE }}
        run: |
          set -euo pipefail
          if ! kubectl -n "$NS" rollout status deployment/keycloak --timeout=600s; then
            echo "::error::Keycloak deployment rollout failed. Dumping diagnostics..." >&2
            kubectl -n "$NS" get deploy keycloak -o wide || true
            kubectl -n "$NS" describe deploy keycloak || true
            kubectl -n "$NS" get pods -l app=keycloak -o wide || true
            for p in $(kubectl -n "$NS" get pods -l app=keycloak -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true); do
              echo "=== describe pod/${p} ==="
              kubectl -n "$NS" describe pod "$p" || true
              echo "=== logs pod/${p} container=keycloak ==="
              kubectl -n "$NS" logs "$p" -c keycloak --tail=200 || true
              echo "=== logs pod/${p} container=cloud-sql-proxy ==="
              kubectl -n "$NS" logs "$p" -c cloud-sql-proxy --tail=200 || true
            done
            exit 1
          fi
          job="keycloak-bootstrap-${GITHUB_RUN_ID}"
          kubectl -n "$NS" delete job "$job" --ignore-not-found=true || true
          sed -E "s/^\s*name: keycloak-bootstrap$/  name: ${job}/" infra/k8s/keycloak-bootstrap-job.yaml | kubectl -n "$NS" apply -f -
          if ! kubectl -n "$NS" wait --for=condition=complete "job/${job}" --timeout=600s; then
            echo "::error::Keycloak bootstrap job failed" >&2
            kubectl -n "$NS" describe "job/${job}" || true
            kubectl -n "$NS" logs "job/${job}" --tail=200 || true
            exit 1
          fi
          kubectl -n "$NS" logs "job/${job}" --tail=200 || true
          kubectl -n "$NS" delete "job/${job}" --wait=true || true

      - name: 🧩 Run DB migrations (Flyway)
        env:
          NS: ${{ env.NAMESPACE }}
        run: |
          set -euo pipefail
          # Each migration Job gets an immutable view of the scripts from its
          # own commit; another deployment cannot replace its mounted ConfigMap.
          python3 infra/scripts/check-flyway-migrations.py
          scripts="flyway-scripts-${GITHUB_RUN_ID}"
          kubectl -n "$NS" create configmap "$scripts" \
            --from-file=infra/gcp/sql/ \
            --dry-run=client -o yaml | kubectl apply -f -

          # Use a unique Job name to avoid collisions across runs
          job="flyway-migrate-${GITHUB_RUN_ID}"
          cleanup_migration_artifacts() {
            kubectl -n "$NS" delete job "$job" --ignore-not-found=true --wait=false || true
            kubectl -n "$NS" delete configmap "$scripts" --ignore-not-found=true || true
          }
          trap cleanup_migration_artifacts EXIT
          kubectl -n "$NS" delete job "$job" --ignore-not-found=true || true
          # Apply manifest with a run-scoped job name
          sed -E \
            -e "s/^\s*name: flyway-migrate$/  name: ${job}/" \
            -e "s/^\s*name: flyway-scripts$/            name: ${scripts}/" \
            infra/k8s/migrations/flyway-job.yaml | kubectl -n "$NS" apply -f -

          echo "Waiting for Flyway job/$job completion..."
          if ! ./infra/scripts/wait-for-k8s-job.sh "$NS" "$job" 420; then
            echo "::error::Flyway job did not complete successfully" >&2
            kubectl -n "$NS" get job "$job" -o wide || true
            kubectl -n "$NS" describe job "$job" | sed -n '1,200p' || true
            kubectl -n "$NS" get pods -l job-name="$job" -o wide || true
            kubectl -n "$NS" logs "job/$job" -c flyway --tail=200 || true
            kubectl -n "$NS" logs "job/$job" -c cloud-sql-proxy --tail=200 || true
            exit 1
          fi
          kubectl -n "$NS" logs "job/$job" -c flyway --tail=200 || true

      - name: ✅ Verify DB schema and migration history
        env:
          NS: ${{ env.NAMESPACE }}
        run: |
          set -euo pipefail
          job="db-verify-${GITHUB_RUN_ID}"
          cleanup_verify_job() {
            kubectl -n "$NS" delete job "$job" --ignore-not-found=true --wait=false || true
          }
          trap cleanup_verify_job EXIT
          kubectl -n "$NS" delete job "$job" --ignore-not-found=true || true
          sed -E "s/^\s*name: db-verify$/  name: ${job}/" infra/k8s/migrations/db-verify-job.yaml | kubectl -n "$NS" apply -f -
          if ! ./infra/scripts/wait-for-k8s-job.sh "$NS" "$job" 600; then
            echo "::error::DB verification failed" >&2
            kubectl -n "$NS" describe "job/${job}" || true
            kubectl -n "$NS" logs "job/${job}" -c db-verify --tail=200 || true
            kubectl -n "$NS" logs "job/${job}" -c cloud-sql-proxy --tail=200 || true
            exit 1
          fi
          kubectl -n "$NS" logs "job/${job}" -c db-verify --tail=200 || true

      - name: 📤 Set image and rollout (with diagnostics)
        run: |
          set -euo pipefail
          ns="${NAMESPACE}"

          # Update images to this commit
          kubectl -n "$ns" set image deployment/claritas-web claritas-web="${IMAGE_URI_WEB}:${{ github.sha }}"
          kubectl -n "$ns" set image deployment/claritas-api claritas-api="${IMAGE_URI_API}:${{ github.sha }}"
          kubectl -n "$ns" set image deployment/opencode opencode="${IMAGE_URI_OPENCODE}:${{ github.sha }}"
          kubectl -n "$ns" rollout restart deployment/claritas-api
          kubectl -n "$ns" rollout restart deployment/opencode

          wait_rollout () {
            local dep="$1"
            echo "⏳ Waiting for rollout of $dep ..."
            if ! kubectl -n "$ns" rollout status "deployment/${dep}" --timeout=600s; then
              echo "::warning::Rollout for ${dep} timed out — dumping diagnostics"
              echo "=== describe deployment ==="
              kubectl -n "$ns" describe deployment "${dep}" | sed -n '1,200p' || true
              echo "=== replica sets ==="
              kubectl -n "$ns" get rs -l "app=${dep}" -o wide || true
              local rs
              rs="$(kubectl -n "$ns" get rs -l "app=${dep}" -o name | tail -n1 || true)"
              if [ -n "${rs}" ]; then
                echo "=== describe $rs ==="
                kubectl -n "$ns" describe "${rs}" | sed -n '1,200p' || true
              fi
              echo "=== pods ==="
              kubectl -n "$ns" get pods -l "app=${dep}" -o wide || true
              while IFS= read -r p; do
                echo "--- logs $p (all containers, last 200) ---"
                kubectl -n "$ns" logs "$p" --all-containers --tail=200 || true
              done < <(kubectl -n "$ns" get pods -l "app=${dep}" -o name)
              exit 1
            fi
            echo "✅ ${dep} rolled out"
          }

          wait_rollout claritas-web
          wait_rollout claritas-api
          wait_rollout opencode
          wait_rollout keycloak

      - name: 🌐 Verify API pods use the reserved egress IP
        run: |
          set -euo pipefail
          expected="$(terraform -chdir=infra/gcp/terraform output -raw api_egress_ip)"
          mapfile -t pods < <(
            kubectl -n "${NAMESPACE}" get pods \
              -l app=claritas-api \
              --field-selector=status.phase=Running \
              -o name
          )
          if [ "${#pods[@]}" -eq 0 ]; then
            echo "::error::No running Claritas API pods were found for egress verification." >&2
            exit 1
          fi
          for pod in "${pods[@]}"; do
            actual=""
            for attempt in 1 2 3; do
              actual="$(
                kubectl -n "${NAMESPACE}" exec "$pod" -c claritas-api -- \
                  node -e 'fetch("https://api.ipify.org").then((response)=>response.text()).then((ip)=>process.stdout.write(ip.trim()))' \
                  2>/dev/null || true
              )"
              if [ -n "$actual" ]; then
                break
              fi
              sleep $((attempt * 5))
            done
            if [ "$actual" != "$expected" ]; then
              echo "::error::${pod} used ${actual:-an unknown address}; expected reserved egress ${expected}." >&2
              exit 1
            fi
            echo "${pod} -> ${actual}"
          done
          echo "::notice title=Verified Claritas egress::All API pods use ${expected}."

      - name: 🧪 Verify OpenCode tool-free briefing runtime
        run: |
          set -euo pipefail
          kubectl -n "${NAMESPACE}" exec deployment/opencode -- node -e '
            const config = require("/home/opencode/.config/opencode/opencode.json");
            const failures = [];
            if (config.default_agent !== "briefing") failures.push("default_agent must be briefing");
            if (config.permission?.["*"] !== "deny") failures.push("global wildcard permission must be deny");
            if (config.agent?.briefing?.permission?.["*"] !== "deny") failures.push("briefing agent wildcard permission must be deny");
            if (config.tools?.bash !== false) failures.push("bash tool must be disabled");
            if (config.tools?.StructuredOutput !== false) failures.push("StructuredOutput tool must be disabled");
            if (failures.length) {
              console.error(failures.join("; "));
              process.exit(1);
            }
            console.log("OpenCode briefing runtime is tool-free.");
          '

      - name: 🔒 Check ManagedCertificate (best-effort)
        continue-on-error: true
        run: |
          for cert in claritas-app-cert claritas-auth-cert; do
            echo "ManagedCertificate status: ${cert}" || true
            kubectl -n "${NAMESPACE}" get managedcertificate "${cert}" -o yaml || true
            echo "Describe certificate: ${cert}" || true
            kubectl -n "${NAMESPACE}" describe managedcertificate "${cert}" | sed -n '1,200p' || true
          done

      - name: 🌐 Show Ingress IP and suggested DNS
        run: |
          INGRESS_IP=$(kubectl -n "${NAMESPACE}" get ingress claritas -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Ingress IP: ${INGRESS_IP}"
          echo "Add/ensure A record: ${DOMAIN} -> ${INGRESS_IP}"
          echo "Add/ensure A record: ${AUTH_DOMAIN} -> ${INGRESS_IP}"

      - name: 🌐 Ensure A record in Cloud DNS (optional)
        if: env.DNS_ZONE != ''
        run: |
          set -euo pipefail
          INGRESS_IP=$(kubectl -n "${NAMESPACE}" get ingress claritas -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Ensuring A records in zone ${DNS_ZONE} -> ${INGRESS_IP}"
          gcloud dns managed-zones describe "${DNS_ZONE}" >/dev/null

          gcloud dns record-sets transaction start --zone="${DNS_ZONE}" || true

          for host in "${DOMAIN}" "${AUTH_DOMAIN}"; do
            mapfile -t existing_records < <(
              gcloud dns record-sets list \
                --zone="${DNS_ZONE}" \
                --name="${host}." \
                --type=A \
                --flatten='rrdatas[]' \
                --format='value(rrdatas)' || true
            )
            if (( ${#existing_records[@]} > 0 )); then
              gcloud dns record-sets transaction remove \
                --zone="${DNS_ZONE}" \
                --name="${host}." \
                --type=A \
                --ttl=300 \
                "${existing_records[@]}" || true
            fi
            gcloud dns record-sets transaction add --zone="${DNS_ZONE}" --name="${host}." --type=A --ttl=300 "${INGRESS_IP}"
          done

          gcloud dns record-sets transaction execute --zone="${DNS_ZONE}"
          echo "A ${DOMAIN} and ${AUTH_DOMAIN} -> ${INGRESS_IP} ensured."
