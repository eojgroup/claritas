name: Trigger Ingest (manual)

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Kubernetes namespace
        required: false
        default: claritas

permissions:
  id-token: write
  contents: read

jobs:
  run:
    name: Run CronJob once
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: claritas-457808
      REGION: europe-west2
      CLUSTER: claritas-cluster
      NAMESPACE: ${{ github.event.inputs.namespace || 'claritas' }}

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v3

      - name: 🔐 Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"

      - name: ☁️ Setup gcloud + GKE auth plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: 💻 Get cluster credentials
        run: |
          gcloud container clusters get-credentials "${CLUSTER}" --region "${REGION}" --project "${PROJECT_ID}"

      - name: 🧭 Ensure namespace and CronJob exist
        run: |
          kubectl get ns "${NAMESPACE}" || kubectl create ns "${NAMESPACE}"
          kubectl -n "${NAMESPACE}" apply -f infra/k8s/ingest-cronjob.yaml

      - name: ▶️ Create one-off Job from CronJob and stream logs
        run: |
          set -euo pipefail
          ns="${NAMESPACE}"
          base="claritas-ingest-newsapi"
          name="${base}-manual-$(date +%s)"
          echo "Creating job $name from cronjob/$base in namespace $ns"
          kubectl -n "$ns" create job "$name" --from=cronjob/$base

          echo "Waiting for pod to start..."
          for i in $(seq 1 60); do
            POD=$(kubectl -n "$ns" get pods -l job-name="$name" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "${POD:-}" ]; then break; fi
            sleep 2
          done
          if [ -z "${POD:-}" ]; then
            echo "::error::No pod created for job/$name"; exit 1; fi

          echo "Streaming logs for $POD ..."
          kubectl -n "$ns" logs -f "$POD" --timestamps --prefix=true || true

          echo "Job status:" && kubectl -n "$ns" get job "$name" -o wide
          kubectl -n "$ns" describe job "$name" | sed -n '1,200p' || true

      - name: ✅ Verify API endpoints (best effort)
        continue-on-error: true
        run: |
          echo "News count by country:" && curl -sf https://app.claritas.info/api/news/country-stats?days=30 | jq .  || true
          echo "Weather latest:" && curl -sf https://app.claritas.info/api/weather/country-latest | jq .  || true

