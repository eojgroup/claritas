name: Ingest Weather (manual)

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Kubernetes namespace
        required: false
        default: claritas
      country:
        description: Optional ISO2 country code (limits to one)
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  run:
    name: Run OpenWeather ingest once
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: claritas-457808
      REGION: europe-west2
      CLUSTER: claritas-cluster
      NAMESPACE: ${{ github.event.inputs.namespace || 'claritas' }}
      COUNTRY: ${{ github.event.inputs.country || '' }}

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v3

      - name: 🔐 Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"

      - name: ☁️ Setup gcloud + GKE auth plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: 💻 Get cluster credentials
        run: |
          gcloud container clusters get-credentials "${CLUSTER}" --region "${REGION}" --project "${PROJECT_ID}"

      - name: 🧭 Ensure namespace exists
        run: |
          kubectl get ns "${NAMESPACE}" || kubectl create ns "${NAMESPACE}"

      - name: 🧩 Run DB migrations (Flyway)
        env:
          NS: ${{ env.NAMESPACE }}
        run: |
          set -euo pipefail
          # Upsert Flyway scripts from repo SQL directory
          kubectl -n "$NS" create configmap flyway-scripts \
            --from-file=infra/gcp/sql/ \
            --dry-run=client -o yaml | kubectl apply -f -

          # Recreate and apply the Job
          kubectl -n "$NS" delete job flyway-migrate --ignore-not-found=true || true
          kubectl -n "$NS" apply -f infra/k8s/migrations/flyway-job.yaml

          # Wait for completion (best-effort diagnostics on failure)
          echo "Waiting for pod of job/flyway-migrate to start..."
          for i in $(seq 1 60); do
            POD=$(kubectl -n "$NS" get pods -l job-name=flyway-migrate -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            [ -n "${POD:-}" ] && break
            sleep 5
          done
          if [ -z "${POD:-}" ]; then
            echo "::error::No pod created for job/flyway-migrate within timeout" >&2
            kubectl -n "$NS" get job flyway-migrate -o wide || true
            exit 1
          fi
          echo "Tracking container 'flyway' in pod $POD ..."
          if ! kubectl -n "$NS" wait --for=condition=complete job/flyway-migrate --timeout=300s; then
            echo "::error::Flyway job did not complete successfully" >&2
            echo "=== Logs (flyway) ===" && kubectl -n "$NS" logs job/flyway-migrate -c flyway --tail=200 || true
            echo "=== Logs (cloud-sql-proxy) ===" && kubectl -n "$NS" logs job/flyway-migrate -c cloud-sql-proxy --tail=200 || true
            exit 1
          fi
          kubectl -n "$NS" logs job/flyway-migrate -c flyway --tail=200 || true
          kubectl -n "$NS" delete job flyway-migrate --wait=true || true

      - name: ▶️ Run OpenWeather ingest inside cluster
        run: |
          set -euo pipefail
          ns="${NAMESPACE}"
          name="ingest-weather-$(date +%s)"
          script='BASE="http://claritas-api.claritas.svc.cluster.local:8080";
            payload="{}";
            if [ -n "${COUNTRY:-}" ]; then payload="{\"country\":\"${COUNTRY}\"}"; fi;
            echo "> openweather/country-current payload: ${payload}";
            curl --fail --show-error --silent --retry 3 --max-time 180 -H "content-type: application/json" \
              -d "${payload}" \
              "$BASE/api/ingest/openweather/country-current"; echo;'

          # Use a short pod so we can stream logs easily. Pass COUNTRY env to the pod.
          kubectl -n "$ns" run "$name" --image=curlimages/curl:8.10.1 --restart=Never --env=COUNTRY="${COUNTRY}" -- /bin/sh -ceu "$script"
          echo "Waiting for pod..."; sleep 2
          kubectl -n "$ns" wait --for=condition=Ready pod/"$name" --timeout=120s || true
          echo "Streaming logs:"; kubectl -n "$ns" logs -f "$name" || true
          kubectl -n "$ns" delete pod "$name" --wait=true || true

      - name: ✅ Verify Weather latest (best effort)
        continue-on-error: true
        run: |
          curl -sf https://app.claritas.info/api/weather/country-latest | jq . || true
