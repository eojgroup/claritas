name: Ingest News (manual)

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Kubernetes namespace
        required: false
        default: claritas

permissions:
  id-token: write
  contents: read

jobs:
  run:
    name: Run News ingests once
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: claritas-457808
      REGION: europe-west2
      CLUSTER: claritas-cluster
      NAMESPACE: ${{ github.event.inputs.namespace || 'claritas' }}

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v3

      - name: 🔐 Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"

      - name: ☁️ Setup gcloud + GKE auth plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: 💻 Get cluster credentials
        run: |
          gcloud container clusters get-credentials "${CLUSTER}" --region "${REGION}" --project "${PROJECT_ID}"

      - name: 🧭 Ensure namespace exists
        run: |
          kubectl get ns "${NAMESPACE}" || kubectl create ns "${NAMESPACE}"

      - name: ▶️ Run News ingests inside cluster
        run: |
          set -euo pipefail
          ns="${NAMESPACE}"
          name="ingest-news-$(date +%s)"
          script='BASE="http://claritas-api.claritas.svc.cluster.local:8080";
            echo "Running NewsAPI ingests...";
            echo "> everything (q=OpenAI)";
            curl --fail --show-error --silent --retry 3 --max-time 180 -H "content-type: application/json" \
              -d "{\"q\":\"OpenAI\",\"pageSize\":50,\"maxPages\":2}" \
              "$BASE/api/ingest/newsapi/everything"; echo;
            echo "> top-headlines (country=us, category=technology)";
            curl --fail --show-error --silent --retry 3 --max-time 180 -H "content-type: application/json" \
              -d "{\"country\":\"us\",\"category\":\"technology\",\"pageSize\":50,\"maxPages\":2}" \
              "$BASE/api/ingest/newsapi/top-headlines"; echo;
            echo "Done."'

          kubectl -n "$ns" run "$name" --image=curlimages/curl:8.10.1 --restart=Never -- /bin/sh -ceu "$script"
          echo "Waiting for pod..."; sleep 2
          kubectl -n "$ns" wait --for=condition=Ready pod/"$name" --timeout=120s || true
          echo "Streaming logs:"; kubectl -n "$ns" logs -f "$name" || true
          kubectl -n "$ns" delete pod "$name" --wait=true || true

      - name: ✅ Verify News stats (best effort)
        continue-on-error: true
        run: |
          curl -sf https://app.claritas.info/api/news/country-stats?days=30 | jq . || true

