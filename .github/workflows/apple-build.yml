name: Build Apple clients

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/ios/**'
      - '.github/workflows/apple-build.yml'
  pull_request:
    paths:
      - 'apps/mobile/ios/**'
      - '.github/workflows/apple-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile iPhone, iPad, and Watch
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Validate generated project contracts
        working-directory: apps/mobile/ios
        run: |
          gem install xcodeproj --no-document
          ruby validate_xcodeproj.rb

      - name: Compile universal iOS and iPadOS application
        working-directory: apps/mobile/ios/Claritas
        run: |
          xcodebuild \
            -project Claritas.xcodeproj \
            -scheme Claritas \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compile watchOS application
        working-directory: apps/mobile/ios/Claritas
        run: |
          xcodebuild \
            -project Claritas.xcodeproj \
            -target 'Claritas Watch App' \
            -configuration Debug \
            -sdk watchsimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
