name: GKE Deploy via OIDC

on:
  push:
    branches: [main]

permissions:
  id-token: write   # Required for OIDC
  contents: read    # Required to clone the repo

jobs:
  deploy:
    name: Deploy to GKE via OIDC
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v3

      - name: ⚙️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v0
        with:
          project_id: claritas-457808
          version: '352.0.0'  # Specify your required GCP version

      - name: 🔐 Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "gke-deploy-oidc@claritas-457808.iam.gserviceaccount.com"  # Replace with your service account

      - name: Set up kubectl for GKE
        run: |
          gcloud container clusters get-credentials claritas-cluster --region us-central1 --project claritas-457808

      - name: 🚀 Deploy to GKE
        run: |
          kubectl apply -f deployment.yaml  # Use your deployment YAML here