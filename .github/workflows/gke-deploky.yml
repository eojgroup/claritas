name: Build and Deploy to GKE

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build Docker Image and Push to Artifact Registry
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3

      - name: 🚀 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔐 Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"

      - name: 🏗️ Build Docker image
        run: |
          IMAGE_NAME="europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-app:${{ github.sha }}"
          echo "Building Docker image with tag: $IMAGE_NAME"
          docker build -t $IMAGE_NAME -f ./infra/docker/Dockerfile .

      - name: Configure Docker for Google Cloud Artifact Registry
        run: |
          echo "Configuring Docker to use Google Cloud credentials for Artifact Registry"
          gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

      - name: 🖼️ Push Docker image to Artifact Registry
        run: |
          IMAGE_NAME="europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-app:${{ github.sha }}"
          echo "Pushing Docker image to Artifact Registry: $IMAGE_NAME"
          docker push $IMAGE_NAME

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3

      - name: 🔐 Authenticate to GKE with OIDC
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"

      - name: Install Google Cloud SDK
        run: |
          curl -sSL https://sdk.cloud.google.com | bash
          exec -l $SHELL
          gcloud components update

      - name: Install GKE gcloud auth plugin via official method
        run: |
          # Add the Google Cloud public key to trusted keys
          curl -sSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo tee /usr/share/keyrings/cloud.google.gpg > /dev/null
            
          # Add the Cloud SDK repository
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
            
          # Update apt and install the necessary plugin
          sudo apt-get update
          sudo apt-get install google-cloud-sdk-gke-gcloud-auth-plugin

      - name: 💻 Configure kubectl
        run: |
          echo "Getting GKE credentials for cluster claritas-cluster"
          gcloud container clusters get-credentials claritas-cluster --region europe-west2 --project claritas-457808

      - name: 📤 Apply Kubernetes deployment
        run: |
          IMAGE_NAME="europe-west2-docker.pkg.dev/claritas-457808/claritas-app/claritas-app:${{ github.sha }}"
          echo "Setting image for deployment claritas-app to $IMAGE_NAME"
          kubectl set image deployment/claritas-app claritas-app=$IMAGE_NAME
          kubectl rollout status deployment/claritas-app

      - name: 🛠️ Apply Kubernetes resources
        run: |
          echo "Applying Kubernetes resources (deployment, service, ingress)"
          kubectl apply -f ./infra/k8s/deployment.yaml
          kubectl apply -f ./infra/k8s/service.yaml
          kubectl apply -f ./infra/k8s/ingress.yaml

      - name: 🚀 Verify deployment
        run: |
          kubectl get pods
          kubectl get svc