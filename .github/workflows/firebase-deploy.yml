name: Firebase Hosting Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write  # Required for OIDC
  contents: read   # Required to clone repo

jobs:
  deploy:
    name: 🔥 Deploy to Firebase Hosting
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Install & Build
        run: |
          npm install
          npm run build

      - name: 🔐 Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: "projects/920949118609/locations/global/workloadIdentityPools/claritas-oidc-pool/providers/gh-provider"
          service_account: "terraform-github-oidc@claritas-457808.iam.gserviceaccount.com"
        
      - name: 🚀 Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          channelId: live
          projectId: claritas-457808
          entryPoint: apps/web   # 🛠️ <--- NEW: tell it where firebase.json is!
          firebaseServiceAccount: "${{ steps.auth.outputs.credentials_file_path }}"  # 👈 Now it knows where to find the service account file